  ],
  lab: {
    id: 'lab-m11', title: 'Three of four GPUs', ticket: 'Ticket 4570 · srv-r07-u12', sev: 'P2', xp: 70,
    brief: `<p>The build sheet says four GPUs; the customer's job only sees three. Run Playbook B: count at each layer, read the logs, find the slot on the topology, then put your hands on the right part.</p>`,

MODULES.push({
  id: 'm12', n: 12, title: 'Related Topics Worth Knowing', tagline: 'High-speed links, GPU tools, liquid cooling, firmware, terms, subnets',
  lead: 'These topics sit next to the core material. They may not be on your version of the assessment, but they come up on the job — especially on AI and GPU server lines.',
  topo: () => topoCluster(baseRig()),
  lessons: [
    {h: 'High-speed networking', body: `
      <ul><li>Data center ports run from 1 and 10 Gb/s (management) up to 100, 200, 400, and 800 Gb/s on AI servers. <b>InfiniBand</b> is a separate high-speed network common in AI clusters, with its own tools (<code>ibstat</code>).</li>
      <li><b>Transceivers</b> (QSFP, OSFP) plug into the NIC. Cables are <b>DAC</b> (copper, short runs), <b>AOC</b> (active optical), or separate fiber.</li>
      <li><b>Dirty fiber connectors are one of the most common causes of link problems.</b> Never touch the end of a connector, keep dust caps on, and inspect and clean before plugging in. Do not bend fiber tightly.</li>
      <li><code>ethtool -m eth0</code> shows transceiver details. A <b>link flap</b> (link going up and down) points to the cable, transceiver, or connector cleanliness.</li></ul>`, widget: 'fiberCare'},
    {h: 'GPU diagnostics', body: `
      <ul><li><code>nvidia-smi -q</code> shows each GPU's serial, VBIOS version, temperatures, power, and GPU memory ECC errors.</li>
      <li><code>nvidia-smi topo -m</code> shows how GPUs connect to each other and to NICs (NVLink, PCIe switch, or across CPUs): the software version of the topology diagram.</li>
      <li><b>NVLink</b> connects GPUs directly. A GPU can be detected but have a failed NVLink, which shows as errors or slow performance.</li>
      <li><b>Xid errors</b> are numbered NVIDIA driver errors in the kernel log. Look up the number (Xid 79 is "fallen off the bus").</li>
      <li><b>DCGM</b> (<code>dcgmi diag</code>) runs NVIDIA's health and stress tests on data center GPUs.</li></ul>`},
    {h: 'Liquid cooling', body: `<p>Many AI servers cool CPUs and GPUs with <b>cold plates, hoses, and quick-disconnect fittings</b> connected to a coolant distribution unit. Follow the procedure exactly when connecting lines, <b>never force a fitting</b>, check for leaks before and after any work, and treat a <b>leak sensor event</b> in the BMC log as serious. If a liquid-cooled part overheats, check coolant flow and temperature the way you would check fans.</p>`},
    {h: 'Firmware updates', body: `<p>Install only <b>approved</b> versions (the newest is not always approved), <b>record versions before and after</b>, <b>never power off or reset during an update</b>, follow the documented order (for example BMC before BIOS if required), and <b>retest</b> afterward.</p>`, widget: 'fwOrder'},

      <li><code>command | tee out.txt</code> shows output and saves it. <code>watch -n 1 nvidia-smi</code> reruns a command every second.</li>
      <li>A loop repeats a test to reproduce intermittent failures: <code>for i in $(seq 1 20); do ./test.sh &gt;&gt; results.txt; done</code></li>
      <li>A /24 subnet has 254 usable addresses. 10.1.1.20/24 and 10.1.1.200/24 are on the same subnet; 10.1.1.20/24 and 10.1.2.20/24 are not, so traffic between them goes through the gateway. A wrong mask can make some devices reachable and others not.</li></ul>`, widget: 'subnet'}
  ],
  check: [
    {q: 'What is one of the most common causes of fiber link problems, and how do you prevent it?', a: 'Dirty fiber connectors. Never touch the end of a connector, keep dust caps on, inspect and clean before plugging in, and do not bend fiber tightly.'},

function annotator(parts, intro) {

}

const SAMPLE_LOG = ['Oct  1 02:40:58 srv-r07-u12 systemd[1]: Started burnin.service.', 'Oct  1 02:41:10 srv-r07-u12 kernel: nvme nvme3: I/O 512 QID 7 timeout, aborting', 'Oct  1 02:41:40 srv-r07-u12 kernel: nvme nvme3: I/O 77 QID 3 timeout, reset controller', 'Oct  1 02:41:41 srv-r07-u12 fio-burnin[4410]: TIMEOUT waiting for /dev/nvme3n1 (retry 1 of 3)', 'Oct  1 03:00:01 srv-r07-u12 CROND[5012]: (root) CMD (run-parts /etc/cron.hourly)', 'Oct  1 03:12:44 srv-r07-u12 kernel: EDAC MC0: 1 CE memory read error on DIMM B2', 'Oct  1 04:15:03 srv-r07-u12 kernel: nvme nvme3: I/O 203 QID 12 timeout, aborting', 'Oct  1 05:20:17 srv-r07-u12 sshd[6120]: Failure: authentication for user guest', 'Oct  1 05:20:19 srv-r07-u12 sshd[6120]: Connection closed by 10.20.5.200', 'Oct  1 06:00:00 srv-r07-u12 systemd[1]: Finished logrotate.service.'].join('\n') + '\n';
WIDGETS.grepLab = () => {
  const mini = {files: {'/var/log/syslog': SAMPLE_LOG, '/var/log/test/run1.log': 'run 1: PASS\nrun 2: timeout on nvme3\nrun 3: PASS\n'}, gen: {}, dirs: new Set(['/', '/var', '/var/log', '/var/log/test']), cwd: '/home/tech'};

  const desc = {i: 'Ignore case (matches timeout and TIMEOUT)', n: 'Show line numbers', c: 'Count matching lines', r: 'Search a folder and its subfolders', v: 'Show lines that do NOT match', C: 'Show 1 line of context around each match (-C 1)'};

/* M3 */
WIDGETS.layerQuiz = () => {
  const Q = [['A NIC shows in <code>lspci</code>, but <code>lspci -k</code> has no "Kernel driver in use" line.', 3, 'Driver layer. The hardware is on the bus; do not replace the card.'], ['<code>lspci | grep -i nvidia | wc -l</code> prints 3, but the build sheet says 4 GPUs.', 2, 'Bus layer: one GPU is not on the bus. Next, check BIOS/BMC inventory and go physical (seating, power cable, slot, riser, retimer).'], ['BIOS inventory does not list the new NVMe drive and its bay LED is dark.', 1, 'Physical layer (or firmware): seating, cable, power, backplane.'], ['A GPU appears in <code>lspci</code> and <code>nvidia-smi</code>, but the GPU stress test fails with errors.', 4, 'Function layer: it is detected and has a driver, but it does not work correctly. Run the full test, check logs (Xid), temperatures and power.']];

/* M4 */
WIDGETS.pcieCalc = () => {
  const st = {dg: 5, dw: 16, sg: 4, sw: 16, tw: 16};
  const out = h('div', {class: 'stack'});
  const mk = (lab, key, opts) => h('div', {class: 'stack', style: 'gap:4px'}, h('span', {class: 'eyebrow'}, lab), seg(opts, st[key], v => { st[key] = v; draw(); }));
  const draw = () => {
    const gen = Math.min(st.dg, st.sg); const gt = {3: 8, 4: 16, 5: 32, 6: 64}[gen];
    const capW = Math.min(st.dw, st.sw); const w = Math.min(capW, st.tw);
    const gbs = gt * w / 8 * 0.985; const capGbs = {3: 8, 4: 16, 5: 32, 6: 64}[st.dg] * st.dw / 8 * 0.985;
    out.innerHTML = `<div class="row" style="gap:28px"><div><div class="eyebrow">Link trains at</div><div class="bigval">Gen ${gen} x${w}</div></div><div><div class="eyebrow">Each direction</div><div class="bigval tnum">≈ ${gbs.toFixed(1)} GB/s</div></div><div><div class="eyebrow">Card could do</div><div class="bigval tnum" style="color:var(--ink-3)">${capGbs.toFixed(1)} GB/s</div></div></div>
      <div class="meter" aria-hidden="true"><i style="width:${Math.min(100, gbs / capGbs * 100)}%"></i></div>
      <pre class="out">		LnkCap:	Port #0, Speed ${({3: 8, 4: 16, 5: 32, 6: 64})[st.dg]}GT/s, Width x${st.dw}
		LnkSta:	Speed ${gt}GT/s${gen < st.dg ? ' (downgraded)' : ''}, Width x${w}${w < st.dw ? ' (downgraded)' : ''}</pre>
      <p class="muted" style="font-size:.88rem">Math: ${gt} GT/s × ${w} lanes ÷ 8 = ${(gt * w / 8).toFixed(0)} GB/s, minus ~1.5% encoding. ${gen < st.dg ? 'The slot limits the generation (weakest part of the path). ' : ''}${st.sw < st.dw ? 'The slot is wired narrower than the card. ' : ''}${st.tw < capW ? 'The link trained narrower than it could: downtrained — suspect seating, connector, riser, cable, retimer, BIOS.' : ''}</p>`;
  };
  draw();
  return W('PCIe bandwidth calculator', 'GUI', h('div', {class: 'row', style: 'gap:18px;align-items:flex-start'}, mk('Card generation', 'dg', [[3, 'Gen3'], [4, 'Gen4'], [5, 'Gen5'], [6, 'Gen6']]), mk('Card width', 'dw', [[4, 'x4'], [8, 'x8'], [16, 'x16']]), mk('Slot generation', 'sg', [[3, 'Gen3'], [4, 'Gen4'], [5, 'Gen5'], [6, 'Gen6']]), mk('Slot wired as', 'sw', [[4, 'x4'], [8, 'x8'], [16, 'x16']]), mk('Actually trained width', 'tw', [[1, 'x1'], [4, 'x4'], [8, 'x8'], [16, 'x16']])), out);
};
WIDGETS.retimer = () => {
  let mode = 'none', len = 70;
  const svg = sv('svg', {viewBox: '0 0 640 170', style: 'width:100%;height:auto;display:block;background:var(--panel);border:1px solid var(--line);border-radius:5px'});
  const msg = h('div', {class: 'explain'});
  const inp = h('input', {type: 'range', min: '20', max: '100', value: '70', id: 'rtl', 'aria-label': 'Path length', style: 'width:200px'});
  const draw = () => {
    svg.innerHTML = '';
    const pts = []; let A = 1, Nz = 0.05, snrEnd = 0;
    const L = 600 * len / 100; const mid = 20 + L / 2;
    for (let x = 0; x <= L; x += 2) {
      const X = 20 + x; let a, n;

<script>

function travelerPanel(lab) {

M({n: 1, set: 'A', topic: 'What Linux is and why servers use it', reread: ['m2'],
  q: 'In your own words, what is Linux? Name two Linux distributions used on servers, and give four specific reasons Linux runs most data center servers.',
  brief: '<p>You are logged in to a production server. Use the CLI to <b>see</b> the evidence for your answer: which distribution this is, how long it has run, and how openly it reports its hardware.</p>',
  rig: () => baseRig(), topo: r => topoLinux(r),

  tasks: [{t: 'Which distribution is this server running?', cmd: /os-release/}, {t: 'How long has it run without a reboot?', cmd: /^uptime/}, {t: 'Show that Linux reports hardware openly', cmd: /^(lspci|dmesg|sudo dmesg)/}],
  hint: ['Define it: Linux is an <b>operating system</b>; strictly, the <b>kernel</b> that talks to hardware, packaged with tools into <b>distributions</b>. Mention <b>open source</b>.', 'Name two server distributions — the course lists four.', 'Give four reasons from the course list: stable · low cost · built for remote work · transparent about hardware · secure/efficient/supported (AI and cloud software built for Linux first).', 'Evidence in the lab: <code>cat /etc/os-release</code>, <code>uptime</code>, <code>lspci</code>.'],
  answer: `<p>Linux is an operating system. Strictly, "Linux" is the <b>kernel</b> — the core that talks to the hardware — packaged with tools into <b>distributions</b>. It is <b>open source</b>: the code is public and free to use.</p><p><b>Server distributions:</b> Red Hat Enterprise Linux (RHEL), Rocky Linux, Ubuntu Server, SUSE (this lab server runs Rocky Linux 9.4).</p><p><b>Why it runs most data center servers:</b></p><ol><li><b>Stable</b> — servers run for months without a reboot.</li><li><b>Low cost</b> — many distributions are free; paid ones like RHEL charge for support.</li><li><b>Built for remote work</b> — everything is done by command line and scripts over the network with no screen, so one person can manage hundreds of servers.</li><li><b>Transparent about hardware</b> — tools like <code>lspci</code> and <code>dmesg</code> show exactly what the hardware is doing.</li><li><b>Secure, efficient and supported</b> — frequent updates, low overhead, and AI and cloud software is built for Linux first.</li></ol>`,
  keys: [K('kernel', 'kernel'), K('open source', 'open.?source'), K('a distribution', 'RHEL|Red Hat|Rocky|Ubuntu|SUSE'), K('stable', 'stab'), K('low cost', 'cost|free'), K('remote / command line', 'remote|command.?line|script|ssh'), K('hardware visibility', 'lspci|dmesg|hardware'), K('secure / supported', 'secur|support|efficien'), K('AI / cloud', '\\bAI\\b|cloud')]

M({n: 2, set: 'A', topic: 'Reading ip a output', reread: ['m7'],
  q: 'Here is part of the ip a output from a server. List every piece of information you can read from it. Then name two things this command does not show, and where you would find them.',
  code: '2: ens1f0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 9000 qdisc mq state UP\n    link/ether 3c:ec:ef:12:34:56 brd ff:ff:ff:ff:ff:ff\n    inet 10.20.5.14/22 brd 10.20.7.255 scope global dynamic ens1f0',
  brief: '<p>This server is configured exactly like the output in the question. Read it live, then find the three things <code>ip a</code> never shows.</p>',
  rig: () => { const r = baseRig(); const i = r.ifaces[0]; i.mtu = 9000; i.prefix = 22; r.net.dhcp.prefix = 22; return r; }, topo: r => topoNetwork(r),
  chips: ['ip a show ens1f0', 'ip route', 'cat /etc/resolv.conf', 'ethtool ens1f0'],
  tasks: [{t: 'Read the interface', cmd: /^ip\s+(a|addr)/}, {t: 'Find the default gateway', cmd: /^ip\s+(r|route)/}, {t: 'Find the DNS servers', cmd: /resolv\.conf/}, {t: 'Find the link speed', cmd: /^ethtool\s+ens1f0/}],
  hint: ['Go left to right, line by line: index and name, the flags inside &lt; &gt;, mtu, state.', 'Line 2: link/ether = MAC. Line 3: inet = IPv4/prefix, brd, scope, dynamic.', 'What does /22 and dynamic tell you? (subnet size; DHCP)', 'Not shown: gateway → <code>ip route</code>; DNS → <code>/etc/resolv.conf</code>; link speed → <code>ethtool</code>.'],
  answer: `<ul><li><b>2</b> — interface index; <b>ens1f0</b> — interface name (Ethernet, slot 1, port 0).</li><li><b>BROADCAST,MULTICAST</b> — capabilities; <b>UP</b> — enabled; <b>LOWER_UP</b> — physical link detected (not NO-CARRIER).</li><li><b>mtu 9000</b> — jumbo frames; must match the switch. <b>qdisc mq</b>, <b>state UP</b> — operational state.</li><li><b>link/ether 3c:ec:ef:12:34:56</b> — the MAC address; <b>brd ff:ff:ff:ff:ff:ff</b> — broadcast MAC.</li><li><b>inet 10.20.5.14/22</b> — IPv4 address and subnet. /22 = mask 255.255.252.0, so the subnet is 10.20.4.0–10.20.7.255.</li><li><b>brd 10.20.7.255</b> — broadcast address; <b>scope global</b> — a normal routable address.</li><li><b>dynamic</b> — the address came from <b>DHCP</b> (a lease); static addresses show "forever".</li></ul><p><b>Not shown:</b> the <b>default gateway</b> (<code>ip route</code>), the <b>DNS servers</b> (<code>/etc/resolv.conf</code>), and the <b>link speed</b> (<code>ethtool ens1f0</code>).</p>`,
  keys: [K('ens1f0 / name', 'ens1f0|name'), K('UP = enabled', '\\bUP\\b|enabled'), K('LOWER_UP = link', 'LOWER.?UP|link'), K('MTU 9000 / jumbo', 'mtu|jumbo|9000'), K('MAC', 'MAC|link/ether'), K('IP address', '10\\.20\\.5\\.14'), K('/22 subnet', '/22|255\\.255\\.252'), K('broadcast', 'broadcast|brd'), K('dynamic = DHCP', 'dynamic|DHCP'), K('gateway → ip route', 'gateway|ip route'), K('DNS → resolv.conf', 'DNS|resolv'), K('speed → ethtool', 'speed|ethtool')]
});

M({n: 3, set: 'A', topic: 'SSH versus Serial Over LAN', reread: ['m8'], start: 'laptop',
  q: 'A coworker says: “Serial Over LAN is just a slower version of SSH.” Explain why that is wrong. Describe how each one reaches the server, what each depends on, and give one situation where only SOL will help.',

  topo: r => topoOob(r),
  chips: ['ping -c 2 10.20.5.14', 'ssh tech@10.20.5.14', LAPTOP_BMC + ' power status', LAPTOP_BMC + ' sol activate'],
  tasks: [{t: 'Try SSH (in-band)', cmd: /^ssh/}, {t: 'Ask the BMC whether the server is powered on', cmd: /ipmitool.*power status/}, {t: 'Open SOL (out-of-band) and read the console', cmd: /sol activate/}],
  hint: ['SSH: <b>in-band</b> — inside the OS, over the normal network. Needs the OS running, a working network, and sshd.', 'SOL: <b>out-of-band</b> — through the <b>BMC</b> and the management network. Needs none of those; the BMC runs on standby power.', 'What each shows: SSH = a shell after boot. SOL = the serial console: BIOS/POST, GRUB, kernel messages, panics.', 'Pick a situation: kernel panic, a server that will not boot, a lost network, or changing BIOS settings.'],
  answer: `<p>They are different paths to different things, not fast and slow versions of one thing. <b>SSH talks to the operating system; SOL talks to the server's console through the BMC.</b></p><ul><li><b>SSH</b> is <b>in-band</b>: it runs inside the OS over the normal production network. It depends on the <b>OS running</b>, a <b>working network</b> (NIC, IP, gateway) and the <b>sshd</b> service. You get a shell after the OS has booted and you log in.</li><li><b>SOL</b> is <b>out-of-band</b>: <code>ipmitool sol activate</code> goes over the <b>management network to the BMC</b>, a separate computer on standby power, which relays the server's <b>serial console</b>. It does not need the OS. You see BIOS/POST (if console redirection is on), GRUB, kernel boot messages and kernel panics.</li></ul><p><b>Only SOL helps when</b> the OS has crashed (like this lab — SSH times out, SOL shows "Kernel panic - not syncing"), the server will not boot, it has lost its network, or you need to change BIOS settings.</p>`,
  keys: [K('in-band', 'in.?band'), K('out-of-band', 'out.?of.?band'), K('BMC', 'BMC'), K('needs OS running', 'OS|operating system'), K('sshd service', 'sshd'), K('production network', 'network'), K('management network', 'management'), K('serial console', 'console'), K('BIOS / POST / GRUB / boot', 'BIOS|POST|GRUB|boot'), K('crash / panic / frozen', 'crash|panic|frozen|hung')]
});

M({n: 4, set: 'A', topic: 'DHCP messages and settings', reread: ['m7'],
  q: 'A brand-new server is racked and plugged in. Describe every DHCP message exchanged before it has an address, who sends each one, which are broadcasts, what settings the server ends up with, and what you would see if no DHCP server answered.',
  brief: '<p>The new server\'s port has a link but no address yet. Run DHCP and watch each message travel. Then flip the what-if switch and see what happens when no server answers.</p>',
  rig: () => { const r = baseRig(); const i = r.ifaces[0]; i.ip = null; i.dynamic = false; r.files['/etc/resolv.conf'] = '# Generated by NetworkManager\n'; return r; }, topo: r => topoNetwork(r),
  chips: ['ip a show ens1f0', 'sudo dhclient -v ens1f0', 'ip route', 'cat /etc/resolv.conf'],
  tasks: [{t: 'Confirm there is no address yet', cmd: /^ip\s+(a|addr)/}, {t: 'Run DHCP verbosely and watch D-O-R-A', cmd: /dhclient/, ok: r => r.ifaces[0].ip && !r.ifaces[0].linklocal}, {t: 'Check what you got: address, gateway', cmd: /^ip\s+(a|addr|r|route)/, ok: r => !!r.ifaces[0].ip}, {t: 'What-if: no DHCP server answers — run it again on ens1f1', cmd: /dhclient.*ens1f1/, ok: r => !r.net.dhcp.ok}],
  actions: [{id: 'nodhcp', kind: 'whatif', label: 'Make the DHCP server stop answering', do: r => { r.net.dhcp.ok = false; const i = r.ifaces[1]; i.admin = true; i.carrier = true; return 'DHCP server 10.20.5.2 is now silent. Try: sudo dhclient -v ens1f1'; }}],
  hint: ['Four messages, in order: <b>D</b>iscover, <b>O</b>ffer, <b>R</b>equest, <b>A</b>cknowledge (DORA).', 'Who sends each? Client, server, client, server.', 'Broadcasts: the client has no address yet, so Discover (and Request) go to everyone.', 'Settings at the end: IP, subnet mask, default gateway, DNS servers, lease time.', 'No answer: no address, or a self-assigned 169.254.x.x. Other subnets need a DHCP relay.'],
  answer: `<ol><li><b>Discover</b> — sent by the <b>server being set up (the client)</b> as a <b>broadcast</b> ("I need an address"), because it has no address yet.</li><li><b>Offer</b> — sent by a <b>DHCP server</b>: an address and settings.</li><li><b>Request</b> — sent by the <b>client</b>, asking to use that offer. It is also broadcast, so every DHCP server hears which offer was accepted.</li><li><b>Acknowledge (ACK)</b> — sent by the <b>DHCP server</b> to confirm; the client configures itself.</li></ol><p><b>Settings it ends up with:</b> IP address, subnet mask, default gateway, DNS servers, and the lease time (renewed partway through). A reservation always gives the same address.</p><p><b>If no DHCP server answers:</b> the Discover repeats with no Offer, and the interface has no address or a <b>self-assigned 169.254.x.x</b> address — nothing beyond the local link works. Check the link and switch port (VLAN), whether the DHCP server is up, and whether this subnet needs a <b>DHCP relay</b> (broadcasts do not cross routers).</p>`,
  keys: [K('Discover', 'discover'), K('Offer', 'offer'), K('Request', 'request'), K('Acknowledge', 'ack'), K('broadcast', 'broadcast'), K('client vs server', 'client'), K('IP + mask', 'mask'), K('gateway', 'gateway'), K('DNS', 'DNS'), K('lease time', 'lease'), K('169.254', '169\\.254'), K('relay', 'relay')]
});

M({n: 5, set: 'A', topic: 'PCIe bandwidth and the math', reread: ['m4'], widget: 'pcieCalc',
  q: 'What determines the bandwidth of a PCIe link? List the factors. Then estimate the bandwidth in each direction of a Gen 4 x8 link and show your math.',
  brief: '<p>This server\'s NIC is a Gen 4 x8 card. Read its link from the CLI, then check your math with the calculator below the lab.</p>',
  rig: () => { const r = baseRig(); r.devs.nic0.cap = {gt: 16, w: 8}; r.devs.nic0.sta = {gt: 16, w: 8}; return refresh(r); }, topo: r => topoPcie(r),
  chips: ['lspci | grep -i ethernet', 'sudo lspci -vv -s 3b:00.0 | grep -i lnk', 'lspci -tv'],
  tasks: [{t: 'Find the NIC on the bus', cmd: /lspci.*ethernet/i}, {t: 'Read its LnkCap and LnkSta', cmd: /lspci.*-vv/}, {t: 'See what else shares its path', cmd: /lspci.*-t/}],
  hint: ['Five factors: generation and width · encoding overhead · weakest part of the path · what it actually trained to (and slot wiring) · shared links behind a switch.', 'Gen 4 = 16 GT/s per lane.', 'Quick math: GT/s × lanes ÷ 8 ≈ GB/s.', 'Say "each direction": PCIe sends and receives at the same time.'],
  answer: `<p><b>Factors:</b></p><ol><li><b>Generation</b> (transfer rate per lane) and <b>width</b> (number of lanes).</li><li><b>Encoding overhead</b>: Gen 3–5 lose about 1.5% (Gen 1 and 2 lost 20%).</li><li>The <b>weakest part of the path</b>: the link runs at the highest speed and width both ends and everything between support (a Gen 5 card in a Gen 4 slot runs at Gen 4).</li><li>What the link <b>actually trained to</b> (LnkSta), and how the slot is wired (an x16 slot may be wired x8).</li><li><b>Shared links</b>: devices behind a PCIe switch share its single upstream link (oversubscription).</li></ol><p><b>Gen 4 x8:</b> 16 GT/s × 8 lanes ÷ 8 = <b>16 GB/s in each direction</b> (about 15.75 GB/s after ~1.5% encoding). Per the table: 2 GB/s per lane × 8 = 16 GB/s. It sends and receives at the same time, so about 32 GB/s total both ways. (Same as a Gen 3 x16 link.)</p>`,
  keys: [K('generation', 'gen'), K('width / lanes', 'width|lane'), K('encoding', 'encod'), K('weakest link', 'weakest|both ends|slowest'), K('trained / LnkSta', 'train|LnkSta'), K('slot wiring', 'wired|wiring'), K('shared / switch', 'shar|switch|oversub'), K('16 GT/s', '16 ?GT'), K('16 GB/s', '16 ?GB|15\\.7'), K('each direction', 'direction')]
});

M({n: 6, set: 'A', topic: 'ECC memory', reread: ['m5'], widget: 'ecc',
  q: 'A manager asks why servers use ECC memory when most desktops do not. Explain how ECC works, what it can and cannot fix, and why the log of corrected errors matters.',
  brief: '<p>This server has been quietly correcting memory errors on one DIMM for days. Find the corrected-error log — it is the "why it matters" part of your answer. Then try the bit-flip demo below.</p>',
  rig: () => { const r = baseRig(); const d = r.dimms.find(x => x.loc === 'C1'); d.ce = 342; sel(r, '14:02:11', 'Memory #0x87', 'Correctable ECC (DIMM C1)', 'w', -3); sel(r, '22:40:09', 'Memory #0x87', 'Correctable ECC (DIMM C1)', 'w', -1); sel(r, '06:12:44', 'Memory #0x87', 'Correctable ECC logging limit reached (DIMM C1)', 'w'); kx(r, '06:12:40', 'warn', 'EDAC MC0: 118 CE memory read error on CPU_SrcID#0_MC#0_Chan#2_DIMM#0 (channel:2 slot:0)'); return refresh(r); },
  topo: r => topoMemory(r),
  chips: ['sudo ipmitool sel elist', 'sudo ras-mc-ctl --summary', 'dmesg | grep -i edac'],
  tasks: [{t: 'Find the corrected-error trend in the BMC log', cmd: /ipmitool.*sel/}, {t: 'Get the per-DIMM count from Linux', cmd: /ras-mc-ctl|edac/}],
  hint: ['How: ECC stores <b>extra check bits</b> with the data and checks them on every read.', 'Can fix: single-bit errors (correctable) — corrected automatically, server keeps running, logged.', 'Cannot fix: double-bit errors (uncorrectable) — detected, server stops rather than use bad data.', 'Why the log matters: early warning. A DIMM with a rising count of corrected errors will likely fail — replace it before it causes an outage.'],
  answer: `<p><b>How it works:</b> ECC (Error-Correcting Code) memory stores <b>extra check bits</b> alongside the data. When the data is read back, the check bits are used to detect and locate errors.</p><ul><li><b>Can fix:</b> a <b>single-bit error</b> is detected and corrected automatically (a correctable error). The server keeps running and logs it.</li><li><b>Cannot fix:</b> a <b>double-bit error</b> is detected but not fixed (an uncorrectable error). The server usually stops or crashes rather than use bad data.</li></ul><p><b>Why servers need it:</b> it prevents <b>silent data corruption</b>, keeps servers running through single-bit errors, and gives <b>early warning</b>. Desktops can live with a rare crash; servers run all day for many users.</p><p><b>Why the corrected-error log matters:</b> a DIMM logging <b>more and more correctable errors is likely to fail</b>. Watching the trend (BMC SEL "Correctable ECC logging limit reached, DIMM C1", <code>ras-mc-ctl --summary</code>, <code>dmesg | grep -i edac</code>) lets you replace it in a planned window, before it causes an uncorrectable error and an outage.</p>`,
  keys: [K('check bits', 'check bit|extra bit|parity'), K('single-bit', 'single'), K('corrected / correctable', 'correct'), K('double-bit', 'double|two bit|2.bit'), K('uncorrectable', 'uncorrect'), K('stops / crashes', 'stop|crash|halt'), K('silent corruption', 'silent|corrupt'), K('early warning', 'early|warn|trend|increas|rising'), K('replace before outage', 'replace|outage'), K('where it is logged', 'SEL|log|EDAC|ras-mc')]
});

M({n: 7, set: 'A', topic: 'grep across a folder', reread: ['m2'],
  q: 'Write one command that searches every log file under /var/log , including subfolders, for the word nvme, ignoring upper and lower case and showing line numbers. Explain what each option does, and how you would count the matches instead.',
  brief: '<p>NVMe messages are spread over the main log, a test log in a subfolder, and an archived log. Build the one command, then count.</p>',
  rig: () => { const r = baseRig(); kx(r, '02:41:10', 'warn', 'nvme nvme3: I/O 512 QID 7 timeout, aborting'); kx(r, '02:41:40', 'err', 'nvme nvme3: controller is down; will reset: CSTS=0xffffffff'); r.files['/var/log/test/fio_run2.log'] = '2026-10-01 02:40:58 fio start on /dev/nvme0n1 /dev/nvme1n1 /dev/nvme2n1 /dev/nvme3n1\n2026-10-01 02:41:41 ERROR: NVMe device /dev/nvme3n1 not responding\n2026-10-01 02:45:00 fio done: 3 of 4 NVME targets ok\n'; r.files['/var/log/archive/messages-20260928'] += 'Sep 28 04:10:22 srv-r07-u12 kernel: nvme nvme1: Shutdown timeout set to 10 seconds\n'; return refresh(r); },
  topo: r => topoGrep(r),
  chips: ['sudo grep -rin nvme /var/log/', 'sudo grep -ric nvme /var/log/', 'sudo grep -rin nvme /var/log/ | wc -l'],
  tasks: [{t: 'One command: recursive, ignore case, line numbers', cmd: /grep\s+-(?=\w*r)(?=\w*i)(?=\w*n)\w+\s+["']?nvme["']?\s+\/var\/log\/?/i}, {t: 'Count the matches instead', cmd: /grep\s+-\w*c\w*.*nvme|grep.*nvme.*\|\s*wc\s+-l/i}],
  hint: ['Start with <code>grep "nvme" /var/log/</code> and add options.', '-r = search the folder and its subfolders. -i = ignore case. -n = line numbers. Combine as -rin.', 'On Red Hat systems /var/log/messages needs sudo.', 'Count: -c counts matching lines (per file with -r), or pipe to <code>wc -l</code> for one total.'],
  answer: `<p><code>sudo grep -rin "nvme" /var/log/</code></p><ul><li><b>-r</b> — recursive: search every file in /var/log and all its subfolders.</li><li><b>-i</b> — ignore case: matches nvme, NVMe and NVME.</li><li><b>-n</b> — show the line number of each match (output is file:line:text).</li><li><code>sudo</code> — some logs (like /var/log/messages on Red Hat) are readable only by root.</li></ul><p><b>To count instead:</b> <code>sudo grep -ric "nvme" /var/log/</code> — <b>-c</b> prints the number of matching lines (per file when searching recursively). For one total: <code>sudo grep -ri "nvme" /var/log/ | wc -l</code>.</p>`,
  keys: [K('grep', 'grep'), K('-r recursive', '-\\w*r|recurs'), K('-i ignore case', '-\\w*i|ignore case'), K('-n line numbers', '-\\w*n|line number'), K('/var/log', '/var/log'), K('count: -c or wc -l', '-\\w*c|wc -l|count')]
});

M({n: 8, set: 'A', topic: 'Server lost network after a move', reread: ['m7', 'm8'], start: 'laptop',
  q: 'A Linux server stopped answering ping and SSH right after it was moved to a new rack position. What is your very first check, and what is the reason for it? Then walk through the rest of your process in order.',
  brief: '<p>srv-r07-u12 was moved from U10 to U12 this morning and has not answered since. You are at your laptop. Start with the first check, then go bottom-up. The cable checks are physical: do them in the drawing.</p>',
  rig: () => { const r = baseRig(); r.ifaces[0].carrier = false; r.flags.cableHanging = true; return refresh(r); }, topo: r => topoNetwork(r, {bmc: true}),
  chips: ['ping -c 2 10.20.5.14', LAPTOP_BMC + ' power status', LAPTOP_BMC + ' sol activate', 'ip a', 'ethtool ens1f0', 'ping -c 2 10.20.5.1'],
  tasks: [{t: 'Reproduce: ping and SSH from the laptop', cmd: /^(ping|ssh).*(10\.20\.5\.14|srv)/}, {t: 'FIRST CHECK: is the server alive? Ask the BMC', cmd: /ipmitool.*(power status|sel|sensor)/}, {t: 'Get onto its console without the network (SOL)', cmd: /sol activate/}, {t: 'Physical layer from the console: link state', cmd: /ip a|ethtool/, ok: r => r.ctx.includes('sol')}, {t: 'Check the cable in the drawing', when: r => r.flags.cableChecked}, {t: 'Restore the link', when: r => r.ifaces[0].carrier}, {t: 'Gateway: ping it from the server', cmd: /ping.*10\.20\.5\.1\b/, ok: r => r.ifaces[0].carrier}, {t: 'Verify from the laptop: ping and SSH work', cmd: /^(ssh|ping).*10\.20\.5\.14/, ok: r => r.ifaces[0].carrier && r.ctx[0] === 'laptop'}],
  actions: [
    {id: 'nicend', node: 'srv', kind: 'look', label: 'Check the cable at the server NIC (ens1f0)', do: r => { r.flags.cableChecked = true; return 'Server end: DAC cable latched in ens1f0. NIC link LED is OFF.'; }},
    {id: 'swend', node: 'sw', kind: 'look', label: 'Check the cable at the switch end', do: r => { r.flags.cableChecked = true; return r.ifaces[0].carrier ? 'Plugged into Te1/0/14, link LED green.' : L('e', 'The cable is hanging loose at the switch: it was unplugged for the move and never reconnected. Port Te1/0/14 (labelled for this server) is empty.'); }},
    {id: 'plug', node: 'sw', kind: 'cable', label: 'Plug the cable into labelled port Te1/0/14', do: r => { r.ifaces[0].carrier = true; r.flags.cableHanging = false; return L('g', 'Click. Link LEDs green at both ends.'); }}
  ],
  hint: ['First: is the server <b>alive</b>? Use the <b>BMC</b> (power status, console, SEL) — you cannot SSH into a crashed server, and a move can cause a crash, not just a cable problem.', 'Then bottom-up: physical (link lights, cable, transceiver, switch port — <code>ethtool</code> "Link detected").', 'NIC detected and driver loaded? (<code>lspci</code>, <code>lspci -k</code>, <code>ip link</code>, <code>dmesg</code>).', 'Correct IP (<code>ip a</code>), gateway (<code>ip route</code>, ping it, traceroute), name resolution, service/firewall (<code>systemctl status sshd</code>, <code>ss -tulpn</code>).', 'What changed (the move!), test from another machine, document.'],
  answer: `<p><b>First check: is the server actually alive?</b> Use the <b>BMC</b> — <code>ipmitool power status</code>, the event log, and the console through SOL or the virtual console. <b>Reason:</b> you cannot SSH into a crashed server, and "no ping, no SSH" looks the same whether the OS crashed or the network broke. The BMC is on its own management network and standby power, so it answers either way.</p><ol><li><b>Physical</b>: link lights, cable, transceiver, switch port. <code>ethtool ens1f0</code> → "Link detected". <code>ip a</code> → LOWER_UP or NO-CARRIER. Try a known-good cable or port. (A move makes this the most likely layer: in this lab the cable was never reconnected at the switch.)</li><li><b>NIC detected and driver loaded?</b> <code>lspci</code>, <code>lspci -k</code>, <code>ip link</code>, <code>dmesg</code>.</li><li><b>Correct IP?</b> <code>ip a</code>: missing, 169.254 (DHCP failed), wrong subnet, duplicate.</li><li><b>Gateway</b>: <code>ip route</code>, ping the gateway, then beyond it, <code>traceroute</code>.</li><li><b>Name resolution</b>: test by IP and by name.</li><li><b>Service and firewall</b>: <code>systemctl status sshd</code>, <code>ss -tulpn</code>, firewall rules.</li><li><b>What changed?</b> The move — new switch port? new VLAN? Test from another machine, verify ping and SSH, and <b>document</b> every check.</li></ol>`,
  keys: [K('BMC first', 'BMC'), K('alive / crashed', 'alive|crash|power status'), K('console / SOL', 'console|SOL|KVM'), K('cable / link lights', 'cable|link light|LED'), K('ethtool / Link detected', 'ethtool|link detected'), K('NO-CARRIER / LOWER_UP', 'NO.?CARRIER|LOWER.?UP'), K('lspci / driver', 'lspci|driver'), K('IP / 169.254', 'ip a|169\\.254|address'), K('gateway / ip route', 'gateway|ip route'), K('DNS / name', 'DNS|name'), K('sshd / firewall', 'sshd|firewall|ss -tulpn'), K('what changed', 'changed|move'), K('document', 'document')]
});

M({n: 9, set: 'A', topic: 'New card missing from lspci', reread: ['m3', 'm4', 'm11'],
  q: 'A technician installs a new 100G network card and says it is dead because lspci does not show it. What would you check, in order, before agreeing?',
  brief: '<p>The new 100G card went into Slot 4 (CPU 2). <code>lspci</code> does not show it. Work Playbook A before anyone calls it dead: CLI for evidence, hands for the hardware, the BIOS screen for settings.</p>',
  rig: () => { const r = baseRig({nic2: '100'}); r.files['/home/tech/notes.txt'] = 'Unit J7K2Q41. Build sheet rev B: 2x CPU, 16x 64GB DDR5, 4x GPU, 1x CX-6 Dx NIC (Slot 1), NEW: 1x 100G NIC (Slot 4, CPU 2), 4x NVMe.\n'; r.roots[1].ports.find(p => p.id === 'rp2b').present = false; r.flags.slot4Disabled = true; r.hooks.onBoot = rr => { rr.roots[1].ports.find(p => p.id === 'rp2b').present = !rr.flags.slot4Disabled; }; return refresh(r); },
  topo: r => topoPcie(r, {title: 'PCIe topology — expected diagram with the new card in Slot 4'}),
  chips: ['cat notes.txt', 'lspci | grep -i ethernet', 'lspci -tv', 'dmesg | grep -i a3:00'],
  tasks: [{t: 'Confirm what is expected', cmd: /notes|cat/}, {t: 'Confirm what Linux sees on the bus', cmd: /lspci/}, {t: 'Read the tree: empty port, or is the whole branch missing?', cmd: /lspci.*-t/}, {t: 'Physical: seating, latch, power', when: r => r.flags.seatChecked}, {t: 'BIOS: is the slot enabled?', when: r => r.flags.biosLooked}, {t: 'Fix and verify it appears with a driver', cmd: /lspci/, ok: r => !r.flags.slot4Disabled && devVisible(r, r.devs.nic1)}],
  actions: [
    {id: 'seat', node: 'dev:nic1', kind: 'look', label: 'Power off, ESD strap: check seating, latch, slot and any power cable', do: r => { r.flags.seatChecked = true; return say(L('g', 'Card fully seated, latch closed, gold fingers clean. This card needs no auxiliary power.'), 'Physically it looks right — so check the BIOS before blaming the card.'); }},
    {id: 'bios', kind: 'bios', label: 'BIOS Setup › PCIe Configuration › Slot 4', do: r => { r.flags.biosLooked = true; return r.flags.slot4Disabled ? say('Slot 4 ................ ' + L('e', '[Disabled]').slice(2), 'Bifurcation ........... x16 · Link speed ...... Auto · Above 4G Decoding .. Enabled', L('w', 'Slot 4 was disabled when it had no card in it.')) : 'Slot 4 ................ [Enabled]'; }},
    {id: 'enable', kind: 'bios', label: 'BIOS: set Slot 4 to Enabled, save and reboot', reboot: 'cycle', do: r => { r.flags.slot4Disabled = false; r.flags.biosLooked = true; return 'Slot 4 → [Enabled]. F10 Save & Exit.'; }}
  ],
  hint: ['Confirm what is expected (build sheet) and exactly what is missing.', 'Check BIOS/BMC inventory: if they do not see it either, it is physical or firmware.', 'Physical, powered off with ESD protection: seated, latch, correct slot, riser, power cables.', 'BIOS: slot enabled, bifurcation, link speed, Above 4G Decoding; firmware.', 'Topology: <code>lspci -tv</code> — empty port or missing branch? Other devices on the same path?', 'Swap into a known-good slot or system before calling it dead. A driver is not needed for lspci to list it.'],
  answer: `<p><code>lspci</code> lists every device on the bus <b>whether or not a driver is loaded</b>, so "not in lspci" is a hardware-path or setting problem — not proof of a dead card. In order:</p><ol><li><b>Confirm expected vs missing</b>: build sheet; <code>lspci | grep -i ethernet</code>.</li><li><b>Find the layer</b>: does BIOS or BMC inventory see the card? If not, it is physical or firmware.</li><li><b>Physical</b> (powered off, ESD strap): seated fully, latch closed, correct slot, riser seated, any power or data cables in the right ports, no bent pins.</li><li><b>BIOS</b>: <b>slot enabled</b>, bifurcation, forced link speed, Above 4G Decoding; firmware versions. (In this lab Slot 4 was disabled in BIOS.)</li><li><b>Topology</b>: compare <code>lspci -tv</code> with the diagram — a missing branch points upstream (riser, cable, root port, BIOS); other devices on the same path missing → the shared part.</li><li><b>Swap</b>: try the card in a known-good slot or system. Follows the card → card; stays with the slot → slot/riser/board.</li><li>Fix, <b>verify</b> (lspci, <code>lspci -k</code>, link up), <b>document</b>.</li></ol>`,
  keys: [K('expected / build sheet', 'expect|build sheet'), K('BIOS / BMC inventory', 'inventory|BIOS|BMC'), K('seating', 'seat'), K('latch / riser', 'latch|riser'), K('power / cables', 'power|cable'), K('slot enabled', 'enabl|disabl'), K('bifurcation', 'bifurcat'), K('lspci -tv / topology', 'lspci -tv|topolog|tree'), K('known-good swap', 'known.?good|swap'), K('firmware', 'firmware'), K('ESD', 'ESD|static')]
});

M({n: 10, set: 'A', topic: 'Intermittent failure', reread: ['m10'],
  q: 'A test fails roughly once every 15 runs, and you cannot make it fail on demand. List the data you would gather, and explain how you would turn it into a failure you can reproduce.',
  brief: '<p><code>./test.sh</code> runs a GPU workload and fails now and then. Loop it, collect the data, find the pattern. The cause turns out to be physical — fix it on the drawing — then run enough cycles to trust the result.</p>',
  rig: () => {
    const r = baseRig();
    r.flags.blocked = true;
    r.hooks.cmd = {'./test.sh': (a, X) => {
      const q = X.r; q.testRun = (q.testRun || 0) + 1;
      const hot = q.flags.blocked && q.testRun % 15 === 11; const g = q.gpuInfo.gpu3;
      g.temp = q.flags.blocked ? (hot ? 89 : 78 + (q.testRun * 7) % 6) : 61 + (q.testRun * 3) % 4;
      if (hot) { const t = (q.now - q.bootAt) / 1000; q.dmesg.push({t, lvl: 4, m: 'NVRM: GPU at PCI:0000:84:00: GPU-6a1f thermal slowdown active (89 C)'}); q.bmc.sel.push({d: new Date(q.now), sensor: 'Temperature GPU3 Temp #0x5c', ev: 'Upper Non-critical going high', dir: 'Asserted', sev: 'w'}); }
      return `${fmtIso(q.now)} run ${q.testRun}: ${hot ? 'FAIL gpu3 matmul result mismatch (gpu3 89C)' : 'PASS (gpu0 ' + (55 + q.testRun % 3) + 'C gpu1 57C gpu2 58C gpu3 ' + g.temp + 'C)'}`;
    }};
    return r;
  },
  topo: r => topoChassis(r),
  chips: ['for i in $(seq 1 30); do ./test.sh >> results.txt; done', 'grep -c FAIL results.txt', 'grep FAIL results.txt', 'sudo ipmitool sel elist', 'dmesg -T | grep -i nvrm'],
  tasks: [{t: 'Reproduce on purpose: loop the test 30 times into a file', cmd: /for .*seq.*test\.sh.*>>/}, {t: 'How often does it fail?', cmd: /grep.*-\w*c\w*.*FAIL|FAIL.*wc/}, {t: 'Exact errors and timestamps: which GPU, what temperature?', cmd: /grep\s+(-\w+\s+)?FAIL/}, {t: 'Logs at the same time (kernel + BMC)', cmd: /dmesg|journalctl|ipmitool.*sel/}, {t: 'Inspect the part the pattern points at', when: r => r.flags.looked}, {t: 'Change one thing', when: r => !r.flags.blocked}, {t: 'Run enough cycles to trust it (30+ with zero fails)', cmd: /for .*seq.*test\.sh/, ok: r => !r.flags.blocked && (r.testRun - (r.flags.fixedAt || 0)) >= 30}],
  actions: [{id: 'look', node: ['gpu3', 'riser2'], kind: 'look', label: 'Inspect airflow around GPU 3', do: r => { r.flags.looked = true; return r.flags.blocked ? say(L('e', 'A bundle of spare power cables is zip-tied across the front of GPU 3\'s air inlet.'), 'Heatsink contact fine, fans fine.') : 'Inlet clear.'; }}, {id: 'clear', node: 'gpu3', kind: 'cable', label: 'Re-route the cable bundle away from GPU 3', do: r => { r.flags.blocked = false; r.flags.fixedAt = r.testRun || 0; r.gpuInfo.gpu3.temp = 61; return L('g', 'Bundle re-routed along the chassis wall. Inlet clear.'); }}],
  hint: ['Collect: exact error, timestamps and frequency, which tests pass/fail, temperature and load at the time, logs (dmesg, journal, SEL), serials, firmware and driver versions, other units.', 'Reproduce on purpose: a loop (<code>for i in $(seq 1 30); do ./test.sh >> results.txt; done</code>) or a stress test.', 'Look for a pattern: only under load? only when hot? only one slot?', 'Check seating and cables; look for corrected errors that warn of a weak link.', 'Change one variable, run enough cycles, compare with a golden unit.'],
  answer: `<p><b>Data to gather:</b> the exact error messages; <b>timestamps and frequency</b>; which tests pass and which fail; <b>temperature and load</b> at the time of each failure; logs — <code>dmesg</code>, the journal, the BMC <b>SEL</b>; <b>serial numbers</b>; <b>firmware and driver versions</b>; and whether <b>other units</b> show the same thing.</p><p><b>Turning it into a reproducible failure:</b></p><ol><li><b>Look for a pattern</b>: only under load, only when hot, only in one slot, only on one GPU. (Here every FAIL was GPU 3 at 89 °C.)</li><li><b>Reproduce it on purpose</b> with <b>looped or stress tests</b> — e.g. <code>for i in $(seq 1 30); do ./test.sh >> results.txt; done</code> — and make the suspected condition worse (load, heat).</li><li>Check <b>seating and cables</b>; look for <b>corrected errors</b> that warn of a weak link.</li><li><b>Swap one variable at a time</b>, and <b>run enough cycles</b> to trust the result (a 1-in-15 failure needs many more than 15 clean runs).</li><li><b>Compare with a golden unit</b>, then document.</li></ol>`,
  keys: [K('exact errors', 'error|message'), K('timestamps / frequency', 'timestamp|time|frequen'), K('which tests pass/fail', 'pass|which test'), K('temperature', 'temp|hot'), K('load', 'load'), K('logs (dmesg/journal/SEL)', 'dmesg|journal|SEL|log'), K('serials', 'serial'), K('firmware / driver versions', 'firmware|driver|version'), K('other units', 'other unit'), K('pattern', 'pattern'), K('loop / stress', 'loop|stress|repeat'), K('one variable', 'one (variable|change|thing)'), K('enough cycles', 'enough|cycles|many runs'), K('golden unit', 'golden|known.?good')]
});

M({n: 11, set: 'A', topic: 'Memory errors: DIMM, slot, or CPU', reread: ['m5'],
  q: 'A server keeps logging correctable memory errors. Walk through how you would decide whether the DIMM, the slot, or the CPU is the cause.',
  brief: '<p>Same symptom as the Module 5 lab — but this time, be ready for a different answer. Record, check simple things, swap, test, and read where the errors go.</p>',
  rig: () => {
    const r = baseRig(); const b2 = r.dimms.find(d => d.loc === 'B2'); b2.ce = 860;
    sel(r, '03:12:44', 'Memory #0x87', 'Correctable ECC logging limit reached (DIMM B2)', 'w');
    kx(r, '03:12:43', 'warn', 'EDAC MC0: 412 CE memory read error on CPU_SrcID#0_MC#0_Chan#1_DIMM#1 (channel:1 slot:1)');
    r.hooks.cmd = {'stress-ng': (a, X) => ({stream: [{d: 400, line: 'stress-ng: info:  [5120] dispatching hogs: 32 vm'}, {d: 1600, line: null, fx: q => { const d = q.dimms.find(x => x.loc === 'B2'); d.ce += 41; q.bmc.sel.push({d: new Date(q.now), sensor: 'Memory #0x87', ev: 'Correctable ECC (DIMM B2)', dir: 'Asserted', sev: 'w'}); return L('w', 'stress-ng: info:  [5120] memory errors logged by EDAC during run: 41 (slot B2)'); }}, {d: 500, line: 'stress-ng: info:  [5120] successful run completed in 600.00s'}]})};
    return refresh(r);
  },
  topo: r => topoMemory(r),
  chips: ['sudo ipmitool sel elist', 'sudo ras-mc-ctl --summary', 'sudo dmidecode -t memory | grep -A8 DIMM_B2', 'stress-ng --vm 32 --timeout 600'],
  tasks: [{t: 'Record the evidence: slot, type, count', cmd: /ipmitool.*sel|ras-mc-ctl/}, {t: 'Record the DIMM serial', cmd: /dmidecode/}, {t: 'Simple things: seating, latches, part', when: r => r.flags.seat}, {t: 'Swap: suspect to another channel, known-good into B2, clear logs', when: r => r.flags.swapped}, {t: 'Stress test', cmd: /stress-ng/, ok: r => r.flags.swapped}, {t: 'Read where the errors went', cmd: /ras-mc-ctl|sel|edac/, ok: r => r.flags.swapped && r.dimms.find(d => d.loc === 'B2').ce > 0}, {t: 'Look for a pattern on the channel / CPU, then inspect the slot', when: r => r.flags.slotLooked}],
  actions: [
    {id: 'seat', node: 'dimm:B2', kind: 'look', label: 'Check seating, both latches, part number', do: r => { r.flags.seat = true; return L('g', 'Seated, both latches closed, correct part. BIOS current.'); }},
    {id: 'swap', node: ['dimm:B2', 'dimm:D1'], kind: 'swap', label: 'Move B2 DIMM → D1, known-good DIMM → B2, clear logs', do: r => { const b2 = r.dimms.find(d => d.loc === 'B2'); const d1 = r.dimms.find(d => d.loc === 'D1'); const sn = b2.sn; b2.sn = '80CEKG0001'; b2.knownGood = true; d1.sn = sn; r.dimms.forEach(d => { d.ce = 0; }); r.flags.swapped = true; r.bmc.sel = [{d: new Date(r.now), sensor: 'Event Logging Disabled #0x07', ev: 'Log area reset/cleared', dir: 'Asserted'}]; return 'Suspect DIMM ' + sn + ' → D1. Known-good 80CEKG0001 → B2. Logs cleared. Now stress test.'; }},
    {id: 'slot', node: 'dimm:B2', kind: 'look', label: 'Inspect slot B2 under a light', do: r => { r.flags.slotLooked = true; return say(L('e', 'Slot B2: one contact is bent and there is a sliver of debris in the slot.'), 'Other channels on CPU 1 are clean in ras-mc-ctl → not the CPU\'s memory controller. Escalate: board repair or replacement; document.'); }}
  ],
  hint: ['Record the evidence: slot name, error type and count, DIMM serial, timestamps.', 'Simple things: seated, both latches, correct part, correct slot, current BIOS.', 'Swap test: suspect DIMM to a slot on a <b>different channel</b>, known-good DIMM in the suspect slot, clear logs, run a memory test.', 'Errors follow the DIMM → DIMM. Stay in the slot → slot, board or CPU.', 'Pattern: many DIMMs on one channel or one CPU → memory controller, CPU seating, bent socket pins. Stress test after each change; document.'],
  answer: `<ol><li><b>Record the evidence</b>: slot name (B2), error type (correctable) and count, the DIMM's serial (<code>dmidecode -t memory</code>), timestamps (SEL, <code>ras-mc-ctl --summary</code>, <code>dmesg | grep -i edac</code>).</li><li><b>Check simple things</b>: seated with both latches closed, correct part, correct slot (population rules), current BIOS.</li><li><b>Swap test</b>: move the suspect DIMM to a slot on a <b>different channel</b> and put a <b>known-good</b> DIMM in the suspect slot. Clear logs and run a memory test (vendor diagnostics, MemTest86, stress-ng).<ul><li>Errors <b>follow the DIMM</b> → the DIMM is bad.</li><li>Errors <b>stay in the original slot</b> → suspect the slot, board, or CPU. (In this lab they stayed in B2.)</li></ul></li><li><b>Look for patterns</b>: errors on many DIMMs on one channel or one CPU point to the CPU's memory controller, CPU seating, or bent socket pins. One slot only → the slot/board.</li><li><b>Stress test after each change</b>, one change at a time, and <b>document</b> serials and results.</li></ol>`,
  keys: [K('record slot / count / serial', 'serial|slot name|count|record'), K('seating / latches', 'seat|latch'), K('swap test', 'swap|move'), K('different channel', 'channel'), K('known-good DIMM', 'known.?good'), K('clear logs', 'clear'), K('memory test', 'test|stress|memtest'), K('follows the DIMM', 'follow'), K('stays with slot', 'stay'), K('CPU / controller / pins', 'CPU|controller|pin'), K('one change at a time', 'one (change|thing|variable)'), K('document', 'document')]
});

M({n: 12, set: 'A', topic: 'One variable at a time', reread: ['m10'],
  q: 'A coworker reseats a card, replaces its cable, and updates its firmware all at once, and the problem goes away. Explain what is wrong with that approach and what could go wrong later because of it.',
  brief: '<p>A NIC link drops every few test runs. You have three possible changes. Do them <b>one at a time</b>, testing between each. Try the "all at once" button too and see what you can no longer explain.</p>',
  rig: () => { const r = baseRig(); r.flags.badCable = true; r.ifaces[0].stats = {crc: 220, flaps: 9}; r.hooks.cmd = {'./test.sh': (a, X) => { const q = X.r; q.testRun = (q.testRun || 0) + 1; const fail = q.flags.badCable && q.testRun % 4 === 2; if (fail) q.ifaces[0].stats.flaps++; return `${fmtIso(q.now)} run ${q.testRun}: ${fail ? 'FAIL link dropped during transfer' : 'PASS'}`; }}; return r; },
  topo: r => topoNetwork(r),
  chips: ['ethtool -S ens1f0', 'for i in $(seq 1 12); do ./test.sh; done', 'ethtool -i ens1f0'],
  tasks: [{t: 'Baseline: run the test loop and read the counters', cmd: /for .*test\.sh|ethtool -S/}, {t: 'Change exactly one thing', when: r => (r.flags.changes || []).length >= 1}, {t: 'Re-test after that single change', cmd: /for .*test\.sh/, ok: r => (r.flags.changes || []).length >= 1}, {t: 'Find the change that really fixed it', when: r => !r.flags.badCable && (r.flags.changes || []).length && !r.flags.allAtOnce}],
  actions: [
    {id: 'reseat', node: 'srv', kind: 'fix', label: 'Reseat the NIC (one change)', do: r => { (r.flags.changes = r.flags.changes || []).push('reseat'); return 'NIC reseated. Now re-test.'; }},
    {id: 'cable', node: 'sw', kind: 'cable', label: 'Replace the cable (one change)', do: r => { (r.flags.changes = r.flags.changes || []).push('cable'); r.flags.badCable = false; return 'New DAC cable fitted. Now re-test.'; }},
    {id: 'fw', kind: 'gui', label: 'BMC web › Firmware › update the NIC firmware (one change)', do: r => { (r.flags.changes = r.flags.changes || []).push('firmware'); r.devs.nic0.fw = '22.41.1000'; return L('w', 'NIC firmware now 22.41.1000 — newer than the approved 22.39.1002. Re-test.'); }},
    {id: 'all', kind: 'whatif', label: 'Do what the coworker did: all three at once', do: r => { r.flags.allAtOnce = true; r.flags.badCable = false; r.devs.nic0.fw = '22.41.1000'; r.flags.changes = ['reseat', 'cable', 'firmware']; return L('w', 'All three done. The problem is gone — but which change fixed it? You also now run unapproved firmware.'); }}
  ],
  hint: ['What is lost: you do not know <b>which</b> change fixed it — so no real root cause.', 'Course reasons for one change at a time: tells you the real cause, avoids new problems, keeps results repeatable, avoids replacing good parts.', 'Later: it can come back and you repeat all three; the firmware change may introduce new bugs or be unapproved; a good part (cable or card) may be scrapped or RMA\'d wrongly; other units with the same cause are not found; the record is wrong.'],
  answer: `<p><b>What is wrong:</b> three variables changed at once, so when the problem went away <b>nobody knows which change fixed it</b>. There is no real root cause — only a guess.</p><p>Changing one thing at a time <b>tells you the real cause</b>, <b>avoids new problems</b>, <b>keeps results repeatable</b>, and <b>avoids replacing good parts</b>.</p><p><b>What can go wrong later:</b></p><ul><li>The problem <b>comes back</b> (on this unit or others) and the fix is to repeat all three again — and maybe it still fails, because one of them only hid it (e.g. reseating temporarily cleaned a contact).</li><li>The <b>firmware change</b> was not needed and may introduce <b>new bugs</b> or be an unapproved version.</li><li>A <b>good part</b> (the old cable or the card) gets scrapped or sent for <b>RMA</b> wrongly, and failure analysis finds nothing.</li><li><b>Other units</b> with the same cause are not contained, because the cause is unknown.</li><li>The <b>documentation</b> is misleading for the next technician.</li></ul>`,
  keys: [K('which change fixed it', 'which'), K('root cause unknown', 'root cause|cause'), K('new problems', 'new problem|introduc|bug'), K('repeatable', 'repeat'), K('good parts replaced', 'good part|replac'), K('firmware risk', 'firmware'), K('comes back', 'come back|recur|again'), K('RMA / documentation', 'RMA|document|record')]
});

M({n: 13, set: 'A', topic: 'Symptom versus root cause', reread: ['m10'],
  q: 'A technician writes “Root cause: GPU not detected” on a repair ticket. Explain why that is a symptom and not a root cause. Then use the 5 Whys to trace an example of your own down to a process root cause.',
  brief: '<p>GPU 1 is not detected on this unit. Confirm the symptom on the CLI, then ask "why?" five times — each answer is found with your hands or in the paperwork.</p>',
  rig: () => { const r = baseRig(); r.devs.gpu1.present = false; r.flags.aux = true; r.hooks.onBoot = rr => { rr.devs.gpu1.present = !rr.flags.aux; }; return refresh(r); },
  topo: r => topoPcie(r),
  chips: ['nvidia-smi', 'lspci | grep -i nvidia | wc -l', 'lspci -tv'],
  tasks: [{t: 'Symptom: confirm the GPU is not detected', cmd: /nvidia-smi|lspci/}, {t: 'Why 1: why is it not detected?', when: r => r.flags.w1}, {t: 'Why 2: why was the cable not connected?', when: r => r.flags.w2}, {t: 'Why 3: why was it routed there?', when: r => r.flags.w3}, {t: 'Why 4: why does the work instruction show that?', when: r => r.flags.w4}],
  actions: [
    {id: 'w1', node: 'dev:gpu1', kind: 'look', label: 'Inspect GPU 1', do: r => { r.flags.w1 = true; return L('e', 'Why 1: its auxiliary power cable is not connected.'); }},
    {id: 'w2', node: ['dev:gpu1', 'rt:rt1'], kind: 'look', label: 'Trace the aux power cable route', do: r => { r.flags.w2 = true; return L('e', 'Why 2: the cable was routed under Riser 1, where it is 4 cm too short to reach the GPU connector.'); }},
    {id: 'w3', kind: 'doc', label: 'Open the work instruction for this build', do: r => { r.flags.w3 = true; return L('e', 'Why 3: the work instruction photo shows the cable routed under the riser — the OLD layout.'); }},
    {id: 'w4', kind: 'doc', label: 'Check the work instruction revision history', do: r => { r.flags.w4 = true; return L('e', 'Why 4: rev C (old layout) was never updated after the riser design change in August. ROOT CAUSE: outdated work instruction (process).'); }},
    {id: 'fix', node: 'dev:gpu1', kind: 'cable', label: 'Re-route over the riser and connect the cable', reboot: 'cycle', do: r => { r.flags.aux = false; return 'Cable connected. Powering on.'; }}
  ],
  hint: ['Symptom = what you observe. Root cause = <b>why</b> it happened. "GPU not detected" is what you saw.', 'Ask "why?" until you reach a process, not a part: GPU not detected → power cable not connected → routed where it could not reach → work instruction showed an old layout → not updated after a design change.', 'Fixing only the symptom (plug in the cable) lets it come back on the next unit.'],
  answer: `<p>"GPU not detected" is <b>what was observed</b> — a <b>symptom</b>. A root cause explains <b>why</b> it happened, and fixing it stops it from happening again. If you only fix the symptom (plug the cable in), the same problem comes back on the next unit.</p><p><b>5 Whys (example):</b></p><ol><li>Why was the GPU not detected? — Its <b>power cable</b> was not connected.</li><li>Why was it not connected? — The cable was <b>routed where it could not reach</b> the connector.</li><li>Why was it routed there? — The <b>work instruction</b> showed an <b>old layout</b>.</li><li>Why did it show the old layout? — It was <b>not updated after a design change</b> (the riser changed).</li><li>Why was it not updated? — The design-change process had no step to update work instructions.</li></ol><p><b>Root cause: the outdated work instruction (a process problem), not the single unit.</b> Fix: connect the cable and verify; update the work instruction; check other units built from it; add a WI update step to design changes.</p>`,
  keys: [K('symptom = observed', 'symptom|observ'), K('root cause = why', 'root cause|why it happened'), K('comes back', 'come back|recur|again'), K('5 Whys', 'why'), K('power cable', 'cable'), K('routing', 'rout'), K('work instruction', 'work instruction|WI'), K('design change', 'design|not updated'), K('process', 'process')]
});

M({n: 14, set: 'A', topic: 'Documentation', reread: ['m10'],
  q: 'What should be documented after a repair, and why does documentation matter to people other than you?',
