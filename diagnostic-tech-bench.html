<title>Diagnostic Tech Bench</title>
<meta name="description" content="Teaching and training simulator for the Diagnostic Technician assessment: server hardware, Linux, PCIe, memory, NVMe, networking, BMC, boot and troubleshooting.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: sticky bezel bar with one drive-bay LED per module; left rail of the course; main work area where every lesson pairs an animated topology bench with a live console. */
:root{
  --ground:#ECEFF2; --panel:#FFFFFF; --panel-2:#F5F7F9; --panel-3:#E6EAEE;
  --line:#C9D1D8; --line-soft:#DDE3E8;
  --ink:#0F161D; --ink-2:#3A4855; --ink-3:#647381;
  --accent:#1F5FD1; --accent-ink:#1A4EAA; --accent-wash:#E2EAFA;
  --copper:#AD5F25; --copper-wash:#F6E7DA;
  --ok:#1C7A48; --ok-wash:#DCEFE3;
  --warn:#9E6508; --warn-wash:#F6EAD1;
  --bad:#BA3324; --bad-wash:#F8E1DD;
  --violet:#6A4FC0; --violet-wash:#E9E4F8;
  --term-bg:#0A1016; --term-bar:#131B23; --term-line:#1E2932; --term-fg:#D0DAE1; --term-dim:#6C7F8D;
  --term-acc:#86B4FF; --term-ok:#63C990; --term-warn:#E7B75A; --term-bad:#F3826F; --term-hl:#5A4410; --term-prompt:#9FD3B5;
  --f-display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(15,22,29,.06),0 10px 26px -18px rgba(15,22,29,.35);
  --r:6px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0C1116; --panel:#131A21; --panel-2:#18212A; --panel-3:#202B35;
    --line:#2B3843; --line-soft:#212C36;
    --ink:#DDE5EB; --ink-2:#A3B2BE; --ink-3:#73848F;
    --accent:#5F9DFF; --accent-ink:#9EC2FF; --accent-wash:#15233A;
    --copper:#E0985B; --copper-wash:#33241A;
    --ok:#52B985; --ok-wash:#12291D;
    --warn:#E2A841; --warn-wash:#2E2414;
    --bad:#EF7362; --bad-wash:#341A19;
    --violet:#A894F2; --violet-wash:#231D3A;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 30px -18px rgba(0,0,0,.85);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0C1116; --panel:#131A21; --panel-2:#18212A; --panel-3:#202B35;
  --line:#2B3843; --line-soft:#212C36;
  --ink:#DDE5EB; --ink-2:#A3B2BE; --ink-3:#73848F;
  --accent:#5F9DFF; --accent-ink:#9EC2FF; --accent-wash:#15233A;
  --copper:#E0985B; --copper-wash:#33241A;
  --ok:#52B985; --ok-wash:#12291D;
  --warn:#E2A841; --warn-wash:#2E2414;
  --bad:#EF7362; --bad-wash:#341A19;
  --violet:#A894F2; --violet-wash:#231D3A;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 30px -18px rgba(0,0,0,.85);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.58;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;line-height:1.12;margin:0;text-wrap:balance}
h1{font-size:2.35rem}
h2{font-size:1.7rem}
h3{font-size:1.28rem}
h4{font-size:1.05rem}
p{margin:0}
a{color:var(--accent-ink)}
code,kbd,pre,.mono{font-family:var(--f-mono);font-variant-ligatures:none}
code{font-size:.86em;background:var(--panel-3);border:1px solid var(--line-soft);padding:.05em .35em;border-radius:4px;white-space:nowrap}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:8px 18px;min-height:58px}
.menu-btn{display:inline-flex;background:none;border:1px solid var(--line);border-radius:var(--r);width:40px;height:38px;cursor:pointer;align-items:center;justify-content:center}
.menu-btn svg{width:18px;height:18px;stroke:var(--ink);stroke-width:2;fill:none}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:1.28rem;font-weight:700;letter-spacing:.02em;display:block;line-height:1}
.brand small{display:block;font-family:var(--f-mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bezel{display:flex;align-items:center;gap:4px;padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:var(--panel-2);margin-left:auto}
.bay{width:15px;height:24px;border:1px solid var(--line);border-radius:2px;background:var(--panel);position:relative;cursor:pointer;padding:0}
.bay::after{content:"";position:absolute;left:50%;top:4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--line)}
.bay.seen::after{background:var(--warn)}
.bay.done::after{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.bay.here{border-color:var(--accent)}
.bezel .uid{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-left:6px;box-shadow:0 0 8px var(--accent);animation:uid 2.4s ease-in-out infinite}
@keyframes uid{50%{opacity:.25;box-shadow:none}}
.rank{display:flex;flex-direction:column;align-items:flex-end;min-width:118px}
.rank b{font-family:var(--f-display);font-size:1rem;line-height:1.1}
.rank small{font-family:var(--f-mono);font-size:.68rem;color:var(--ink-3)}
.xpbar{width:118px;height:4px;background:var(--panel-3);border-radius:2px;margin-top:3px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .5s}
.icon-btn{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);height:38px;padding:0 10px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:.84rem}
.icon-btn svg{width:16px;height:16px;stroke:var(--ink-2);fill:none;stroke-width:1.8}

/* ---------- frame ---------- */
.wrap{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:calc(100% - 58px);transition:grid-template-columns .22s ease}
.rail{border-right:1px solid var(--line);background:var(--panel-2);padding:14px 10px 40px;min-width:0;position:sticky;top:calc(58px + env(safe-area-inset-top,0px));height:calc(100vh - 58px);overflow-y:auto}
.rail h6{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:16px 10px 6px;font-weight:500}
.rail h6:first-child{margin-top:4px}
.rail a{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:5px;color:var(--ink-2);text-decoration:none;font-size:.92rem;line-height:1.25}
.rail a:hover{background:var(--panel-3);color:var(--ink)}
.rail a.on{background:var(--accent-wash);color:var(--accent-ink);font-weight:700}
.rail a .n{font-family:var(--f-mono);font-size:.7rem;color:var(--ink-3);width:22px;flex:none}
.rail a .led{width:7px;height:7px;border-radius:50%;background:var(--line);margin-left:auto;flex:none}
.rail a .led.seen{background:var(--warn)}
.rail a .led.done{background:var(--ok)}
.scrim{display:none}
.rail-toggle{display:flex;align-items:center;gap:8px;width:100%;background:none;border:1px solid var(--line);border-radius:5px;padding:6px 10px;margin-bottom:6px;cursor:pointer;color:var(--ink-3);font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
.rail-toggle:hover{color:var(--ink);border-color:var(--accent)}
.rail-toggle svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;flex:none;transition:transform .22s}
.rail a .lbl{min-width:0}
@media (min-width:861px){
  .wrap.rail-min{grid-template-columns:62px minmax(0,1fr)}
  .wrap.rail-min .rail{padding:12px 6px 40px;overflow-x:hidden}
  .wrap.rail-min .rail-toggle{justify-content:center;padding:6px 0}
  .wrap.rail-min .rail-toggle span{display:none}
  .wrap.rail-min .rail-toggle svg{transform:rotate(180deg)}
  .wrap.rail-min .rail h6{font-size:0;height:1px;background:var(--line);margin:10px 6px;padding:0}
  .wrap.rail-min .rail h6:first-of-type{margin-top:6px}
  .wrap.rail-min .rail a{justify-content:center;padding:8px 0;position:relative;gap:0}
  .wrap.rail-min .rail a .n{width:auto;font-size:.76rem;color:inherit}
  .wrap.rail-min .rail a .lbl{display:none}
  .wrap.rail-min .rail a .led{position:absolute;top:5px;right:6px;width:6px;height:6px;margin:0}
}
main{min-width:0;padding-inline:clamp(16px,3vw,40px);padding-block:26px 90px}
.page{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:26px}

/* ---------- hero / sections ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:end;padding-bottom:14px;border-bottom:1px solid var(--line)}
.hero .lead{font-size:1.1rem;color:var(--ink-2);max-width:68ch;margin-top:10px}
.hero .meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-family:var(--f-mono);font-size:.74rem;color:var(--ink-3)}
.sec-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-title .eyebrow{color:var(--accent-ink)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px 22px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.prose{max-width:72ch;display:flex;flex-direction:column;gap:12px;color:var(--ink)}
.prose ul,.prose ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:5px}
.prose li::marker{color:var(--ink-3)}
.prose strong{color:var(--ink)}

/* lesson cards */
.lesson{display:grid;grid-template-columns:150px minmax(0,1fr);gap:22px;padding:22px 24px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.lesson>.lhead{display:flex;flex-direction:column;gap:6px}
.lesson>.lhead .num{font-family:var(--f-mono);font-size:.78rem;color:var(--copper)}
.lesson>.lhead h3{font-size:1.2rem}
.lesson>.lbody{min-width:0;display:flex;flex-direction:column;gap:14px}
.callout{border-left:3px solid var(--accent);background:var(--accent-wash);padding:10px 14px;border-radius:0 5px 5px 0;max-width:76ch}
.callout b.tag{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:3px;color:var(--accent-ink)}
.callout.ex{border-color:var(--copper);background:var(--copper-wash)}
.callout.ex b.tag{color:var(--copper)}
.callout.warn{border-color:var(--warn);background:var(--warn-wash)}
.callout.warn b.tag{color:var(--warn)}
.callout.ok{border-color:var(--ok);background:var(--ok-wash)}
.callout.ok b.tag{color:var(--ok)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:5px}
table.tbl{border-collapse:collapse;width:100%;font-size:.92rem}
.tbl th{text-align:left;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);background:var(--panel-2);font-weight:500;padding:8px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl td code{white-space:normal}
pre.out{background:var(--term-bg);color:var(--term-fg);font-size:.8rem;line-height:1.5;padding:12px 14px;border-radius:5px;overflow-x:auto;margin:0}

/* ---------- topology bench ---------- */
.bench{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.bench-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.bench-head .ttl{font-family:var(--f-display);font-weight:600;font-size:1.05rem;margin-right:auto}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:.82rem;cursor:pointer;color:var(--ink-2);line-height:1.3}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.bad.on{background:var(--bad);border-color:var(--bad)}
.topo-svg-wrap{overflow-x:auto;background:var(--panel)}
.topo-svg-wrap svg{display:block;width:100%;min-width:560px;height:auto}
.narr{display:flex;gap:12px;align-items:flex-start;padding:11px 16px;border-top:1px solid var(--line);background:var(--panel-2);min-height:62px}
.narr .step{font-family:var(--f-mono);font-size:.72rem;color:#fff;background:var(--accent);border-radius:3px;padding:2px 6px;flex:none;margin-top:2px}
.narr .txt{font-size:.95rem;color:var(--ink);max-width:90ch}
.tctl{display:flex;gap:6px;align-items:center}
.tbtn{background:var(--panel);border:1px solid var(--line);border-radius:5px;height:30px;min-width:30px;padding:0 8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:.8rem;color:var(--ink-2)}
.tbtn svg{width:14px;height:14px;fill:var(--ink-2)}
.tbtn:hover{border-color:var(--accent)}

/* svg pieces */
.t-grp rect{fill:var(--panel-2);stroke:var(--line);stroke-dasharray:4 4}
.t-grp text{fill:var(--ink-3);font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.t-lnk{stroke:var(--line);stroke-width:2.2;fill:none;stroke-linecap:round;transition:stroke .3s,opacity .3s}
.t-lnk.k-pcie{stroke:var(--copper);opacity:.75}
.t-lnk.k-net{stroke:var(--accent);opacity:.65}
.t-lnk.k-mgmt{stroke:var(--violet);opacity:.7;stroke-dasharray:6 4}
.t-lnk.k-pwr{stroke:var(--warn);opacity:.6}
.t-lnk.k-log{stroke:var(--ink-3);opacity:.5}
.t-lnk.k-air{stroke:var(--accent);opacity:.35;stroke-dasharray:3 6}
.t-lnk.k-flow{stroke:var(--ink-3);opacity:.45}
.t-lnk.ls-down{stroke:var(--bad)!important;opacity:.9!important;stroke-dasharray:5 5}
.t-lnk.ls-slow{stroke:var(--warn)!important;opacity:.95!important}
.t-lnk.ls-err{stroke:var(--warn)!important;opacity:.95!important;stroke-dasharray:2 5;animation:dash 1s linear infinite}
.t-lnk.ls-off{opacity:.15!important}
.t-lnk.ls-hi{stroke:var(--accent)!important;opacity:1!important}
@keyframes dash{to{stroke-dashoffset:-14}}
.t-ltxt{fill:var(--ink-3);font-family:var(--f-mono);font-size:9.5px}
.t-nd rect.body{fill:var(--panel);stroke:var(--ink-3);stroke-width:1.2;transition:stroke .3s,fill .3s}
.t-nd text.lbl{fill:var(--ink);font-family:var(--f-body);font-size:12.5px;font-weight:700}
.t-nd text.sub{fill:var(--ink-3);font-family:var(--f-mono);font-size:9.5px}
.t-nd text.tag{fill:var(--copper);font-family:var(--f-mono);font-size:8.5px;letter-spacing:.12em}
.t-nd circle.led{fill:var(--ok);transition:fill .3s}
.t-nd.clickable{cursor:pointer}
.t-nd.clickable:hover rect.body{stroke:var(--accent)}
.t-nd.s-warn rect.body{stroke:var(--warn);fill:var(--warn-wash)}
.t-nd.s-warn circle.led{fill:var(--warn)}
.t-nd.s-bad rect.body{stroke:var(--bad);fill:var(--bad-wash);stroke-width:1.8}
.t-nd.s-bad circle.led{fill:var(--bad)}
.t-nd.s-missing rect.body{stroke-dasharray:4 3;fill:none;stroke:var(--bad)}
.t-nd.s-missing text.lbl,.t-nd.s-missing text.sub{opacity:.5}
.t-nd.s-missing circle.led{fill:var(--line)}
.t-nd.s-off{opacity:.35}
.t-nd.s-off circle.led{fill:var(--line)}
.t-nd.s-hi rect.body{stroke:var(--accent);stroke-width:2.4;fill:var(--accent-wash)}
.t-nd.s-good rect.body{stroke:var(--ok);fill:var(--ok-wash);stroke-width:1.8}
.t-nd.k-fan .blades{transform-box:fill-box;transform-origin:center;animation:spin 1.1s linear infinite}
.t-nd.k-fan.s-bad .blades,.t-nd.k-fan.s-off .blades,.t-nd.k-fan.s-missing .blades{animation:none}
.t-nd.k-fan.fast .blades{animation-duration:.35s}
@keyframes spin{to{transform:rotate(360deg)}}
.t-nd .blades path{fill:var(--ink-3)}
.t-free{fill:var(--ink-2);font-family:var(--f-mono);font-size:10px}
.t-free.big{font-family:var(--f-display);font-size:15px;font-weight:600;fill:var(--ink)}
.t-free.ok{fill:var(--ok)}.t-free.bad{fill:var(--bad)}.t-free.warn{fill:var(--warn)}.t-free.acc{fill:var(--accent-ink)}
.t-nd .toolmark{display:none}
.t-nd.actable .toolmark{display:block}
.toolmark circle{fill:var(--copper)}
.toolmark path{stroke:#fff;stroke-width:1.5;fill:none;stroke-linecap:round}
.t-nd.actable.sel rect.body{stroke:var(--copper);stroke-width:2.6}
.pk{stroke:var(--panel);stroke-width:1.5}
.pk.c-acc{fill:var(--accent)}.pk.c-ok{fill:var(--ok)}.pk.c-bad{fill:var(--bad)}.pk.c-warn{fill:var(--warn)}.pk.c-cu{fill:var(--copper)}.pk.c-vi{fill:var(--violet)}.pk.c-ink{fill:var(--ink-2)}
.pk-tag rect{fill:var(--ink);opacity:.88}
.pk-tag text{fill:var(--panel);font-family:var(--f-mono);font-size:9px;font-weight:700;letter-spacing:.05em}
.ring{fill:none;stroke-width:2}
.ring.c-acc{stroke:var(--accent)}.ring.c-ok{stroke:var(--ok)}.ring.c-bad{stroke:var(--bad)}.ring.c-warn{stroke:var(--warn)}.ring.c-cu{stroke:var(--copper)}.ring.c-vi{stroke:var(--violet)}
.xmark{stroke:var(--bad);stroke-width:3;stroke-linecap:round}

/* ---------- physical bench tray ---------- */
.tray{border-top:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
.tray .th{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tray .badge{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--copper);border-radius:3px;padding:2px 7px}
.tray .pname{font-family:var(--f-display);font-size:1.05rem;font-weight:600}
.tray .hint{font-size:.86rem;color:var(--ink-3)}
.tray .partchips{display:flex;gap:6px;flex-wrap:wrap}
.tray .partchips button{border:1px dashed var(--copper);background:var(--copper-wash);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:.8rem;cursor:pointer}
.tray .pacts{display:flex;gap:8px;flex-wrap:wrap}
.envtag{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.84rem;color:var(--ink-2)}
.envtag b{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;border-radius:3px;padding:2px 7px;color:#fff}
.envtag b.cli{background:var(--ink)}
.envtag b.gui{background:var(--violet)}
.envtag b.phy{background:var(--copper)}
/* BMC web GUI */
.bmcweb{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.bmcweb .bwhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;background:var(--panel-3);border-bottom:1px solid var(--line);font-size:.82rem}
.bmcweb .url{font-family:var(--f-mono);font-size:.74rem;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bmcweb .tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--panel-2)}
.bmcweb .tabs button{border:1px solid transparent;border-bottom:none;background:none;padding:6px 12px;font-size:.84rem;cursor:pointer;border-radius:5px 5px 0 0;color:var(--ink-2)}
.bmcweb .tabs button.on{background:var(--panel);border-color:var(--line);color:var(--ink);font-weight:700;margin-bottom:-1px}
.bmcweb .bwbody{padding:12px;overflow-x:auto}
.bmcweb .leds{display:flex;gap:18px;flex-wrap:wrap}
.bmcweb .led{display:flex;align-items:center;gap:8px;font-size:.88rem}
.bmcweb .led i{width:14px;height:14px;border-radius:50%;display:inline-block;background:var(--line)}
.bmcweb .led i.g{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.bmcweb .led i.a{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.bmcweb .led i.r{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.bmcweb .led i.b{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.bmcweb td.st-ok{color:var(--ok);font-weight:700}
.bmcweb td.st-w{color:var(--warn);font-weight:700}
.bmcweb td.st-e{color:var(--bad);font-weight:700}
.bmcweb tr.rw td{background:var(--warn-wash)}
.bmcweb tr.re td{background:var(--bad-wash)}
.testpanel{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.testpanel .res{font-family:var(--f-mono);font-size:.82rem;background:var(--term-bg);color:var(--term-fg);border-radius:5px;padding:10px 12px;white-space:pre-wrap;min-height:60px;max-height:220px;overflow-y:auto}
/* ---------- console ---------- */
.console{display:flex;flex-direction:column;background:var(--term-bg);border-radius:var(--r);border:1px solid var(--term-line);overflow:hidden;min-height:340px;color:var(--term-fg)}
.cbar{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--term-bar);border-bottom:1px solid var(--term-line);font-family:var(--f-mono);font-size:.72rem;color:var(--term-dim);flex-wrap:wrap}
.cbar .where{color:var(--term-acc);font-weight:700}
.cbar .os{background:var(--term-acc);color:#0A1016;padding:1px 7px;border-radius:3px;font-weight:700;letter-spacing:.06em}
.cenv{font-family:var(--f-mono);font-size:.72rem;color:var(--term-fg);padding:6px 12px;border-bottom:1px solid var(--term-line);background:#0D151C}
.cenv b{color:var(--term-ok);font-weight:500}
.cbar .sp{margin-left:auto}
.cbar button{background:transparent;border:1px solid var(--term-line);color:var(--term-dim);border-radius:4px;font-family:var(--f-mono);font-size:.7rem;padding:3px 8px;cursor:pointer}
.cbar button:hover{color:var(--term-fg);border-color:var(--term-dim)}
.cbar button.on{color:var(--term-ok);border-color:var(--term-ok)}
.cout{flex:1;overflow-y:auto;padding:10px 12px 4px;font-family:var(--f-mono);font-size:.8rem;line-height:1.5;white-space:pre-wrap;word-break:break-word;max-height:470px;min-height:250px}
.cout .ln{min-height:1.5em}
.cout .p{color:var(--term-prompt)}
.cout .cmd{color:#fff}
.cout .d{color:var(--term-dim)}
.cout .e{color:var(--term-bad)}
.cout .w{color:var(--term-warn)}
.cout .g{color:var(--term-ok)}
.cout .a{color:var(--term-acc)}
.cout mark{background:var(--term-hl);color:#FFE7A6;border-radius:2px;padding:0 1px}
.cout .tip{color:var(--term-acc);font-style:italic}
.cin{display:flex;align-items:center;gap:8px;padding:6px 12px 10px;font-family:var(--f-mono);font-size:.8rem;border-top:1px dashed var(--term-line)}
.cin .p{color:var(--term-prompt);white-space:nowrap;max-width:55%;overflow:hidden;text-overflow:ellipsis}
.cin input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:#fff;font-family:var(--f-mono);font-size:.82rem;caret-color:var(--term-ok);padding:4px 0}
.cin input::placeholder{color:var(--term-dim)}
.cin .run{background:var(--term-bar);border:1px solid var(--term-line);color:var(--term-ok);border-radius:4px;font-family:var(--f-mono);font-size:.72rem;padding:4px 10px;cursor:pointer}
.kchips{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 10px}
.kchip{background:var(--term-bar);border:1px solid var(--term-line);color:var(--term-fg);border-radius:4px;font-family:var(--f-mono);font-size:.72rem;padding:3px 8px;cursor:pointer}
.kchip:hover{border-color:var(--term-acc);color:#fff}
.nano{display:flex;flex-direction:column;gap:6px;padding:8px 12px 12px;border-top:1px solid var(--term-line);background:#0E1620}
.nano .nbar{font-family:var(--f-mono);font-size:.72rem;color:var(--term-bg);background:var(--term-fg);padding:2px 8px}
.nano textarea{width:100%;min-height:150px;background:transparent;color:#fff;border:1px solid var(--term-line);font-family:var(--f-mono);font-size:.8rem;padding:8px;resize:vertical}
.nano .row button{background:var(--term-bar);border:1px solid var(--term-line);color:var(--term-ok);font-family:var(--f-mono);font-size:.72rem;padding:4px 10px;border-radius:4px;cursor:pointer}

/* ---------- lab ---------- */
.lab{display:flex;flex-direction:column;gap:14px;min-width:0}
.labtop{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
.labtop>*{min-width:0}
.labtop>.brief:first-child{grid-row:span 3}
.labwork{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.labwork.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.labwork>*{min-width:0}
.brief{padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:10px}
.brief .tkt{display:flex;gap:10px;align-items:center;font-family:var(--f-mono);font-size:.72rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}
.brief .tkt b{color:var(--bad)}
.tasks{display:flex;flex-direction:column;gap:2px;padding:6px 0}
.task{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:7px 4px;align-items:start;border-bottom:1px solid var(--line-soft)}
.task:last-child{border-bottom:none}
.task .box{width:18px;height:18px;border:1.5px solid var(--ink-3);border-radius:4px;margin-top:2px;display:flex;align-items:center;justify-content:center}
.task.done .box{background:var(--ok);border-color:var(--ok)}
.task.done .box::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.task.done .t{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ok)}
.task .h{font-size:.82rem;color:var(--ink-3);margin-top:2px}
.task .h button{background:none;border:none;color:var(--accent-ink);cursor:pointer;padding:0;font-size:.82rem;text-decoration:underline}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.act{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel-2);border-radius:5px;padding:7px 11px;font-size:.86rem;cursor:pointer;text-align:left;line-height:1.25}
.act:hover{border-color:var(--copper)}
.act .k{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--copper);border:1px solid var(--copper);border-radius:3px;padding:1px 4px}
.act.used{opacity:.6}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:5px;padding:8px 14px;font-weight:700;font-size:.9rem;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent-ink)}
.btn.warn{background:var(--warn);border-color:var(--warn)}
.btn.ok{background:var(--ok);border-color:var(--ok)}
.btn.sm{padding:5px 10px;font-size:.8rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* reveal / hints */
.reveal{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.reveal .rh{display:flex;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap}
.reveal .rh .eyebrow{color:var(--warn)}
.reveal .rb{padding:4px 18px 18px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line-soft)}
.reveal.hint{border-color:var(--warn)}
.reveal.ans{border-color:var(--ok)}
.reveal.ans .rh .eyebrow{color:var(--ok)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px}
.steps>li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px}
.steps>li::before{content:counter(s);font-family:var(--f-mono);font-size:.78rem;width:24px;height:24px;border-radius:50%;background:var(--panel-3);display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.qbox{border-left:4px solid var(--ink);padding:4px 0 4px 16px}
.qbox .qn{font-family:var(--f-display);font-size:2.4rem;line-height:1;color:var(--copper)}
.qbox p.q{font-size:1.12rem;max-width:74ch}
textarea.ansbox{width:100%;min-height:150px;border:1px solid var(--line);border-radius:5px;background:var(--panel-2);color:var(--ink);font-family:var(--f-body);font-size:.95rem;padding:12px;resize:vertical;line-height:1.55}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.key{font-size:.78rem;border-radius:999px;padding:2px 10px;border:1px solid var(--line);color:var(--ink-3)}
.key.hit{border-color:var(--ok);background:var(--ok-wash);color:var(--ok)}
.grade{display:flex;gap:6px;flex-wrap:wrap}
.grade button{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:6px 12px;cursor:pointer;font-size:.85rem}
.grade button.on[data-g="got"]{background:var(--ok);border-color:var(--ok);color:#fff}
.grade button.on[data-g="partly"]{background:var(--warn);border-color:var(--warn);color:#fff}
.grade button.on[data-g="missed"]{background:var(--bad);border-color:var(--bad);color:#fff}

/* check yourself */
.cq{border-bottom:1px solid var(--line-soft);padding:12px 0;display:flex;flex-direction:column;gap:8px}
.cq:last-child{border-bottom:none}
.cq .q{display:flex;gap:10px;align-items:baseline}
.cq .q b{font-family:var(--f-mono);font-size:.8rem;color:var(--copper)}
.cq .a{background:var(--ok-wash);border-radius:5px;padding:10px 14px;font-size:.94rem}

/* mission list */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mcard{display:flex;flex-direction:column;gap:8px;padding:14px 15px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);text-decoration:none;color:var(--ink);position:relative;min-height:142px}
.mcard:hover{border-color:var(--accent)}
.mcard .mn{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.74rem;color:var(--ink-3)}
.mcard .mn b{font-family:var(--f-display);font-size:1.5rem;color:var(--copper);line-height:1}
.mcard .mt{font-weight:700;line-height:1.3}
.mcard .mq{font-size:.84rem;color:var(--ink-3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;border-radius:3px;padding:2px 6px;border:1px solid var(--line);color:var(--ink-3)}
.pill.got{border-color:var(--ok);color:var(--ok);background:var(--ok-wash)}
.pill.partly{border-color:var(--warn);color:var(--warn);background:var(--warn-wash)}
.pill.missed{border-color:var(--bad);color:var(--bad);background:var(--bad-wash)}
.pill.live{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-wash)}
.mcard .pill{margin-left:auto}

/* widgets */
.widget{border:1px solid var(--line);border-radius:var(--r);background:var(--panel-2);padding:16px;display:flex;flex-direction:column;gap:12px}
.widget .wt{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--copper)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;flex-wrap:wrap}
.seg button{background:var(--panel);border:none;border-right:1px solid var(--line);padding:6px 11px;cursor:pointer;font-size:.84rem;color:var(--ink-2)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--ink);color:var(--panel)}
.tog{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:5px 10px;cursor:pointer;font-family:var(--f-mono);font-size:.8rem}
.tog.on{border-color:var(--accent);background:var(--accent-wash);color:var(--accent-ink)}
.bigval{font-family:var(--f-display);font-size:2.2rem;font-weight:700;line-height:1}
.meter{height:12px;border-radius:3px;background:var(--panel-3);overflow:hidden;position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--copper);transition:width .5s}
.meter i.cap{background:transparent;border-right:2px dashed var(--ink-3)}
.bits{display:flex;gap:4px;flex-wrap:wrap}
.bit{width:34px;height:40px;border:1px solid var(--line);border-radius:4px;background:var(--panel);font-family:var(--f-mono);font-size:1rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.bit small{font-size:.55rem;color:var(--ink-3);margin-top:3px}
.bit.chk{background:var(--violet-wash);border-color:var(--violet)}
.bit.flip{background:var(--bad-wash);border-color:var(--bad);color:var(--bad)}
.bit.fixed{background:var(--ok-wash);border-color:var(--ok);color:var(--ok)}
.annot{font-family:var(--f-mono);font-size:.82rem;line-height:1.9;background:var(--term-bg);color:var(--term-fg);padding:12px 14px;border-radius:5px;overflow-x:auto;white-space:pre}
.annot span.tk{cursor:pointer;border-bottom:1px dashed var(--term-dim);border-radius:2px}
.annot span.tk:hover,.annot span.tk.on{background:var(--term-hl);color:#FFE7A6}
.explain{min-height:54px;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:10px 14px;font-size:.94rem}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow .node{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:6px 10px;font-size:.86rem;cursor:pointer}
.flow .node.on{border-color:var(--accent);background:var(--accent-wash)}
.flow .node.yes{border-color:var(--ok);background:var(--ok-wash)}
.flow .node.no{border-color:var(--bad);background:var(--bad-wash)}
.flow .arr{color:var(--ink-3);font-family:var(--f-mono)}
.flash{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.card-flip{border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:12px;min-height:96px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left}
.card-flip b{font-family:var(--f-display);font-size:1.1rem}
.card-flip span{font-size:.86rem;color:var(--ink-2)}
.card-flip.open{background:var(--accent-wash);border-color:var(--accent)}
input.inp,select.inp{border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--ink);font-family:var(--f-mono);font-size:.88rem;padding:6px 9px;min-width:0}

/* start page */
.starthero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:center}
.starthero h1{font-size:clamp(2.2rem,5vw,3.4rem);line-height:1.02}
.starthero h1 em{font-style:normal;color:var(--accent-ink)}
.statrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:10px 12px}
.stat b{font-family:var(--f-display);font-size:1.7rem;display:block;line-height:1}
.stat span{font-size:.78rem;color:var(--ink-3)}
.method{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.mstep{border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:10px;display:flex;flex-direction:column;gap:4px}
.mstep i{font-style:normal;font-family:var(--f-mono);font-size:.7rem;color:var(--copper)}
.mstep b{font-size:.92rem;line-height:1.2}
.mstep span{font-size:.8rem;color:var(--ink-3)}
.modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.modcard{display:flex;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);text-decoration:none;color:var(--ink);align-items:flex-start}
.modcard:hover{border-color:var(--accent)}
.modcard .n{font-family:var(--f-display);font-size:1.6rem;color:var(--copper);line-height:1;width:30px}
.modcard b{display:block;line-height:1.2}
.modcard span{font-size:.8rem;color:var(--ink-3)}

/* exam */
.timer{font-family:var(--f-mono);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.examq{display:flex;flex-direction:column;gap:8px;padding:16px 0;border-bottom:1px solid var(--line-soft)}
.examq .q{display:flex;gap:12px}
.examq .q b{font-family:var(--f-display);font-size:1.5rem;color:var(--copper);line-height:1;width:34px;flex:none}

.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--ink);color:var(--panel);padding:10px 14px;border-radius:6px;font-size:.88rem;box-shadow:var(--shadow);max-width:320px;animation:tin .25s ease-out}
.toast b{color:var(--panel)}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
.foot{font-size:.8rem;color:var(--ink-3);border-top:1px solid var(--line);padding-top:14px;margin-top:10px}
.hide{display:none!important}

@media (max-width:1100px){
  .labtop,.labwork.two{grid-template-columns:minmax(0,1fr)}
  .labtop>.brief:first-child{grid-row:auto}
  .method{grid-template-columns:repeat(3,minmax(0,1fr))}
  .rank{display:none}
}
@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .menu-btn{display:inline-flex}
  .rail{position:fixed;left:0;top:calc(58px + env(safe-area-inset-top,0px));bottom:0;height:auto;width:280px;max-width:86vw;z-index:50;transform:translateX(-105%);transition:transform .25s;box-shadow:var(--shadow)}
  .rail.open{transform:none}
  .rail-toggle{display:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:45}
  .bezel .bay:nth-child(n+7){display:none}
  .lesson{grid-template-columns:minmax(0,1fr);gap:10px;padding:18px}
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero .meta{align-items:flex-start}
  .starthero{grid-template-columns:minmax(0,1fr)}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .statrow{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  h1{font-size:1.9rem}
  .top{gap:10px;padding:8px 12px}
  .brand small{display:none}
  .bezel{display:none}
  .method{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cout{font-size:.74rem}
  #themeBtn span{display:none}
}

/* ---------- pen & paper prep ---------- */
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 26px;display:flex;flex-direction:column;gap:16px}
.sheethead{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--line);padding-bottom:10px}
.sheetq{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;align-items:start}
.sheetq .qn{font-family:var(--f-display);font-size:2.4rem;line-height:1;color:var(--copper)}
.sheetq p.q,.sheet p.q{font-size:1.15rem;line-height:1.55;max-width:72ch}
.kindtag{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--violet);color:var(--violet);background:var(--violet-wash);border-radius:3px;padding:2px 7px}
.penbox{border:2px dashed var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:4px;background:var(--panel-2);color:var(--ink-2)}

    this.trayRes.style.cssText = 'font-size:.88rem;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:8px 10px';
  }
  mount() { this.host.innerHTML = ''; this.host.appendChild(this.el); }
  destroy() { this.demoTok++; if (this.topo) this.topo.destroy(); }
  resetLab() {
    this.demoTok++;
    const old = this.el; this.done = new Set(); this.flags = {}; this.used = new Set(); this.completed = false;
    this.build();

  }
  flag(k) { this.flags[k] = true; }
  onRun(line, results) {
    const r = this.rig;
    r.ran.push(line);
    const evs = results.flatMap(x => x ? (x.evs || []) : []);
    this.lastEvs = evs; this.lastLine = line;
    if (this.def.onCmd) this.def.onCmd(this, line, results, evs);
    this.topo.restate();
    if (this.panel) this.panel.update();
    this.check(line, results);
  }
  check(line, results) {
    const r = this.rig; const tasks = this.def.tasks || [];
    tasks.forEach((t, i) => {
      if (this.done.has(i)) return;
      let ok = false;
      if (line && t.cmd && t.cmd.test(line.trim())) ok = t.ok ? t.ok(r, results || [], this) : true;
      if (t.when && t.when(r, this)) ok = true;
      if (ok) {
        this.done.add(i);
        this.taskEls[i].classList.add('done');
        if (window.App && App.award) App.award(`${this.def.id}:t${i}`, 10, null);
      }
    });
    if (tasks.length && this.done.size === tasks.length && !this.completed) {
      this.completed = true;
      if (window.App && App.award) App.award(`${this.def.id}:done`, this.def.xp || 40, `${this.def.title}: checklist complete`);
      if (this.def.onComplete) this.def.onComplete(this);
    }
  }
  doAction(a, btn) {
    const r = this.rig;
    this.used = this.used || new Set(); this.used.add(a.id);
    if (btn) btn.classList.add('used');
    const msg = a.do(r, this);
    if (this.con) this.con.print(L('a', `▸ ${a.node ? 'Hands on' : (KIND_TAG[a.kind] || 'Action')}: ${a.label}`));
    this.log(msg);
    if (this.con) this.con.updPrompt();
    r.ran.push('#action ' + a.id);
    this.topo.restate();
    if (a.anim) this.topo.anim(t => a.anim(t, r));
    else if (a.node) { [].concat(a.node).forEach(n => this.topo.pulse(n, 'cu')); }
    if (this.panel) this.panel.update();
    this.check('#action ' + a.id, []);
    if (a.reboot && this.con) this.con.reboot(a.reboot);
    else if (a.reboot) { rebootRig(r, a.reboot); this.topo.restate(); if (this.panel) this.panel.update(); this.check(); }
  }
  anim(line, res) {
    const spec = this.topo.spec;
    this.topo.restate();
    if (spec.anim) this.topo.anim(t => spec.anim(t, line, res, this.rig, this));
  }
  dora(k) { const spec = this.topo.spec; if (spec.dora) this.topo.anim(t => spec.dora(t, k, this.rig)); }
  stage(s) { const spec = this.topo.spec; if (spec.stage) spec.stage(this.topo, s, this.rig); }
  async demo() {
    const d = this.def; const tok = ++this.demoTok;
    const stopped = () => tok !== this.demoTok;
    if (this.con) this.con.print(L('a', '▶ Demo mode: watch it run. Type in the console to take over.'));
    for (let loop = 0; loop < 3; loop++) {
      for (const c of d.demo) {
        if (stopped()) return;
        if (c.startsWith('#')) {
          const a = (d.actions || []).find(x => x.id === c.slice(1));
          if (a) { if (a.node) { const n = [].concat(a.node)[0]; this.selectPart(n); await this.topo.pulse(n, 'cu'); await sleep(RM ? 100 : 900); } if (stopped()) return; this.doAction(a, null); }
          await sleep(RM ? 100 : 2400); continue;
        }
        if (c.startsWith('@')) { if (this.panel && this.panel.show) this.panel.show(c.slice(1)); await sleep(RM ? 100 : 2400); continue; }
        if (!this.con) continue;
        const ok = await this.con.typeAndRun(c, stopped);
        if (!ok) return;
        await sleep(RM ? 200 : 2200);
      }
      if (stopped()) return;
      if (this.con) this.con.print(L('d', '— demo loops in 4 seconds (the lab resets first) —'));
      await sleep(4000);
      if (stopped()) return;
      const keep = this.demoTok;
      this.resetLab(); this.demoTok = keep;
      if (this.con) this.con.print(L('a', '▶ Demo mode (loop ' + (loop + 2) + ')'));
    }
  }
}

function bmcData(r) {
  const temps = [['Inlet Temp', r.temps.inlet], ['CPU1 Temp', r.temps.cpu1], ['CPU2 Temp', r.cpus[1].ok ? r.temps.cpu2 : null]];
  allDevs(r).filter(d => d.kind === 'gpu').forEach(g => { const gi = r.gpuInfo[g.id]; temps.push([`GPU${g.id.slice(3)} Temp`, devVisible(r, g) && !gi.fell ? gi.temp : (gi.temp > 40 ? gi.temp : null)]); });
  allDevs(r).filter(d => d.kind === 'nvme').forEach(d => temps.push([`NVMe Bay${r.nvmeInfo[d.id].bay} Temp`, devVisible(r, d) && !d.gone ? r.nvmeInfo[d.id].temp : null]));
  const fans = Object.entries(r.fans);
  const psu = [['PS1', r.bmc.psu.ps1], ['PS2', r.bmc.psu.ps2]];
  const bad = fans.some(([, v]) => v < 800) || temps.some(([, v]) => v != null && v >= 85) || psu.some(([, s]) => s !== 'ok') || r.dimms.some(d => d.ce > 1000 || d.ue) || allDevs(r).some(d => d.gone);
  return {temps, fans, psu, bad};
}

        <div class="tblwrap" style="margin-top:12px"><table class="tbl"><tr><th>Subsystem</th><th>Status</th></tr>
        <tr><td>Fans</td><td class="${D.fans.some(([, v]) => v < 800) ? 'st-e' : D.fans.some(([, v]) => v > 12000) ? 'st-w' : 'st-ok'}">${D.fans.some(([, v]) => v < 800) ? 'Failed fan' : D.fans.some(([, v]) => v > 12000) ? 'All fans at high speed' : 'OK'}</td></tr>

        <tr><td>Memory</td><td class="${r.dimms.some(d => d.ce > 1000 || d.ue) ? 'st-w' : 'st-ok'}">${r.dimms.some(d => d.ce > 1000 || d.ue) ? 'ECC events logged' : 'OK'}</td></tr></table></div>`;

        D.psu.map(([n, s]) => `<tr class="${s !== 'ok' ? 're' : ''}"><td>${n} Status</td><td>${s === 'ok' ? 'Presence detected' : s === 'nocord' ? 'AC lost' : 'Failure detected'}</td><td class="${s === 'ok' ? 'st-ok' : 'st-e'}">${s === 'ok' ? 'OK' : 'Critical'}</td></tr>`).join('') + '</table></div>';
    } else if (cur === 'Event Log') {

    } else if (o.extra && o.extra[cur]) html = o.extra[cur](r);

  render();

<script>
/* =====================================================================
   Topology builders — one drawing per topic, synced to a rig

const N = (id, x, y, label, sub, kind, w, hh, extra) => Object.assign({id, x, y, label, sub, kind, w, h: hh}, extra || {});
const Lk = (a, b, kind, extra) => Object.assign({a, b, kind}, extra || {});
const gen = g => ({5: 32, 4: 16, 3: 8}[g]);
const genOf = gt => ({32: 5, 16: 4, 8: 3, 5: 2, 2.5: 1, 64: 6}[gt] || '?');
const lnkTxt = (s) => `Gen${genOf(s.gt)} x${s.w}`;

/* shared animation helpers */
function netFlow(t, rig, res, from) {
  const n = res.net || {};
  if (n.dnsq != null) {
    const dn = (rig.net.hosts[n.dnsq] || {}).node || 'dns';
    return (async () => {
      const ok = await t.go(from || 'srv', dn, {c: 'vi', tag: 'DNS ?', force: false});
      if (ok && !n.fail) await t.go(dn, from || 'srv', {c: n.nx ? 'bad' : 'ok', tag: n.nx ? 'NXDOMAIN' : 'A ' + (n.ip || '')});
      if (!ok || n.fail) t.say('The DNS question never got an answer: the DNS server named in /etc/resolv.conf is not reachable.', 'DNS');
      else t.say(n.nx ? 'The DNS server answered, but it has no record for that name (NXDOMAIN).' : `DNS answered with an A record: ${n.ip}. The answer is cached for its TTL.`, 'DNS');
    })();
  }
  if (!n.target) return;
  if (n.dns && n.dns.fail) {
    return (async () => {
      t.pulse(from || 'srv', 'vi');
      await t.wait(300);
      const ok = await t.go(from || 'srv', 'dns', {c: 'vi', tag: 'DNS ?'});
      t.say(ok ? 'Name lookup failed: the DNS server has no record for that name. The network itself is fine.' : 'Name lookup failed before any ping was sent: the DNS server could not be reached.', 'DNS');
    })();
  }
  const ip = n.target;
  const host = rig.net.hosts[ip];
  const src = n.from === 'laptop' || from === 'laptop' ? 'laptop' : 'srv';
  let dst = host ? host.node : (rig.ifaces.some(i => i.ip === ip) ? 'srv' : (rig.bmc && ip === rig.bmc.ip ? 'bmc' : 'gw'));
  if (!t.nodes[dst]) dst = 'gw';
  if (!t.nodes[src] || !t.nodes[dst]) return;
  const p = n.path || {};
  const route = t.route(src, dst);
  const o = {c: p.ok ? 'ok' : 'acc', tag: (n.size && n.size > 1400 ? n.size + 'B ' : '') + 'ICMP'};
  if (!p.ok && p.failAt) {
    const f = p.failAt === 'srv' && src === 'laptop' ? 'srv' : p.failAt;
    const ix = route.indexOf(f);
    if ((f === 'srv' || f === 'sw') && src !== 'laptop' && ix >= 0 && ix < route.length - 1) o.failLink = [route[ix], route[ix + 1]];
    else if (ix >= 0) o.failAt = f;
    else o.failAt = dst;
    o.force = true;
  }
  return (async () => {
    if (n.dns && n.dns.via === 'dns') { await t.go(src, 'dns', {c: 'vi', tag: 'DNS ?'}); await t.go('dns', src, {c: 'vi', tag: 'A ' + ip}); }
    const ok = await t.flow(route, o);
    if (ok) await t.flow(route.slice().reverse(), {c: 'ok', tag: 'reply'});
  })();
}
function pcieScan(t) {
  const ids = Object.keys(t.nodes).filter(k => /^(cpu|rp:|rt:|sw:|dev:)/.test(k));
  return t.scan(ids, 'cu', 90);
}

    Lk('riser1', 'gpu0', 'pcie'), Lk('riser1', 'gpu1', 'pcie'), Lk('cpu1', 'nic0', 'pcie', {via: [[460, 160], [640, 207]]}),

    ...[1, 2, 3].map(i => Lk('FAN' + i, 'cpu1', 'air')), ...[4, 5, 6].map(i => Lk('FAN' + i, 'cpu2', 'air'))
  ];
  const info = {
    cpu1: '<b>CPU</b> runs instructions. Servers often have two ("dual socket"). Each CPU <b>owns its own memory slots and PCIe slots</b> — if CPU 1 has a problem, the parts wired to it disappear. Common problems: bent socket pins, poor seating, overheating.',
    cpu2: '<b>CPU 2</b> owns DIMMs E1–H2, Riser 2 (GPU 2, GPU 3) and Bays 2–3. Common problems: bent socket pins, poor seating, overheating.',
    mem1: '<b>DIMMs</b> are memory modules in labeled slots (A1, B1…). Common problems: bad module, poor seating, wrong slot. Servers use ECC RDIMMs (Module 5).', mem2: '<b>DIMMs</b> on CPU 2. Wrong placement can lower performance or disable a DIMM.',
    riser1: '<b>Riser</b>: holds cards sideways in thin servers. Common problems: riser not seated, loose riser cable, slot disabled. This one also carries a <b>retimer</b>.', riser2: '<b>Riser 2</b> carries lanes from CPU 2 to two GPU slots.',
    gpu0: '<b>GPU</b>: accelerator for AI and compute; needs extra power cables. Common problems: not seated, missing power cable, overheating.', gpu1: '<b>GPU</b>: needs its auxiliary power cable and good airflow.', gpu2: '<b>GPU</b> on CPU 2.', gpu3: '<b>GPU</b> on CPU 2.',
    nic0: '<b>NIC</b>: network card (copper RJ45, fiber, or DAC cables). Common problems: no link, bad cable or transceiver, driver.',
    bp: '<b>Backplane</b>: drives plug into it; it connects the front bays to the motherboard. Common problems: failing drive, bad connector or cable.',
    bay0: '<b>Storage bay</b> with an NVMe drive (U.2/U.3 through the backplane).', bay1: 'NVMe drive bay.', bay2: 'NVMe drive bay.', bay3: 'NVMe drive bay.',
    psu1: '<b>PSU</b>: power supply, usually redundant (two of them). If one fails the other carries the load. Common problems: failed PSU, bad cord or outlet.', psu2: '<b>PSU 2</b>: the redundant partner of PSU 1.',

  return {
    title: 'Inside a 2U server — top view, air flows left to right', w: 880, h: 410, nodes, links, info,
    texts: [{x: 18, y: 400, text: 'FRONT ▸ air in', cls: 'acc'}, {x: 862, y: 400, text: 'REAR ▸ air out', anchor: 'end', cls: 'acc'}],
    intro: 'Tap any part to learn what it does and how it fails. Press Play to watch air and power move.',
    scenes: [
      {name: 'Airflow', run: async t => {
        t.say('Fans pull cool air in at the front, across the drives, over the CPUs and memory, out through the cards and PSUs at the back.', 'AIR');
        for (let k = 0; k < 2; k++) await Promise.all([1, 2, 3, 4, 5, 6].map(i => t.flow(['FAN' + i, i <= 3 ? 'cpu1' : 'cpu2', i <= 3 ? 'riser1' : 'riser2', i <= 3 ? 'gpu0' : 'gpu3'], {c: 'acc', pulse: false, force: true})));

    sync: (t, r) => {
      if (!r) return;
      Object.entries(r.fans || {}).forEach(([k, v]) => { if (t.nodes[k]) { t.set(k, v < 800 ? 'bad' : 'ok'); t.fan(k, v > 12000); } });
      if (r.flags.baffleMissing) t.set('baffle', 'missing', 'MISSING');
      if (r.temps && r.temps.cpu2 >= 85) t.set('cpu2', 'warn', r.temps.cpu2 + '°C');
      if (r.temps && r.temps.cpu1 >= 85) t.set('cpu1', 'warn', r.temps.cpu1 + '°C');
      if (r.bmc) { if (r.bmc.psu.ps1 !== 'ok') t.set('psu1', 'bad', 'FAILED'); if (r.bmc.psu.ps2 !== 'ok') t.set('psu2', 'bad', 'FAILED'); }
      Object.values(r.devs || {}).forEach(d => { if (d.kind === 'gpu' && t.nodes[d.id]) { const gi = r.gpuInfo[d.id]; if (!devVisible(r, d) || gi.fell) t.set(d.id, 'missing', 'not detected'); else if (gi.temp >= 85) t.set(d.id, 'warn', gi.temp + '°C'); } });
    },
    anim: async (t, line, res, r) => {
      if (/ipmitool.*sensor|sensors/.test(line)) { t.say('Reading sensors: the BMC polls every fan, temperature and PSU.', 'SENSORS'); await t.scan(['FAN1', 'FAN2', 'FAN3', 'FAN4', 'FAN5', 'FAN6', 'cpu1', 'cpu2', 'psu1', 'psu2'], 'vi', 110); }
      else if (/sel/.test(line)) { t.say('Reading the System Event Log kept by the BMC.', 'SEL'); await t.pulse('bmc', 'vi'); }
      else if (/fru/.test(line)) { await t.pulse('bmc', 'vi'); }
      else if (/lspci/.test(line)) { await t.scan(['cpu1', 'riser1', 'gpu0', 'gpu1', 'nic0', 'cpu2', 'riser2', 'gpu2', 'gpu3', 'bp'], 'cu', 100); }
      else if (/free|dmidecode/.test(line)) { await t.scan(['mem1', 'mem2'], 'cu'); }
      else if (/lscpu/.test(line)) { await t.scan(['cpu1', 'cpu2'], 'cu'); }
    }
  };
}

/* ---------------------------------------------------------------------
   2. Linux log pipeline (Module 2)

    scenes: [
      {name: 'A hardware error', run: async t => {

        t.say('…writes it into the ring buffer (dmesg) and hands it to the journal.', '2');
        await Promise.all([t.flow(['kernel', 'ring'], {c: 'bad'}), t.flow(['kernel', 'journald', 'journal'], {c: 'bad'})]);
        await t.flow(['journald', 'files'], {c: 'bad'});
        t.say('You read it with dmesg (ring buffer) or journalctl, and filter with grep.', '3');
        await Promise.all([t.flow(['ring', 'you'], {c: 'bad', tag: 'dmesg'}), t.flow(['files', 'grep', 'you'], {c: 'bad', tag: 'grep nvme'})]);
        await t.wait(800);
      }},
      {name: 'Reboot wipes dmesg', bad: true, run: async t => {
        t.say('The server crashes. The ring buffer lived in RAM…', '1'); await t.flow(['hw', 'kernel', 'ring'], {c: 'bad', tag: 'panic'});
        t.set('ring', 'missing', 'EMPTY after reboot'); t.say('After the reboot, dmesg is empty of the old messages: the evidence is gone.', '2'); await t.wait(1600);
        t.say('But the journal on disk kept the old boot. journalctl -b -1 reads the previous boot. Save evidence first next time: dmesg > before_reboot.txt', '3');
        await t.flow(['journal', 'you'], {c: 'ok', tag: 'journalctl -b -1'}); await t.flow(['you', 'save'], {c: 'ok', tag: '>'}); await t.wait(1000);
      }},
      {name: 'grep filters', run: async t => {
        t.say('A log has thousands of lines. grep keeps only the lines with your word.', 'GREP');
        for (let i = 0; i < 4; i++) t.flow(['files', 'grep'], {c: 'ink', pulse: false});
        await t.wait(900);
        await t.flow(['grep', 'you'], {c: 'warn', tag: 'grep -in timeout'});
        t.say('-i ignore case · -n line numbers · -c count · -r every file in a folder · -v lines that do NOT match · -C 3 context', 'GREP'); await t.wait(1800);
      }}
    ],
    anim: async (t, line, res, r) => {

      else if (/journalctl.*-b -1/.test(line)) { t.say(r.os.persistent ? 'journalctl -b -1 reads the PREVIOUS boot from the journal on disk.' : 'No persistent journal: there is no previous boot to read.', 'JOURNAL'); await t.flow(['journal', 'you'], {c: r.os.persistent ? 'ok' : 'bad', tag: '-b -1', force: true, failAt: r.os.persistent ? null : 'you'}); }
      else if (/journalctl/.test(line)) { await t.flow(['journald', 'journal', 'you'], {c: 'acc', tag: 'journalctl'}); }
      else if (/grep/.test(line)) { await t.flow(['files', 'grep', 'you'], {c: 'warn', tag: 'grep'}); }
      else if (/(cat|tail|head|less).*\/var\/log/.test(line)) { await t.flow(['files', 'grep', 'you'], {c: 'acc', tag: line.split(' ')[0]}); }

}

/* ---------------------------------------------------------------------
   3. Four layers (Module 3)
   --------------------------------------------------------------------- */
function topoLayers(rig) {
  const L4 = [['phys', 'Physical', 'seated · powered · BIOS/BMC see it'], ['bus', 'Bus', 'lspci · lsblk · nvme list'], ['drv', 'Driver', 'lspci -k · dmesg'], ['fn', 'Function', 'ip a · nvidia-smi · test']];
  const cols = [['nic', rig.flags.layerNic === 'nic1' ? 'New NIC a3:00.0' : 'NIC 3b:00.0'], ['gpu', 'GPU 19:00.0'], ['nvme', 'NVMe 5e:00.0']];
  const nodes = []; const links = [];
  L4.forEach(([k, lab, sub], i) => nodes.push(N('L' + k, 100, 330 - i * 84, `${i + 1}. ${lab}`, sub, 'box', 170, 50, {tag: 'LAYER'})));
  cols.forEach(([c, lab], j) => {
    L4.forEach(([k], i) => { nodes.push(N(`${c}-${k}`, 320 + j * 200, 330 - i * 84, lab.replace(/ [0-9a-f]+:00\.0$/, ''), ['installed', 'on the bus', 'driver bound', 'working'][i], 'box', 150, 46, {center: true})); if (i) links.push(Lk(`${c}-${L4[i - 1][0]}`, `${c}-${k}`, 'flow')); });
  });
  return {
    title: 'The four layers of "is it working?"', w: 860, h: 380, nodes, links,
    info: {Lphys: '<b>1. Physical</b>: installed, seated, powered, seen by the BIOS/BMC? Check by looking, LEDs, BIOS or BMC inventory.', Lbus: '<b>2. Bus</b>: does the OS see it on the bus? <code>lspci</code>, <code>lsblk</code>, <code>nvme list</code>.', Ldrv: '<b>3. Driver</b>: is a driver attached? <code>lspci -k</code> ("Kernel driver in use"), <code>dmesg</code>.', Lfn: '<b>4. Function</b>: is it configured and working? <code>ip a</code>, <code>nvidia-smi</code>, a functional test.'},
    scenes: [
      {name: 'Healthy climb', run: async t => { for (const [c] of cols) { for (const k of ['phys', 'bus', 'drv', 'fn']) { t.set(`${c}-${k}`, 'good'); await t.pulse(`${c}-${k}`, 'ok'); await t.wait(220); } } t.say('Each device passes all four layers, bottom to top.', 'OK'); await t.wait(1500); }},
      {name: 'NIC: no driver', bad: true, run: async t => {
        t.say('The NIC shows in lspci (bus layer passes)…', 'NIC'); t.set('nic-phys', 'good'); t.set('nic-bus', 'good'); await t.pulse('nic-bus', 'ok'); await t.wait(900);
        t.set('nic-drv', 'bad', 'no "Kernel driver in use"'); t.set('nic-fn', 'off'); t.say('…but lspci -k shows no driver in use. The hardware is fine; the problem is the driver. Do not replace the card.', 'NIC'); await t.pulse('nic-drv', 'bad'); await t.wait(2200);
      }},
      {name: 'GPU: bus ok, no nvidia-smi', bad: true, run: async t => {
        ['phys', 'bus'].forEach(k => t.set('gpu-' + k, 'good')); t.say('A GPU shows up in lspci but not in nvidia-smi.', 'GPU'); await t.wait(1000);
        t.set('gpu-drv', 'bad', 'driver/firmware'); t.set('gpu-fn', 'off'); t.say('So it is on the bus; the failure is at the driver layer (or firmware). Check lspci -k and dmesg.', 'GPU'); await t.pulse('gpu-drv', 'bad'); await t.wait(2000);
      }},
      {name: 'Not on the bus', bad: true, run: async t => {
        t.set('nvme-phys', 'bad', 'not seen'); ['bus', 'drv', 'fn'].forEach(k => t.set('nvme-' + k, 'off'));
        t.say('If BIOS/BMC inventory does not see it either, the problem is physical or firmware: seating, cables, power, slot settings.', 'NVMe'); await t.pulse('nvme-phys', 'bad'); await t.wait(2200);
      }}
    ],
    sync: (t, r) => {
      if (!r || r.vm) return;
      const pick = {nic: r.flags.layerNic || 'nic0', gpu: 'gpu0', nvme: 'nvme0'};
      Object.entries(pick).forEach(([c, id]) => {
        const d = r.devs[id]; if (!d) return;
        const vis = devVisible(r, d);
        const fnOk = c === 'nic' ? r.ifaces.some(i => i.dev === id && ifaceExists(r, i) && i.admin && i.carrier && i.ip) : c === 'gpu' ? gpuList(r).includes(d) : vis && d.drv;
        t.set(`${c}-phys`, d.present ? 'good' : 'bad');
        t.set(`${c}-bus`, vis ? 'good' : (d.present ? 'bad' : 'off'));
        t.set(`${c}-drv`, vis && d.drv ? 'good' : (vis ? 'bad' : 'off'), vis && !d.drv ? 'no driver in use' : null);
        t.set(`${c}-fn`, vis && d.drv && fnOk ? 'good' : (vis && d.drv ? 'bad' : 'off'));
      });
    },
    anim: async (t, line) => {
      if (/lspci -k|lspci.*-k/.test(line)) { t.say('lspci -k checks layer 3: is a driver attached?', 'L3'); await t.scan(['nic-drv', 'gpu-drv', 'nvme-drv'], 'cu', 200); }
      else if (/lspci|lsblk|nvme list/.test(line)) { t.say('Checking layer 2: is it on the bus?', 'L2'); await t.scan(['nic-bus', 'gpu-bus', 'nvme-bus'], 'cu', 200); }
      else if (/ip a|ip link|ethtool/.test(line)) { t.say('ip a checks layer 4 for the NIC: an interface, a link, an address.', 'L4'); await t.pulse('nic-fn', 'acc'); }
      else if (/nvidia-smi/.test(line)) { t.say('nvidia-smi checks layer 4 for the GPU: the NVIDIA driver can see and use it.', 'L4'); await t.pulse('gpu-fn', 'acc'); }
      else if (/dmesg/.test(line)) { await t.scan(['nic-drv', 'gpu-drv', 'nvme-drv'], 'warn', 150); }
    }
  };
}

/* ---------------------------------------------------------------------
   4. PCIe tree built from the rig (Modules 4, 6, 11 and many missions)
   --------------------------------------------------------------------- */
function topoPcie(rig, o = {}) {
  const nodes = []; const links = []; const groups = []; const cpuOf = {}; const branches = {};
  let row = 0; const RY = o.rowH || 50; const Y0 = 46; let curCpu = 1;
  if (o.skipVga == null) o.skipVga = true;
  const X = {cpu: 70, rp: 220, rt: 370, sw: 520, dev: 720};
  const devNode = (d, y) => {
    const tagMap = {gpu: 'GPU', nic: 'NIC', nvme: 'NVMe', vga: 'VGA'};
    const where = d.slot ? 'Slot ' + d.slot : d.bay != null ? 'Bay ' + d.bay : 'onboard';
    nodes.push(N('dev:' + d.id, X.dev, y, d.label || d.id, `${d.addr} · ${where}`, d.kind, 190, 40, {tag: tagMap[d.kind]}));
    cpuOf['dev:' + d.id] = 'cpu' + curCpu;
  };
  rig.roots.forEach(root => {
    const startRow = row; curCpu = root.cpu;
    const ports = root.ports.filter(p => !(o.skipVga && p.kid && p.kid.dev && p.kid.dev.kind === 'vga') && !(o.only && !o.only(p)) && (p.kid || o.newCard));
    const rpYs = [];
    ports.forEach(p => {
      const kids = p.kid && p.kid.sw ? p.kid.ports : [p];
      const y0 = Y0 + row * RY;
      const ys = kids.map((q, k) => Y0 + (row + k) * RY);
      const yMid = (ys[0] + ys[ys.length - 1]) / 2;
      const rpId = 'rp:' + p.id;
      nodes.push(N(rpId, X.rp, yMid, `Port ${root.dom.slice(5)}:${p.dn}`, p.bus ? `bus [${p.bus}]` : '', 'port', 120, 36));
      rpYs.push([rpId, yMid]);
      let up = rpId;
      if (p.riser || p.retimer) {
        nodes.push(N('rt:' + (p.retimer || p.riser), X.rt, yMid, p.riser ? (p.riser === 'riser1' ? 'Riser 1' : 'Riser 2') : 'Retimer', 'retimer · not in lspci', 'retimer', 140, 40));
        links.push(Lk(up, 'rt:' + (p.retimer || p.riser), 'pcie', {w: 4}));
        up = 'rt:' + (p.retimer || p.riser);
      }
      if (p.kid && p.kid.sw) {
        const swId = 'sw:' + p.kid.sw;
        nodes.push(N(swId, X.sw, yMid, 'PCIe switch', `${p.kid.addr} [${p.kid.bus}]`, 'switch', 140, 40, {tag: 'SW'}));
        links.push(Lk(up, swId, 'pcie', {w: 4}));
        p.kid.ports.forEach((q, k) => { if (q.kid && q.kid.dev) { devNode(q.kid.dev, ys[k]); links.push(Lk(swId, 'dev:' + q.kid.dev.id, 'pcie', {w: 4, via: [[X.sw + 90, ys[k]]]})); } });
        branches[up] = [swId, ...p.kid.ports.filter(q => q.kid && q.kid.dev).map(q => 'dev:' + q.kid.dev.id)];
      } else if (p.kid && p.kid.dev) {
        devNode(p.kid.dev, yMid); links.push(Lk(up, 'dev:' + p.kid.dev.id, 'pcie', {w: p.kid.dev.cap && p.kid.dev.cap.w >= 16 ? 4 : 2.4}));
      } else if (o.newCard && !p.kid) {
        nodes.push(N('slot:' + p.id, X.dev, yMid, o.newCardLabel || 'Slot 4 (new card)', 'expected: 100G NIC', 'nic', 190, 40, {tag: 'NIC'}));
        links.push(Lk(up, 'slot:' + p.id, 'pcie', {w: 4}));
      }
      row += kids.length;
    });
    const cy = (Y0 + startRow * RY + Y0 + (row - 1) * RY) / 2;
    nodes.push(N('cpu' + root.cpu, X.cpu, cy, 'CPU ' + root.cpu, `root complex [${root.dom}]`, 'cpu', 132, 56, {tag: 'ROOT'}));
    rpYs.forEach(([id, y]) => links.push(Lk('cpu' + root.cpu, id, 'pcie', {w: 3, via: [[X.cpu + 70, y]]})));
    groups.push({x: 8, y: Y0 + startRow * RY - RY / 2 + 4, w: 880, h: (row - startRow) * RY - 8, label: `CPU ${root.cpu} owns these slots`});
    row += 0.4;
  });
  const H = Y0 + row * RY;
  return {
    title: o.title || 'PCIe topology — the expected diagram, coloured by what Linux actually found', w: 900, h: Math.max(260, H), nodes, links, groups, cpuOf, branches,
    intro: o.intro || 'Solid = found by Linux. Dashed red = expected but missing. Amber link = downtrained or throwing errors. Tap a part for details.',
    info: Object.assign({}, ...Object.values(rig.devs).map(d => ({['dev:' + d.id]: `<b>${d.label || d.id}</b> at <code>${d.addr}</code>${d.slot ? ' in Slot ' + d.slot : ''}${d.bay != null ? ' in Bay ' + d.bay : ''}. Capable of <b>${d.cap ? lnkTxt(d.cap) : '—'}</b>. In <code>lspci -tv</code> it sits under the port shown to its left.`})), {cpu1: 'The <b>root complex</b> is inside the CPU, with several root ports. Every slot belongs to one CPU.', cpu2: 'CPU 2\'s root complex. If CPU 2 has a problem, everything in this box disappears.', 'rt:rt1': 'A <b>retimer</b> fully recovers the data and re-transmits a clean signal, resetting the loss budget. It takes part in link training and is normally <b>invisible to the OS</b> (not in lspci).', 'rt:rt2': 'Retimer on riser 2. A failed retimer can make every device behind it disappear, downtrain links, or cause a stream of corrected errors.', 'sw:sw1': 'A <b>PCIe switch</b> fans one upstream link out to several devices. Devices behind it share its single upstream link (oversubscription). If every device under one switch is missing, suspect the switch or its upstream link.', 'sw:sw2': 'PCIe switch on CPU 2.'}),
    scenes: o.scenes || [
      {name: 'Link training', run: async t => {
        t.say('At power on, every link negotiates ("trains") its speed and width, from the CPU outward.', 'TRAIN');
        const devs = Object.keys(t.nodes).filter(k => k.startsWith('dev:'));
        await Promise.all(devs.map((d, i) => t.wait(i * 260).then(() => t.go(t.spec.cpuOf[d], d, {c: 'cu', tag: 'train'}))));
        t.say('lspci -vv: LnkCap = what the device can do. LnkSta = what it actually got.', 'TRAIN'); await t.wait(1500);
      }},
      {name: 'Downtrained link', bad: true, run: async t => {
        const g = Object.keys(t.nodes).find(k => k.startsWith('dev:gpu')); if (!g) return;
        const sw = t.route(t.spec.cpuOf[g], g); const up = sw[sw.length - 2];
        t.setLink(up, g, 'slow', 1.4); t.sub(g, 'LnkSta Gen5 x4 (cap x16)');
        t.say('This GPU trained at x4 instead of x16: it works, but slower. Suspect poor seating, a dirty connector, a bad riser, cable or retimer, or a BIOS speed setting.', 'DOWN');
        await t.go(t.spec.cpuOf[g], g, {c: 'warn', tag: 'x4'}); await t.wait(2000);
      }},
      {name: 'Missing branch', bad: true, run: async t => {
        const rt = Object.keys(t.nodes).find(k => k.startsWith('rt:')); if (!rt) return;
        t.set(rt, 'bad', 'riser not seated');
        const behind = t.spec.branches[rt] || [];
        behind.forEach(k => t.set(k, 'missing'));
        t.say('A whole branch is missing: switch AND both GPUs. When several devices on one path vanish, suspect the shared upstream part — riser, cable, switch, retimer, root port, or a BIOS slot setting — not each device.', 'BRANCH');
        for (const k of behind.filter(x => x.startsWith('dev:'))) await t.go(t.spec.cpuOf[k], k, {c: 'cu', tag: 'scan'});
        await t.wait(1800);
      }}
    ],
    sync: (t, r) => {
      if (!r) return;
      r.cpus.forEach(c => { if (!c.ok && t.nodes['cpu' + c.id]) t.set('cpu' + c.id, 'bad', 'not detected'); });
      r.roots.forEach(root => root.ports.forEach(p => {
        const cpuOk = r.cpus.find(c => c.id === root.cpu).ok;
        if (p.present === false && t.nodes['rp:' + p.id]) t.set('rp:' + p.id, 'off', 'disabled / hidden');
        else if (!cpuOk && t.nodes['rp:' + p.id]) t.set('rp:' + p.id, 'missing');
        const rid = 'rt:' + (p.retimer || p.riser);
        if (t.nodes[rid]) {
          const bad = (p.riser && r.risers[p.riser] && !r.risers[p.riser].ok) || (p.retimer && r.retimers[p.retimer] && !r.retimers[p.retimer].ok);
          if (bad) t.set(rid, 'bad', r.risers[p.riser] && !r.risers[p.riser].ok ? 'riser not seated' : 'retimer fault');
          else if (!cpuOk) t.set(rid, 'missing');
        }
        if (p.kid && p.kid.sw && t.nodes['sw:' + p.kid.sw] && (!cpuOk || p.kid.present === false || portLinked(r, p) !== true)) t.set('sw:' + p.kid.sw, 'missing', 'not found');
        if (p.kid === null && t.nodes['slot:' + p.id]) t.set('slot:' + p.id, 'missing', 'not in lspci');
      }));
      Object.values(r.devs).forEach(d => {
        const id = 'dev:' + d.id; if (!t.nodes[id]) return;
        const vis = devVisible(r, d) && !(r.gpuInfo[d.id] && r.gpuInfo[d.id].fell);
        const loc = findDev(r, d.id);
        const upId = t.links.find(l => l.b === id) ? t.links.find(l => l.b === id).a : null;
        if (!vis) { t.set(id, 'missing', `${d.addr} · NOT FOUND`); if (upId) t.setLink(upId, id, 'off'); return; }
        if (d.kind !== 'vga' && !d.drv) t.set(id, 'warn', `${d.addr} · no driver`);
        if (d.cap && d.sta && (d.sta.gt < d.cap.gt || d.sta.w < d.cap.w)) { if (upId) t.setLink(upId, id, 'slow', 1.6); t.sub(id, `${lnkTxt(d.sta)} (cap ${lnkTxt(d.cap)})`); t.set(id, 'warn'); }
        else if (d.aer > 0 && upId) t.setLink(upId, id, 'err');
        const gi = r.gpuInfo[d.id]; if (gi && gi.temp >= 85) { t.set(id, 'warn', `${d.addr} · ${gi.temp}°C`); }
        const ni = r.nvmeInfo[d.id]; if (ni && ni.temp >= 70) t.set(id, 'warn', `${d.addr} · ${ni.temp}°C`);
      });
    },

      else if (/lspci.*-s\s+(\S+)/.test(line) || /lspci.*vv/.test(line)) {

        if (d && t.nodes['dev:' + d.id]) { t.say(`Reading link status of ${d.label}: LnkCap ${lnkTxt(d.cap)}, LnkSta ${lnkTxt(d.sta)}.`, 'LINK'); await t.go(t.spec.cpuOf['dev:' + d.id], 'dev:' + d.id, {c: (d.sta.w < d.cap.w || d.sta.gt < d.cap.gt) ? 'warn' : 'cu', tag: lnkTxt(d.sta)}); }

      else if (/nvme|lsblk|smartctl/.test(line)) { const ns = Object.keys(t.nodes).filter(k => k.startsWith('dev:nvme')); await Promise.all(ns.map(g => t.go(t.spec.cpuOf[g], g, {c: 'acc'}))); }
      else if (/dmesg|journalctl/.test(line)) { const errs = Object.values(r.devs).filter(d => d.aer > 0 || (d.cap && d.sta && d.sta.w < d.cap.w)); for (const d of errs) if (t.nodes['dev:' + d.id]) t.pulse('dev:' + d.id, 'warn'); }
      else if (/ip a|ethtool|ip link/.test(line)) { const ns = Object.keys(t.nodes).filter(k => k.startsWith('dev:nic')); for (const k of ns) t.pulse(k, 'acc'); }
    }
  };
}

    scenes: [
      {name: 'Reads and writes', run: async t => { t.say('The CPU moves data to and from every DIMM on its channels.', 'MEM'); await Promise.all(rig.dimms.slice(0, 16).map(d => t.go('cpu' + d.cpu, 'dimm:' + d.loc, {c: 'cu', pulse: false}))); await t.wait(600); }},
      {name: 'ECC fixes a flipped bit', run: async t => {
        t.say('A read from B2 comes back with one flipped bit…', 'ECC'); await t.go('dimm:B2', 'cpu1', {c: 'warn', tag: '1 bit flipped'});
        t.set('dimm:B2', 'warn', 'CE +1'); t.say('ECC check bits find it and correct it automatically. The server keeps running and logs a correctable error.', 'ECC'); await t.go('cpu1', 'bmc', {c: 'vi', tag: 'SEL: Correctable ECC'});
        for (let k = 0; k < 3; k++) { await t.go('dimm:B2', 'cpu1', {c: 'warn', tag: 'CE'}); }
        t.set('dimm:B2', 'bad', 'CE limit reached'); t.say('More and more correctable errors on one DIMM = early warning. Replace it before it causes an outage.', 'ECC'); await t.wait(1600);
      }},
      {name: 'Two bits: uncorrectable', bad: true, run: async t => {
        t.say('A double-bit error: ECC detects it but cannot fix it.', 'UE'); await t.go('dimm:D1', 'cpu1', {c: 'bad', tag: '2 bits flipped'});
        t.set('dimm:D1', 'bad', 'UNCORRECTABLE'); t.set('cpu1', 'bad', 'machine check'); t.say('The server usually stops or crashes rather than use bad data. That is on purpose: silent corruption is worse.', 'UE'); await t.go('cpu1', 'bmc', {c: 'bad', tag: 'SEL: Uncorrectable ECC'}); await t.wait(1800);
      }}
    ],
    sync: (t, r) => {

      });
      r.cpus.forEach(c => { if (!c.ok) t.set('cpu' + c.id, 'bad', 'not detected'); });

      else if (/free/.test(line)) { await Promise.all(r.dimms.filter(d => d.seated).map(d => t.go('cpu' + d.cpu, 'dimm:' + d.loc, {c: 'acc', pulse: false}))); }
      else if (/sel|ras-mc-ctl|edac/.test(line)) { const bad = r.dimms.filter(d => d.ce || d.ue); for (const d of bad) await t.go('dimm:' + d.loc, 'bmc', {c: 'warn', tag: (d.ue ? 'UE ' : 'CE ') + (d.ue || d.ce)}); if (!bad.length) await t.pulse('bmc', 'ok'); }
      else if (/stress-ng|memtest/.test(line)) { t.say('Stress test: hammering every DIMM to provoke errors.', 'TEST'); for (let k = 0; k < 2; k++) await Promise.all(r.dimms.filter(d => d.seated).map(d => t.go('cpu' + d.cpu, 'dimm:' + d.loc, {c: 'cu', pulse: false}))); }
    }
  };
}

  });
  return {
    title: 'NVMe storage: drives connect over PCIe through cables and a backplane', w: 880, h: 400, nodes, links,
    info: Object.assign({bp: 'The <b>backplane</b> connects front bays to the motherboard. A worn connector or bad cable makes a drive drop out.', bmc: 'Check the BMC event log for drive or PCIe events at the same time as the drop.'}, ...nv.map(d => ({['dev:' + d.id]: `<b>Bay ${d.bay}</b>: NVMe drive at <code>${d.addr}</code>. NVMe connects over PCIe, so everything about links, LnkSta and AER applies.`, ['cab' + d.bay]: 'PCIe cable (MCIO/SlimSAS) from the CPU root port to the backplane. Loose, pinched, or in the wrong port is a very common assembly error.'}))),
    scenes: [
      {name: 'I/O over PCIe', run: async t => { t.say('Every read and write travels CPU → cable → backplane → drive, over PCIe lanes.', 'IO'); await Promise.all(nv.map(d => t.go('cpu' + d.cpu, 'dev:' + d.id, {c: 'cu', pulse: false}))); await t.wait(500); }},
      {name: 'Drive drops out', bad: true, run: async t => {
        const d = nv[3] || nv[0];
        t.say('Under load, Bay ' + d.bay + ' stops answering: "I/O timeout, aborting" → "controller is down; will reset" → "Removing after probe failure".', 'DROP');
        await t.go('cpu' + d.cpu, 'dev:' + d.id, {c: 'warn', tag: 'I/O'}); t.setLink('cab' + d.bay, 'bp', 'err'); await t.go('cpu' + d.cpu, 'dev:' + d.id, {c: 'bad', tag: 'timeout', failAt: 'dev:' + d.id});
        t.set('dev:' + d.id, 'missing', 'removed'); await t.go('cpu' + d.cpu, 'bmc', {c: 'bad', tag: 'SEL: drive fault'});
        t.say('A reboot resets the link, so the drive comes back — but the cause remains. Capture evidence and isolate: move the drive to another bay.', 'DROP'); await t.wait(2000);
      }}
    ],
    sync: (t, r) => {
      if (!r) return;
      nv.forEach(d => {
        const id = 'dev:' + d.id; const n = r.nvmeInfo[d.id];
        if (!devVisible(r, d) || d.gone) { t.set(id, 'missing', 'not in nvme list'); t.setLink('bp', id, 'off'); }
        else if (d.sta && d.cap && (d.sta.w < d.cap.w || d.sta.gt < d.cap.gt)) { t.set(id, 'warn', `${lnkTxt(d.sta)} (cap ${lnkTxt(d.cap)})`); t.setLink('bp', id, 'slow', 1.4); }
        else if (n && n.temp >= 70) t.set(id, 'warn', `${n.temp}°C — hot`);
        if (d.aer > 0) t.setLink('cab' + d.bay, 'bp', 'err');
        if (r.flags.cableBad === d.bay) t.set('cab' + d.bay, 'warn', 'pinched cable');
        if (r.flags.bayMoved && r.flags.bayMoved[d.id] != null) t.label(id, `Bay ${r.flags.bayMoved[d.id]} · ${n.ctrl}`);
      });
    },
    anim: async (t, line, res, r) => {
      if (/fio/.test(line)) { t.say('fio puts heavy load on the drives.', 'LOAD'); for (let k = 0; k < 2; k++) await Promise.all(nv.map(d => t.go('cpu' + d.cpu, 'dev:' + d.id, {c: 'cu', pulse: false}))); }
      else if (/nvme|lsblk|smartctl|sensors/.test(line)) { await Promise.all(nv.map(d => t.go('cpu' + d.cpu, 'dev:' + d.id, {c: 'acc'}))); }
      else if (/lspci/.test(line)) { await t.scan(['cpu1', 'cpu2', ...nv.map(d => 'cab' + d.bay), 'bp', ...nv.map(d => 'dev:' + d.id)], 'cu', 90); }
      else if (/sel/.test(line)) { await t.pulse('bmc', 'vi'); }
      else if (/dmesg|journalctl/.test(line)) { nv.filter(d => d.gone || d.aer).forEach(d => t.pulse('dev:' + d.id, 'warn')); }
    }
  };
}

  }

    groups: [{x: 6, y: 22, w: 740, h: 300, label: 'subnet 10.20.5.0/24'}],
    info: {srv: '<b>The server</b>: its NIC needs a link, an IP address, a subnet mask, a gateway and a DNS server.', sw: '<b>Switch port</b>: link lights, VLAN, MTU. A wrong VLAN means link is up but nothing answers (ARP fails).', gw: '<b>Default gateway</b>: the router used to reach other networks. <code>ip route</code> shows it.', dhcp: '<b>DHCP</b> gives a device its settings in four steps: Discover, Offer, Request, Acknowledge (DORA).', dns: '<b>DNS</b> translates a name such as fileserver01 into an IP address. Linux checks <code>/etc/hosts</code> first, then the DNS server in <code>/etc/resolv.conf</code>.', db01: 'A server on another subnet: traffic to it must go through the gateway.', laptop: 'Your laptop on the same subnet.', bmc: 'The BMC on its own management network.', msw: 'Management switch.'},
    scenes: [
      {name: 'DHCP (DORA)', run: async t => {
