  topo: r => topoMemory(r), panel: lab => travelerPanel(lab),
  chips: ['sudo ipmitool fru print', 'sudo ipmitool mc info', 'cat notes.txt', 'sudo dmidecode -t memory | grep -A8 DIMM_C1', 'sudo ipmitool sel elist'],
  tasks: [{t: 'Unit serial (BMC FRU)', cmd: /fru/}, {t: 'Firmware versions', cmd: /mc info/}, {t: 'Old and new DIMM serials', cmd: /dmidecode|notes/}, {t: 'Fill every field of the repair record correctly', when: r => r.flags.trv && Object.values(r.flags.trv).every(Boolean)}],
  hint: ['The course list: unit serial, symptom, steps and results, parts changed (with serials), firmware versions, root cause, fix, verification.', 'Why others care: traceability, patterns across units and batches, faster future repairs and shift handoffs, RMA and warranty claims, quality and audit.'],
  answer: `<p><b>Document:</b> the <b>unit serial</b>; the <b>symptom</b>; the <b>steps you took and their results</b>; <b>parts changed with serial numbers</b> (old and new); <b>firmware versions</b>; the <b>root cause</b>; the <b>fix</b>; and the <b>verification</b> (what test passed).</p><p><b>Why it matters to other people:</b></p><ul><li><b>Traceability</b> — anyone can see what was wrong and what was replaced, by serial number.</li><li><b>Patterns</b> — engineering and quality can spot the same failure across units and batches.</li><li><b>Future repairs and shift handoffs</b> — the next technician starts where you stopped instead of repeating work.</li><li><b>RMA and warranty</b> — suppliers need the serial, symptom and evidence for claims and failure analysis.</li><li><b>Quality and audit</b> requirements are met.</li></ul>`,
  keys: [K('unit serial', 'serial'), K('symptom', 'symptom'), K('steps and results', 'step|result'), K('parts changed', 'part'), K('firmware versions', 'firmware'), K('root cause', 'root cause|cause'), K('fix', 'fix'), K('verification', 'verif|test'), K('traceability', 'trace'), K('patterns / batches', 'pattern|batch'), K('handoff / future repairs', 'handoff|shift|future|next'), K('RMA / warranty', 'RMA|warrant'), K('quality / audit', 'audit|quality')]
});

M({n: 15, set: 'A', topic: 'Powers on but no OS', reread: ['m9'], start: 'laptop',
  q: 'A server’s fans spin and its health LED is green, but you never get a login prompt. Describe your troubleshooting stage by stage, and where you would look at each stage.',
  brief: '<p>Fans spin, LED green, no login prompt and no network. Watch the boot through SOL, find the stage, ask what changed (a BIOS update ran last night), fix it in the BIOS screen and verify.</p>',
  rig: () => { const r = baseRig({upDays: 0}); r.flags.vmd = true; r.hooks.onBoot = rr => { rr.boot.fail = rr.flags.vmd ? 'kernel' : null; }; r.hooks.onBoot(r); r.os.state = 'bootfail'; r.bootTail = bootStream(r).map(s => s.line).filter(x => x != null); sel(r, '01:02:11', 'System Firmware Progress #0x0f', 'BIOS update 2.3a → 2.4 completed; settings restored to defaults', null); return r; },
  topo: r => topoBoot(r),
  chips: ['ping -c 2 10.20.5.14', LAPTOP_BMC + ' power status', LAPTOP_BMC + ' sel elist', LAPTOP_BMC + ' sol activate', LAPTOP_BMC + ' power cycle'],
  tasks: [{t: 'Confirm: no network', cmd: /^(ping|ssh)/}, {t: 'Stage 1: power + BMC health', cmd: /ipmitool.*(power status|sensor)/}, {t: 'BMC event log: CPU, memory, PCIe, power errors? What changed?', cmd: /ipmitool.*sel/}, {t: 'Watch the console and note exactly where it stops', cmd: /sol activate/}, {t: 'Check the BIOS setting the update changed', when: r => r.flags.biosSeen}, {t: 'Fix and power cycle', when: r => !r.flags.vmd}, {t: 'Verify: it boots to a login prompt and answers SSH', cmd: /^ssh/, ok: r => r.os.state === 'up'}],
  actions: [{id: 'bios', kind: 'bios', label: 'BIOS Setup › Storage › NVMe mode', do: r => { r.flags.biosSeen = true; return r.flags.vmd ? say('NVMe RAID mode (VMD) ...... ' + L('e', '[Enabled]').slice(2) + '   ← reset to default by the BIOS update', 'The installed OS expects the drives in direct NVMe mode; with VMD on, the kernel has no driver for its root disk.') : 'NVMe RAID mode (VMD) ...... [Disabled]'; }}, {id: 'novmd', kind: 'bios', label: 'BIOS: set NVMe RAID mode (VMD) to Disabled, save', do: r => { r.flags.vmd = false; r.flags.biosSeen = true; return 'Saved. Now power cycle and watch the console.'; }}],
  hint: ['Power/BMC: health, power status, SEL for CPU, memory, PCIe or power errors.', 'Watch the console (virtual console, SOL, monitor) and note exactly where it stops — be patient during memory training.', 'POST stuck → POST code, memory/CPU/PCIe card, reseat. No boot device → BIOS sees drive? boot order, UEFI/Legacy, Secure Boot, cables, RAID controller.', 'GRUB / kernel → read the exact message; boot partition, storage driver, drive. Startup → emergency mode, /etc/fstab, failing disk.', 'Minimum configuration if needed. Ask what changed, check firmware, document.'],
  answer: `<p>Fans and a green LED only prove that power is on. <b>Watch the console</b> (BMC virtual console, SOL, or a monitor) and find which link of the chain breaks:</p><ol><li><b>Power and BMC</b> — look at the BMC: power status, health, sensors, and the <b>SEL</b> for CPU, memory, PCIe or power errors.</li><li><b>POST</b> — on the console: a stuck POST code or memory errors? Be patient: memory training on large servers takes minutes. Look up the code; suspect memory, CPU or a PCIe card; reseat; minimum configuration if needed.</li><li><b>UEFI/BIOS</b> — "No bootable device"? Is the drive seen in BIOS? Boot order, UEFI vs Legacy, Secure Boot, cables, RAID controller.</li><li><b>Bootloader (GRUB)</b> — <code>grub rescue&gt;</code> or file not found: boot partition or drive.</li><li><b>Kernel</b> — kernel panic or "Unable to mount root fs": read the exact message; suspect a storage driver, the boot partition or the drive. (In this lab: a BIOS update reset NVMe mode to VMD, so the kernel could not find its root disk.)</li><li><b>System startup</b> — "Emergency mode": often /etc/fstab or a failing disk; read <code>journalctl -xb</code>.</li></ol><p>Throughout: <b>ask what changed</b>, check firmware versions, change one thing, <b>verify</b> it reaches the login prompt and the network, and <b>document</b>.</p>`,
  keys: [K('watch the console', 'console|SOL|KVM|monitor'), K('BMC / SEL', 'BMC|SEL|event log'), K('POST', 'POST'), K('memory training patience', 'training|patien|minutes'), K('BIOS / boot device', 'BIOS|UEFI|boot device|boot order'), K('GRUB', 'GRUB|bootloader'), K('kernel panic / root fs', 'kernel|root fs|panic'), K('emergency mode / fstab', 'emergency|fstab'), K('minimum config', 'minimum'), K('what changed', 'changed|update'), K('document', 'document')]
});

M({n: 16, set: 'A', topic: 'NIC detected but cannot communicate', reread: ['m11', 'm7'],
  q: 'A network card shows in lspci with its driver loaded, and its interface appears in ip a , but the server cannot reach anything through it. Describe your process in order.',
  brief: '<p>Everything looks present — card, driver, interface, address. Yet nothing answers. Work Playbook C layer by layer. Some layers you cannot fix yourself: the switch belongs to the network team.</p>',
  rig: () => { const r = baseRig(); r.net.ports.ens1f0.vlanOk = false; return r; }, topo: r => topoNetwork(r),
  chips: ['lspci -k | grep -A3 3b:00', 'ip a show ens1f0', 'ethtool ens1f0', 'ip route', 'ping -c 3 10.20.5.1', 'ip neigh', 'ethtool -S ens1f0'],
  tasks: [{t: 'Detected, driver, interface', cmd: /lspci.*-k|ip link/}, {t: 'Link: LOWER_UP / Link detected', cmd: /^ip\s+(a|addr)|ethtool\s+ens1f0$/}, {t: 'IP settings and route', cmd: /^ip\s+(r|route)/}, {t: 'Ping the gateway', cmd: /ping.*10\.20\.5\.1\b/}, {t: 'Local network: did ARP resolve the gateway?', cmd: /ip neigh/}, {t: 'Error counters and driver/firmware', cmd: /ethtool\s+-(S|i)/}, {t: 'Get the switch port fixed and verify', cmd: /ping.*10\.20\.5\.1\b/, ok: r => r.net.ports.ens1f0.vlanOk}],
  actions: [{id: 'net', kind: 'ask', label: 'Ask the network team to check switch port Te1/0/14 (VLAN, shutdown, MTU)', do: r => { r.net.ports.ens1f0.vlanOk = true; return say('Network team: "Te1/0/14 was in VLAN 99 (quarantine) after last week\'s re-cable. Moved to VLAN 20."', 'Re-test from the server.'); }}],
  hint: ['Confirm: in lspci, driver bound (<code>lspci -k</code>), interface in <code>ip link</code>.', 'Link: LOWER_UP vs NO-CARRIER, <code>ethtool</code> Link detected, LEDs on both ends.', 'Interface up? IP settings: none, 169.254, wrong subnet, old interface name in the config.', 'Local network: wrong VLAN on the switch port, ARP failing (<code>ip neigh</code>), MTU mismatch.', 'Routing and firewall: <code>ip route</code>, ping the gateway, firewall rules. Then driver/firmware (<code>ethtool -i</code>), counters (<code>ethtool -S</code>), compare with a working port, document.'],
  answer: `<ol><li><b>Confirm</b> it is in <code>lspci</code> with a driver (<code>lspci -k</code>) and an interface in <code>ip link</code>.</li><li><b>Link?</b> LOWER_UP vs NO-CARRIER in <code>ip a</code>, <code>ethtool</code> "Link detected", LEDs on both ends. No link → cable, transceiver type and speed, dirty fiber, wrong or disabled switch port.</li><li><b>Interface down?</b> <code>ip link set ens1f0 up</code>; check NetworkManager.</li><li><b>IP settings</b>: no address, 169.254 (DHCP failed), wrong subnet, or a config pointing at an old interface name.</li><li><b>Local network</b>: wrong <b>VLAN</b> on the switch port, <b>ARP failing</b> (<code>ip neigh</code> shows the gateway FAILED/INCOMPLETE), <b>MTU mismatch</b> (small pings work, large transfers hang). In this lab: ARP to the gateway failed because the switch port was in the wrong VLAN.</li><li><b>Routing and firewall</b>: <code>ip route</code>, ping the gateway, firewall rules.</li><li><b>Driver and firmware</b> (<code>ethtool -i</code>), <b>error counters</b> (<code>ethtool -S</code>), then <b>compare with a working port</b>, verify, and <b>document</b>.</li></ol>`,
  keys: [K('lspci -k / driver', 'lspci|driver'), K('LOWER_UP / NO-CARRIER', 'LOWER.?UP|NO.?CARRIER|link'), K('ethtool', 'ethtool'), K('interface up', 'link set|up'), K('IP / 169.254 / subnet', '169\\.254|subnet|IP'), K('VLAN', 'VLAN'), K('ARP / ip neigh', 'ARP|neigh'), K('MTU', 'MTU'), K('route / gateway', 'route|gateway'), K('firewall', 'firewall'), K('compare with working port', 'compare|working port'), K('document', 'document')]
});

M({n: 17, set: 'A', topic: 'NVMe drops out under load', reread: ['m6'],
  q: 'During a long stress test, an NVMe drive vanishes from lsblk. After a reboot it is back and looks healthy. What evidence would you look for, and what could be causing it?',
  brief: '<p>The drive in Bay 2 vanished overnight and came back after a reboot. The evidence from <i>before</i> the reboot is in the previous boot. Find it, reproduce under load while watching temperature, and follow the evidence to a physical cause.</p>',
  rig: () => {
    const r = baseRig({upDays: 0}); r.flags.blanksMissing = true;
    const t0 = 3 * 3600;
    r.journal.prevBoots.unshift({bootAt: new Date(+r.bootAt - 9 * 3600e3), lines: [{t: 10, src: 'kernel', lvl: 6, m: 'nvme nvme2: pci function 0000:a5:00.0'}, {t: t0, src: 'fio-burnin[4410]', lvl: 6, m: 'stress: 4 NVMe targets, randrw 128k qd64'}, {t: t0 + 2400, src: 'kernel', lvl: 4, m: 'nvme nvme2: I/O 512 QID 7 timeout, aborting'}, {t: t0 + 2430, src: 'kernel', lvl: 3, m: 'nvme nvme2: controller is down; will reset: CSTS=0xffffffff, PCI_STATUS=0xffff'}, {t: t0 + 2431, src: 'kernel', lvl: 3, m: 'nvme nvme2: Removing after probe failure status: -19'}, {t: t0 + 2431, src: 'fio-burnin[4410]', lvl: 3, m: 'io_u error on /dev/nvme2n1: No such device'}]});
    sel(r, '02:51:20', 'Temperature NVMe Bay2 Temp #0x72', 'Upper Non-critical going high (79 C)', 'w'); sel(r, '02:52:21', 'Drive Slot 2 #0x62', 'Drive Fault', 'e');
    r.nvmeInfo.nvme2.warnTime = 41; r.nvmeInfo.nvme2.unsafe = 9;
    r.hooks.cmd = {fio: (a, X) => {
      const q = X.r; const n = q.nvmeInfo.nvme2; const st = [{d: 300, line: 'burnin: (g=0): rw=randrw, bs=(R) 128KiB, ioengine=libaio, iodepth=64'}];
      if (q.flags.blanksMissing) { [62, 70, 76, 80].forEach((tp, k) => st.push({d: 900, line: null, fx: qq => { qq.nvmeInfo.nvme2.temp = tp; return `Jobs: 4 (f=4): [m(4)][${25 * (k + 1)}%]   nvme2 composite temp ${tp} C`; }})); st.push({d: 600, line: null, fx: qq => { const t = (qq.now - qq.bootAt) / 1000; qq.dmesg.push({t, lvl: 4, m: 'nvme nvme2: I/O 512 QID 7 timeout, aborting'}, {t: t + 30, lvl: 3, m: 'nvme nvme2: controller is down; will reset: CSTS=0xffffffff, PCI_STATUS=0xffff'}, {t: t + 31, lvl: 3, m: 'nvme nvme2: Removing after probe failure status: -19'}); qq.devs.nvme2.gone = true; return L('e', 'fio: io_u error on file /dev/nvme2n1: No such device'); }}); }
      else { [44, 49, 52, 53].forEach((tp, k) => st.push({d: 900, line: null, fx: qq => { qq.nvmeInfo.nvme2.temp = tp; return `Jobs: 4 (f=4): [m(4)][${25 * (k + 1)}%]   nvme2 composite temp ${tp} C`; }})); st.push({d: 300, line: L('g', 'Run status: 4 jobs, 0 errors.')}); }
      return {stream: st};
    }};
    r.hooks.onBoot = rr => { rr.devs.nvme2.gone = false; rr.nvmeInfo.nvme2.temp = 39; };
    return refresh(r);
  },
  topo: r => topoStorage(r),
  chips: ['journalctl -b -1 -k | grep -i nvme', 'sudo ipmitool sel elist', 'sudo nvme smart-log /dev/nvme2', 'sudo lspci -vv -s a5:00.0 | grep -i lnk', 'fio --name=burnin --rw=randrw --runtime=3600', 'dmesg | grep -i nvme'],
  tasks: [{t: 'Kernel evidence from before the reboot', cmd: /journalctl.*-b\s+-1/}, {t: 'BMC events at the same time', cmd: /ipmitool.*sel/}, {t: 'Drive health: temperature, media errors, warnings', cmd: /smart-log|smartctl/}, {t: 'Link: LnkSta vs LnkCap, AER', cmd: /lspci.*-vv|dmesg.*aer/i}, {t: 'Firmware: drive, backplane, BIOS', cmd: /nvme list/}, {t: 'Reproduce under load while watching temperature', cmd: /^fio/}, {t: 'Inspect the drive cage airflow', when: r => r.flags.looked}, {t: 'Fix and reproduce again: no drop', cmd: /^fio/, ok: r => !r.flags.blanksMissing && !r.devs.nvme2.gone}],
  actions: [{id: 'look', node: ['bp', 'dev:nvme2'], kind: 'look', label: 'Inspect the front drive cage', do: r => { r.flags.looked = true; return r.flags.blanksMissing ? say(L('e', 'Bays 4 and 5 are empty with NO drive blanks: air rushes through the empty bays instead of over the drives.'), 'Bay 2 sits next to them. Cables and connectors look fine.') : 'Blanks installed in all empty bays.'; }}, {id: 'blanks', node: 'bp', kind: 'fix', label: 'Install drive blanks in Bays 4 and 5', do: r => { r.flags.blanksMissing = false; return L('g', 'Blanks installed. Airflow now goes over the drives.'); }}],
  hint: ['Evidence before/after reboot: <code>dmesg > file</code> before, or <code>journalctl -b -1 -k | grep -i nvme</code> after ("I/O timeout, aborting", "controller is down; will reset", "Removing after probe failure").', 'BMC SEL for drive or PCIe events at the same time.', 'Health: <code>nvme smart-log</code> — temperature, media errors, warnings, unsafe shutdowns.', 'Link: LnkSta vs LnkCap, AER errors on the port above the drive. Firmware: drive, backplane, BIOS.', 'Causes: seating/worn backplane connector, bad or misrouted cable, overheating, power-saving that fails to wake, firmware bug, PCIe signal, failing drive. Isolate by moving bays; reproduce under load with <code>dmesg -w</code> and temperature.'],
  answer: `<p>A reboot resets the link, so the drive returns — but the cause remains. <b>Evidence:</b></p><ul><li><b>Kernel messages</b> from the failure: save <code>dmesg</code> before rebooting, or read <code>journalctl -b -1 -k | grep -i nvme</code> afterwards: "I/O timeout, aborting", "controller is down; will reset", "Removing after probe failure".</li><li><b>BMC event log</b> for drive or PCIe events at the same time.</li><li><b>Drive health</b>: <code>nvme smart-log</code> — temperature (and warning-temperature time), media errors, critical warnings, unsafe shutdowns.</li><li><b>The link</b>: LnkSta vs LnkCap, and AER errors on the port above the drive.</li><li><b>Firmware</b> versions of the drive, backplane and BIOS.</li></ul><p><b>Possible causes:</b> poor seating or a worn backplane connector; a bad or misrouted cable; <b>overheating</b>; power-saving features that fail to wake; a firmware bug; PCIe signal problems; a failing drive.</p><p><b>Then:</b> isolate — move the drive to another bay (follows the drive → drive; stays with the bay → bay, backplane or cable) — and <b>reproduce under load</b> (fio) while watching <code>dmesg -w</code> and temperature. In this lab the temperature climbed to 80 °C before each drop because empty bays had no blanks. Fix, rerun, document.</p>`,
  keys: [K('save dmesg / journalctl -b -1', 'journalctl|dmesg|-b -1'), K('nvme timeout / controller down', 'timeout|controller|removing'), K('BMC SEL', 'SEL|BMC|event'), K('smart-log', 'smart'), K('temperature', 'temp|heat'), K('media errors', 'media'), K('LnkSta / AER', 'LnkSta|AER|link'), K('firmware', 'firmware'), K('seating / connector / cable', 'seat|connector|cable|backplane'), K('power saving', 'power.?sav|wake|APST'), K('move to another bay', 'bay|move'), K('reproduce under load', 'load|fio|reproduc')]
});

M({n: 18, set: 'A', topic: 'GPU missing, empty port in lspci -tv', reread: ['m11', 'm4'],
  q: 'An 8-GPU server shows only seven GPUs. In lspci -tv , the PCIe port that should lead to GPU 6 is present but has nothing under it. List what could cause this, and explain how you would narrow it down.',
  brief: '<p>An 8-GPU server, seven detected. Confirm the empty port, then narrow it down — and resist replacing the switch or riser: an empty port points at the device side.</p>',
  rig: () => { const r = baseRig({gpus: 8}); r.devs.gpu6.present = false; r.flags.unseated = true; r.hooks.onBoot = rr => { rr.devs.gpu6.present = !rr.flags.unseated; }; kx(r, '08:10:33', 'warn', 'pcieport 0000:82:08.0: link training to downstream device timed out'); return refresh(r); },
  topo: r => topoPcie(r, {rowH: 46}),
  chips: ['nvidia-smi', 'lspci | grep -i nvidia | wc -l', 'lspci -tv', 'sudo ipmitool sensor | grep -i gpu', 'dmesg | grep -i -E "xid|nvrm|pcie"'],
  tasks: [{t: 'Count at the driver and bus layers', cmd: /nvidia-smi|lspci.*nvidia/}, {t: 'Confirm the empty port in the tree', cmd: /lspci.*-t/}, {t: 'BMC view of GPU 6 (hardware layer)', cmd: /ipmitool.*(sensor|sel)/}, {t: 'Logs', cmd: /dmesg|journalctl/}, {t: 'Physical: check GPU 6 power cable and seating', when: r => r.flags.cab && r.flags.seat}, {t: 'Fix and verify 8 GPUs', cmd: /nvidia-smi|lspci/, ok: r => gpuList(r).length === 8}],
  actions: [
    {id: 'cab', node: 'dev:gpu6', kind: 'look', label: 'Check GPU 6 auxiliary power cable', do: r => { r.flags.cab = true; return L('g', 'Aux power cable connected and latched.'); }},
    {id: 'seat', node: 'dev:gpu6', kind: 'look', label: 'Check GPU 6 seating and retention latch', do: r => { r.flags.seat = true; return r.flags.unseated ? L('e', 'GPU 6 is not fully down in the slot: one end sits 2 mm high and the retention latch is half open.') : L('g', 'Fully seated, latch closed.'); }},
    {id: 'reseat', node: 'dev:gpu6', kind: 'fix', label: 'Power off, ESD strap, reseat GPU 6 and close the latch', reboot: 'cycle', do: r => { r.flags.unseated = false; return 'Reseated. Powering on.'; }},
    {id: 'riser', node: 'rt:rt2', kind: 'swap', label: 'Replace Riser 2', do: () => say(L('w', 'GPU 6 is still missing.'), L('d', 'GPUs 4, 5 and 7 share this riser and switch and are fine. An empty port points at the device side, not the shared path.'))}
  ],
  hint: ['An <b>empty port</b> means the device did not link: suspect the GPU itself, its <b>auxiliary power cable</b>, <b>seating</b>, the <b>slot</b>, or a <b>retimer</b>.', 'Not a missing branch: the switch and the other GPUs on it are fine, so the shared path is less likely.', 'Narrow down: BMC inventory/sensors and SEL for GPU 6, logs, BIOS (slot enabled, Above 4G, Resizable BAR), PSU status, temperatures.', 'Physical (powered off, ESD): aux power, seating/latch. Then swap GPU 6 with a working slot: follows the GPU → GPU; stays → slot/retimer/power.', 'Verify: 8 in nvidia-smi and lspci, full GPU test; document.'],
  answer: `<p>The port is present but empty, so <b>the device did not link</b>. Causes: the <b>GPU itself</b>; its <b>auxiliary power cable</b> (missing or loose); <b>seating</b> (not fully in, latch open); the <b>slot</b>; or a <b>retimer</b> on that path. (A whole missing branch would point upstream instead — riser, cable, switch, root port, BIOS; here the switch and its other GPUs are fine.)</p><p><b>Narrowing it down:</b></p><ol><li><b>Count at each layer</b>: nvidia-smi (7), <code>lspci | grep -i nvidia | wc -l</code> (7), BMC inventory/sensors. Use the topology diagram to confirm which slot is GPU 6.</li><li><b>Logs</b>: <code>dmesg | grep -i -E "xid|nvrm|pcie"</code>, the BMC SEL (power faults, temperatures), PSU status.</li><li><b>BIOS</b>: slot enabled, Above 4G Decoding, Resizable BAR.</li><li><b>Physical</b>, powered off with ESD protection: aux power cable connected; GPU fully seated, latch closed; slot clean.</li><li><b>Swap</b> GPU 6 with a GPU from a working slot: problem follows the GPU → GPU; stays with the slot → slot, retimer or power path.</li><li><b>Verify</b> with nvidia-smi (8), lspci and a full GPU test (<code>dcgmi diag</code>), and <b>document</b>.</li></ol>`,
  keys: [K('device did not link', 'link|empty'), K('GPU itself', 'GPU'), K('aux power cable', 'power cable|aux'), K('seating', 'seat'), K('slot', 'slot'), K('retimer', 'retimer'), K('BMC / SEL', 'BMC|SEL'), K('logs / Xid', 'dmesg|Xid|log'), K('BIOS settings', 'BIOS|Above 4G|Resizable'), K('swap: follows or stays', 'swap|follow|stay'), K('verify / full test', 'verif|dcgmi|test'), K('document', 'document')]
});

M({n: 19, set: 'A', topic: 'Failure follows the part', reread: ['m10'], mode: 'physical',
  q: 'You move a suspect GPU from Server A into known-good Server B, and Server B now fails the same way. What does this prove, what does it not prove, and what do you do next with both servers and the GPU?',
  brief: '<p>Physical bench with two servers and a test station. Do the move yourself, run the tests, then handle both servers and the GPU the way the course says.</p>',
  rig: () => { const r = baseRig(); r.flags.A = 'suspect'; r.flags.B = 'bgpu'; return r; },
  topo: r => Object.assign(topoMethod(r, {title: 'Server A, golden Server B, the suspect GPU and a known-good GPU'}), {sync: (t, rr) => { const f = rr.flags; const lab = x => x === 'suspect' ? 'suspect GPU' : x === 'bgpu' ? "B's own GPU" : x === 'kg' ? 'known-good GPU' : 'empty slot'; t.sub('srvA', 'holds: ' + lab(f.A)); t.sub('srvB', 'holds: ' + lab(f.B)); if (f.lastA === 'FAIL') t.set('srvA', 'bad'); if (f.lastA === 'PASS') t.set('srvA', 'good'); if (f.lastB === 'FAIL') t.set('srvB', 'bad'); if (f.lastB === 'PASS') t.set('srvB', 'good'); if (f.quarantined) t.set('rma', 'warn', 'suspect GPU tagged · RMA'); if (f.doc) t.set('m6', 'good'); }}),
  panel: lab => testStationPanel(lab, {units: ['Server A', 'Server B'], run: (r, u) => { const f = r.flags; const has = u === 'Server A' ? f.A : f.B; const res = has === 'suspect' ? 'FAIL' : has ? 'PASS' : 'FAIL'; f[u === 'Server A' ? 'lastA' : 'lastB'] = res; f.log = (f.log || []).concat(u + res); return (res === 'PASS' ? L('g', `${u}: dcgmi diag -r 3 … PASS`) : L('e', `${u}: dcgmi diag -r 3 … FAIL — ${has ? 'GPU memory errors, Xid 48' : 'no GPU in slot'}`)); }}),
  tasks: [{t: 'Test Server A as found', when: r => (r.flags.log || []).includes('Server AFAIL')}, {t: 'Move the suspect GPU from A into Server B', when: r => r.flags.B === 'suspect'}, {t: 'Test Server B with the suspect GPU', when: r => r.flags.B === 'suspect' && r.flags.lastB === 'FAIL'}, {t: 'Tag and quarantine the suspect GPU', when: r => r.flags.quarantined}, {t: 'Return Server B to its original state and retest it', when: r => r.flags.B === 'bgpu' && r.flags.quarantined && r.flags.lastB === 'PASS'}, {t: 'Inspect Server A\'s slot and test A with a known-good GPU', when: r => r.flags.A === 'kg' && r.flags.lastA === 'PASS' && r.flags.slotA}, {t: 'Document both serials and start the RMA', when: r => r.flags.doc}],
  actions: [
    {id: 'move', node: ['part', 'srvB'], kind: 'move', label: 'Move the suspect GPU from Server A into Server B (B\'s own GPU aside, labelled)', do: r => { r.flags.A = null; r.flags.B = 'suspect'; r.flags.lastB = null; return 'Suspect GPU (sn 1652324001180) now in Server B. B\'s own GPU bagged and labelled.'; }},
    {id: 'tag', node: ['part', 'rma'], kind: 'look', label: 'Remove the suspect GPU, tag it and put it in quarantine', do: r => { if (r.flags.B === 'suspect') r.flags.B = null; if (r.flags.A === 'suspect') r.flags.A = null; r.flags.quarantined = true; return 'Tagged "SUSPECT — failed in A and in golden B", serial recorded, moved to the quarantine shelf.'; }},
    {id: 'restoreB', node: 'srvB', kind: 'fix', label: 'Put Server B\'s own GPU back (original state)', do: r => { r.flags.B = 'bgpu'; r.flags.lastB = null; return 'Server B restored to how it was. Retest it on the test station.'; }},
    {id: 'slotA', node: 'srvA', kind: 'look', label: 'Inspect Server A\'s slot, riser and GPU power connector', do: r => { r.flags.slotA = true; return L('g', 'Slot contacts clean, no scorch marks, riser seated, 16-pin power connector undamaged.'); }},
    {id: 'kgA', node: ['kg', 'srvA'], kind: 'swap', label: 'Install a known-good GPU in Server A', do: r => { r.flags.A = 'kg'; r.flags.lastA = null; return 'Known-good GPU (sn 1652324001323) installed in Server A. Retest A.'; }},
    {id: 'doc', kind: 'doc', label: 'Document both serials and open the RMA', do: r => { r.flags.doc = true; return 'Record: suspect GPU sn 1652324001180 failed in A and in golden B; B passes with its own GPU; A passes with known-good sn ...1323. RMA opened for ...1180 with test logs attached.'; }}
  ],
  demo: ['#move', '#tag', '#restoreB', '#slotA', '#kgA', '#doc'],
  hint: ['Proves: the GPU is very likely bad — the failure followed it.', 'Does NOT prove Server A is healthy: a bad slot or power problem in A may have damaged the GPU.', 'Next: tag and quarantine the GPU; return Server B to its original state and retest it; inspect A\'s slot and test A with a known-good part; document both serials; start the RMA.'],

<script>
/* ======================= SET B ======================= */
function prevBoot(start, end, extra) {
  const L0 = [{t: 0, src: 'kernel', lvl: 5, m: 'Linux version 5.14.0-427.13.1.el9_4.x86_64 (mockbuild@build.local)'}, {t: 3.4, src: 'kernel', lvl: 6, m: 'nvme nvme0: pci function 0000:5e:00.0'}, {t: 16, src: 'systemd[1]', lvl: 6, m: 'Started sshd.service - OpenSSH server daemon.'}, {t: 16.9, src: 'systemd[1]', lvl: 6, m: 'Reached target multi-user.target - Multi-User System.'}];
  const dur = (end - start) / 1000; const lines = [...L0];
  for (let t = 3600; t < dur - 120; t += 3600 * 3) lines.push({t, src: 'systemd[1]', lvl: 6, m: 'Started dnf-makecache.service - dnf makecache.'});
  lines.push({t: dur - 70, src: 'CROND[8812]', lvl: 6, m: '(root) CMD (run-parts /etc/cron.hourly)'});
  (extra || []).forEach(e => lines.push(Object.assign({}, e, {t: e.t != null ? e.t : dur + e.dt})));
  lines.sort((a, b) => a.t - b.t);
  return {bootAt: start, lines};
}

M({n: 21, set: 'B', topic: 'How a name becomes an IP address', reread: ['m7'],
  q: 'Explain how a Linux server turns the name db01 into an IP address. Include which files are involved, the order they are checked, and what DNS records and caching are.',
  brief: '<p>Trace the lookup for <code>db01</code> on a live server: the two files, the DNS server, the A record, and the cache.</p>',
  rig: () => { const r = baseRig(); r.files['/etc/hosts'] += '10.99.0.12  bmc-r07u12      # local entry, never asked to DNS\n'; return r; }, topo: r => topoNetwork(r),
  chips: ['cat /etc/hosts', 'cat /etc/resolv.conf', 'nslookup db01', 'dig db01', 'ping -c 2 db01'],
  tasks: [{t: 'File 1 (checked first)', cmd: /cat.*\/etc\/hosts/}, {t: 'File 2: which DNS server, which search domain?', cmd: /cat.*resolv\.conf/}, {t: 'Ask the DNS server', cmd: /nslookup.*db01|dig.*db01/}, {t: 'See the A record and its TTL with dig', cmd: /^dig.*db01/}, {t: 'Run dig again: did the answer come from the cache?', cmd: /^dig.*db01/, ok: r => r.digTtl && r.digTtl.db01 < 3600}, {t: 'Use the name', cmd: /(ping|ssh).*db01/}],
  hint: ['Order: <code>/etc/hosts</code> first, then the DNS server listed in <code>/etc/resolv.conf</code> (with its search domain).', 'The DNS server answers from its records — an <b>A record</b> maps a name to an IPv4 address — or asks other servers.', 'The answer is <b>cached</b> (for its TTL), so the next lookup is faster.', 'Commands: <code>cat /etc/hosts</code>, <code>cat /etc/resolv.conf</code>, <code>nslookup db01</code>, <code>dig db01</code>.'],
  answer: `<ol><li>The program asks the resolver for <code>db01</code>. Linux checks <b><code>/etc/hosts</code> first</b>: a local list of name-to-IP lines. If db01 is there, that answer is used and DNS is never asked.</li><li>If not, it reads <b><code>/etc/resolv.conf</code></b> to find the <b>DNS server</b> (<code>nameserver 10.20.5.5</code>) and the <b>search domain</b> (<code>lab.local</code>, so db01 becomes the full name db01.lab.local — the FQDN).</li><li>It sends the question to that <b>DNS server</b>. The server answers from its <b>records</b> — an <b>A record</b> maps a name to an IPv4 address (db01.lab.local → 10.4.2.15) — or asks other DNS servers.</li><li>The answer is <b>cached</b> for a time (its TTL), so repeated lookups are answered quickly without asking again. <code>dig</code> shows the TTL counting down.</li></ol><p>Tools: <code>nslookup db01</code>, <code>dig db01</code>. If the IP works but the name fails, the problem is in this chain, not the network.</p>`,
  keys: [K('/etc/hosts', '/etc/hosts|hosts file'), K('checked first', 'first'), K('/etc/resolv.conf', 'resolv'), K('DNS server / nameserver', 'nameserver|DNS server'), K('search domain / FQDN', 'search|FQDN|full name|lab\\.local'), K('A record', 'A record'), K('IPv4', 'IPv4|10\\.4\\.2\\.15|IP address'), K('asks other servers', 'other server|forward|recurs'), K('cache', 'cach'), K('TTL', 'TTL|time to live')]
});

M({n: 22, set: 'B', topic: 'Topology tree versus diagram', reread: ['m4'],
  q: 'Your service guide includes a drawing of how every PCIe slot is wired, and Linux can print the PCIe tree it actually found. Explain what each one shows, which command prints the tree, and how comparing the two helps you find a fault.',
  brief: '<p>The drawing on the right is the service-guide diagram, coloured by what Linux found. Print the tree, compare, and go fix the shared part.</p>',
  rig: () => { const r = baseRig(); r.risers.riser2.ok = false; r.hooks.onBoot = rr => { rr.risers.riser2.ok = !rr.flags.riserLoose; }; r.flags.riserLoose = true; return refresh(r); },
  topo: r => topoPcie(r),
  chips: ['lspci -tv', 'nvidia-smi', 'lspci | grep -i nvidia'],
  tasks: [{t: 'Print the actual tree', cmd: /lspci.*-t/}, {t: 'Count what the driver sees', cmd: /nvidia-smi|lspci.*nvidia/}, {t: 'Hands on: the part every missing device shares', when: r => r.flags.looked}, {t: 'Fix and compare again: tree matches the diagram', cmd: /lspci.*-t/, ok: r => r.risers.riser2.ok}],
  actions: [{id: 'look', node: 'rt:rt2', kind: 'look', label: 'Inspect Riser 2 and its cable', do: r => { r.flags.looked = true; return r.flags.riserLoose ? L('e', 'Riser 2 is lifted on one side: its card-edge is not fully in the motherboard connector.') : L('g', 'Riser 2 seated.'); }}, {id: 'fix', node: 'rt:rt2', kind: 'fix', label: 'Power off, reseat Riser 2, power on', reboot: 'cycle', do: r => { r.flags.riserLoose = false; return 'Riser 2 pressed home until flush. Powering on.'; }}, {id: 'gpu', node: ['dev:gpu2', 'dev:gpu3'], kind: 'swap', label: 'Replace this GPU', do: () => say(L('w', 'Still missing.'), L('d', 'Both GPUs and their switch vanished together — a whole branch. That points upstream at the shared part.'))}],
  hint: ['Diagram = <b>expected</b>: which CPU and root port each slot connects to; switches, risers, retimers, cables between; expected widths; slot-to-bus mapping; shared paths.', 'Tree = <b>actual</b>: <code>lspci -tv</code>.', 'Compare: port present but empty → the device; whole branch missing → upstream (riser, cable, switch, retimer, root port, BIOS slot); everything under one switch missing → the switch or its upstream link.'],
  answer: `<p><b>The topology diagram</b> (service guide or engineering) is the <b>expected</b> picture: which <b>CPU and root port</b> each slot connects to, which <b>switches, risers, retimers and cables</b> sit in between, the <b>expected link width</b>, how <b>slots map to bus numbers</b>, and which devices <b>share a path</b>.</p><p><b>The topology tree</b> from <b><code>lspci -tv</code></b> is the <b>actual</b> picture: the ports and bus ranges Linux found and the devices under them (<code>01.0</code> is a port, <code>[17-1a]</code> the buses behind it, a port with branches is a switch).</p><p><b>Comparing them</b> tells you where the fault is:</p><ul><li><b>Port present, nothing under it</b> → the device did not link: device, its power cable, seating, the slot, or a retimer.</li><li><b>Whole branch missing</b> → something upstream: riser, cable, switch, retimer, CPU root port, or a slot disabled in BIOS.</li><li><b>Every device under one switch missing</b> → the switch or its upstream link, not each device.</li></ul><p>In this lab both GPUs on CPU 2 and their switch were missing together, so the shared part — Riser 2 — was the suspect, not the GPUs.</p>`,
  keys: [K('diagram = expected', 'expected|diagram'), K('tree = actual', 'actual|tree'), K('lspci -tv', 'lspci -tv|lspci -t'), K('CPU / root port per slot', 'root port|CPU'), K('switch / riser / retimer / cable', 'switch|riser|retimer|cable'), K('expected width / bus mapping', 'width|bus'), K('empty port → device', 'empty|nothing under'), K('missing branch → upstream', 'branch|upstream'), K('shared path', 'shar')]
});

M({n: 23, set: 'B', topic: 'What the BMC is and does', reread: ['m8'], start: 'laptop',
  q: 'What is a BMC, and why does it keep working when the server’s operating system has crashed? List at least six things a technician can do with it.',
  brief: '<p>From your laptop, do six different things through the BMC, over the management network only.</p>',
  rig: () => { const r = baseRig(); sel(r, '03:12:44', 'Memory #0x87', 'Correctable ECC (DIMM B2)', 'w'); return r; }, topo: r => topoOob(r),
  chips: [LAPTOP_BMC + ' mc info', LAPTOP_BMC + ' sensor', LAPTOP_BMC + ' sel elist', LAPTOP_BMC + ' fru print', LAPTOP_BMC + ' chassis identify', LAPTOP_BMC + ' power status', LAPTOP_BMC + ' sol activate'],
  tasks: [{t: 'Firmware versions', cmd: /ipmitool.*mc info/}, {t: 'Sensors', cmd: /ipmitool.*(sensor|sdr)/}, {t: 'System Event Log', cmd: /ipmitool.*sel/}, {t: 'Inventory / serial numbers', cmd: /ipmitool.*fru/}, {t: 'Find the server in the rack (UID LED)', cmd: /ipmitool.*identify/}, {t: 'Power state', cmd: /ipmitool.*power/}, {t: 'Console (SOL)', cmd: /ipmitool.*sol activate/}],
  hint: ['BMC = Baseboard Management Controller: a small separate computer on the motherboard with its own processor, firmware and network port.', 'It runs on <b>standby power</b> and does not depend on the OS: out-of-band management.', 'Six things: SEL, sensors, inventory and firmware, virtual console (KVM) and SOL, power control (on/off/reset/cycle/NMI), boot order and virtual media.', 'Vendor names: iDRAC, iLO, XCC, IPMI/BMC. Interfaces: web page, IPMI (ipmitool), Redfish.'],
  answer: `<p>A <b>BMC (Baseboard Management Controller)</b> is a small separate computer on the motherboard with its <b>own processor, firmware and network port</b>. Vendor names: iDRAC (Dell), iLO (HPE), XCC (Lenovo), IPMI/BMC (Supermicro and others). It is used through a web page, the IPMI protocol (<code>ipmitool</code>) or Redfish.</p><p><b>Why it keeps working:</b> it runs on <b>standby power</b> and does not use the server's operating system at all, so it works when the server is off, the OS has crashed, or no OS is installed. This is <b>out-of-band management</b>.</p><p><b>What a technician can do with it:</b></p><ol><li>Read the <b>System Event Log (SEL)</b>: memory, PCIe, power, fan and temperature events with timestamps.</li><li>Read <b>sensors</b>: temperatures, voltages, fan speeds, PSU status, power draw.</li><li>See <b>hardware inventory</b>, health and <b>firmware versions</b> (and serials with <code>fru print</code>).</li><li>Use the <b>virtual console (KVM)</b> and <b>Serial Over LAN</b>.</li><li><b>Control power</b>: on, off, reset, power cycle, or send an <b>NMI</b> to force a crash dump.</li><li>Change <b>boot order</b> and mount an ISO as <b>virtual media</b>.</li></ol>`,
  keys: [K('separate computer', 'separate|own processor|small computer'), K('own network port', 'network port|own network|management network'), K('standby power', 'standby'), K('out-of-band', 'out.?of.?band'), K('SEL', 'SEL|event log'), K('sensors', 'sensor'), K('inventory / firmware', 'inventory|firmware'), K('KVM / SOL', 'KVM|SOL|console'), K('power control', 'power'), K('NMI / crash dump', 'NMI|crash dump'), K('boot order / virtual media', 'boot order|virtual media|ISO')]
});

M({n: 24, set: 'B', topic: 'Retimers versus redrivers', reread: ['m4'], widget: 'retimer',
  q: 'What is a PCIe retimer, how is it different from a redriver, why are retimers so common in Gen 5 servers, and how might a failed retimer show up during testing?',
  brief: '<p>A retimer is invisible in <code>lspci</code>, so you find a bad one by its fingerprints: several devices behind the same retimer misbehaving together. Find them, then check what the BMC knows.</p>',
  rig: () => { const r = baseRig(); r.retimers.rt2.fw = '1.9.0'; ['gpu2', 'gpu3'].forEach(g => { r.devs[g].sta = {gt: 8, w: 16}; r.devs[g].aer = 120; }); ['02:10:11', '04:44:02', '08:59:30'].forEach(t2 => ['83', '84'].forEach(b => { kx(r, t2, 'warn', `pcieport 0000:82:${b === '83' ? '00' : '04'}.0: AER: Corrected error received: 0000:${b}:00.0`); kx(r, t2, 'warn', `nvidia 0000:${b}:00.0: PCIe Bus Error: severity=Corrected, type=Physical Layer`); })); sel(r, '01:00:02', 'PCIe Retimer RT2 #0x91', 'Health degraded — firmware 1.9.0 (approved 2.4.1)', 'w'); r.hooks.onBoot = rr => { if (rr.retimers.rt2.fw === '2.4.1') { ['gpu2', 'gpu3'].forEach(g => { rr.devs[g].sta = {gt: 32, w: 16}; rr.devs[g].aer = 0; }); rr.dmesgExtra = []; } }; return refresh(r); },
  topo: r => topoPcie(r),
  chips: ['nvidia-smi', 'sudo lspci -vv -s 83:00.0 | grep -i lnk', 'sudo lspci -vv -s 84:00.0 | grep -i lnk', 'dmesg | grep -i aer', 'lspci -tv', 'sudo ipmitool sel elist'],
  tasks: [{t: 'Link status of GPU 2 and GPU 3', cmd: /lspci.*-vv/}, {t: 'The corrected-error stream', cmd: /dmesg.*aer|dmesg.*pcie/i}, {t: 'What do they share? (tree + diagram)', cmd: /lspci.*-t/}, {t: 'What the BMC knows about the retimer', cmd: /ipmitool.*sel/}, {t: 'Fix and verify both links at Gen 5 x16', cmd: /lspci.*-vv/, ok: r => r.devs.gpu2.sta.gt === 32}],
  actions: [{id: 'reseat', node: 'rt:rt2', kind: 'look', label: 'Reseat Riser 2 (retimer is on it)', do: () => say(L('w', 'Riser reseated. Both GPUs still train at Gen 3.'), L('d', 'Seating was fine — next suspect: the retimer\'s own firmware.'))}, {id: 'fw', kind: 'gui', label: 'BMC web › Firmware › update Retimer RT2 to approved 2.4.1, then power cycle', reboot: 'cycle', do: r => { r.retimers.rt2.fw = '2.4.1'; return 'Retimer RT2 firmware 1.9.0 → 2.4.1 (approved). Versions recorded. Power cycling.'; }}],
  hint: ['Retimer: fully <b>recovers</b> the data and <b>re-transmits</b> a clean signal — resets the loss budget; takes part in link training; invisible to the OS.', 'Redriver: a simple amplifier — boosts signal <b>and noise</b>; no link training.', 'Gen 5: faster signals lose strength quickly over traces, connectors, risers and cables, so long paths need retimers.', 'Failed retimer: devices behind it disappear, downtrained links, or a stream of corrected PCIe errors. It has firmware; some BMCs report its health.'],
  answer: `<p>A <b>retimer</b> sits in the PCIe path (on risers, backplanes, motherboards, GPU baseboards). It <b>fully recovers the data and re-transmits a clean signal</b>, resetting the loss budget so the link can reach much farther. It <b>takes part in link training</b> and is normally <b>invisible to the OS</b> (not in lspci). It has firmware, and some BMCs report its health.</p><p>A <b>redriver</b> is a simple <b>amplifier</b>: it boosts the signal <b>and its noise</b>, and does not take part in link training.</p><p><b>Why common in Gen 5:</b> at Gen 4 and Gen 5 speeds signals lose strength much faster over traces, connectors, risers and cables, so long paths need retimers to work at all.</p><p><b>How a failed or misconfigured retimer shows up:</b> <b>every device behind it disappears</b>; links are <b>downtrained</b> (LnkSta below LnkCap); or a <b>steady stream of corrected PCIe (AER) errors</b>. Because it is not in lspci, you spot it by the pattern — several devices behind the same retimer failing together (here GPU 2 and GPU 3 both at Gen 3 with AER errors) — and by BMC health and firmware version.</p>`,
  keys: [K('recovers + re-transmits', 'recover|re.?transmit|clean'), K('resets loss budget', 'loss budget|reset'), K('takes part in training', 'link training|train'), K('invisible to OS', 'invisible|not in lspci'), K('redriver = amplifier', 'amplif|boost'), K('boosts noise too', 'noise'), K('Gen 5 signal loss', 'Gen ?5|loss|strength|distance'), K('devices disappear', 'disappear|missing'), K('downtrained', 'downtrain|LnkSta'), K('corrected errors / AER', 'AER|corrected'), K('firmware / BMC health', 'firmware|BMC')]
});

M({n: 25, set: 'B', topic: 'LnkCap versus LnkSta', reread: ['m4'],
  q: 'Explain what LnkCap and LnkSta mean in lspci -vv output. What does it mean when they do not match, and what could cause it?',
  brief: '<p>GPU 0 is a Gen 5 card. Read its link, find the mismatch, and work through the causes. This one is not physical.</p>',
  rig: () => { const r = baseRig(); r.flags.forced = true; r.devs.gpu0.sta = {gt: 16, w: 16}; r.hooks.onBoot = rr => { rr.devs.gpu0.sta = rr.flags.forced ? {gt: 16, w: 16} : {gt: 32, w: 16}; }; return refresh(r); },
  topo: r => topoPcie(r),
  chips: ['sudo lspci -vv -s 19:00.0 | grep -i lnk', 'dmesg | grep -i "limited by"', 'nvidia-smi -q | grep -i -A3 generation'],
  tasks: [{t: 'Read LnkCap and LnkSta for GPU 0', cmd: /lspci.*-vv/}, {t: 'The kernel noticed too', cmd: /dmesg/}, {t: 'Physical check: seating and riser', when: r => r.flags.seat}, {t: 'Check the BIOS link-speed setting', when: r => r.flags.bios}, {t: 'Fix and verify LnkSta = LnkCap', cmd: /lspci.*-vv|nvidia-smi/, ok: r => r.devs.gpu0.sta.gt === 32}],
  actions: [{id: 'seat', node: 'dev:gpu0', kind: 'look', label: 'Check GPU 0 seating, riser and connector', do: r => { r.flags.seat = true; return L('g', 'Fully seated, riser seated, connector clean. Width trained at x16 — only the speed is low.'); }}, {id: 'bios', kind: 'bios', label: 'BIOS Setup › PCIe › Slot 2 Link Speed', do: r => { r.flags.bios = true; return r.flags.forced ? 'Slot 2 Link Speed ...... ' + L('e', '[Gen4]').slice(2) + '   (forced during an old debug session)' : 'Slot 2 Link Speed ...... [Auto]'; }}, {id: 'auto', kind: 'bios', label: 'BIOS: set Slot 2 Link Speed to Auto, save and reboot', reboot: 'cycle', do: r => { r.flags.forced = false; r.flags.bios = true; return 'Slot 2 Link Speed → [Auto]. Saving.'; }}],
  hint: ['LnkCap = what the device <b>can</b> do. LnkSta = what the link <b>actually</b> trained to at power-on.', 'Lower LnkSta = <b>downtrained</b>: works, but slower. Lspci adds "(downgraded)".', 'Causes: poor seating, a dirty connector, a bad riser, cable or retimer, or a BIOS speed setting. Also: the weakest part of the path, slot wiring.'],
  answer: `<p><b>LnkCap</b> (link capabilities) is what the device <b>can</b> do: its maximum speed (GT/s) and width (lanes). <b>LnkSta</b> (link status) is what the link <b>actually trained to</b> when it negotiated at power on.</p><p>If <b>LnkSta is lower</b> than LnkCap, the link is <b>downtrained</b>: it works, but slower (lspci marks it "(downgraded)"). Example here: LnkCap 32 GT/s x16, LnkSta 16 GT/s x16 — half the bandwidth.</p><p><b>Possible causes:</b> poor <b>seating</b>; a <b>dirty connector</b>; a bad <b>riser, cable, or retimer</b>; a <b>BIOS speed setting</b> (a forced link speed — the cause in this lab); and also the weakest part of the path (a Gen 4 slot) or how the slot is wired (an x16 slot wired x8). Look for AER errors on the same port, change one thing, and re-check LnkSta.</p>`,
  keys: [K('LnkCap = capable', 'LnkCap|capab|can do'), K('LnkSta = actual', 'LnkSta|actual|status|trained'), K('speed and width', 'speed|width|GT'), K('downtrained / slower', 'downtrain|downgrad|slower'), K('seating', 'seat'), K('dirty connector', 'dirty|connector'), K('riser / cable / retimer', 'riser|cable|retimer'), K('BIOS speed setting', 'BIOS')]
});

M({n: 26, set: 'B', topic: 'dmesg versus journalctl -b -1', reread: ['m2'],
  q: 'A server crashed overnight and rebooted itself. Which one shows you what happened before the crash, dmesg or journalctl -b -1 ? Explain what each one shows, and what you should save before you reboot a failing server.',
  brief: '<p>The server crashed at 03:12 and rebooted itself. Try both commands and see which one still has the story.</p>',
  rig: () => { const r = baseRig({upDays: 0}); const start = new Date(+r.bootAt - 14 * 86400e3); const end = new Date(+r.bootAt - 50e3 - (r.bootAt - todayAt('03:13:10'))); r.journal.prevBoots.unshift(prevBoot(start, todayAt('03:13:10'), [{dt: -25, src: 'kernel', lvl: 2, m: 'mce: [Hardware Error]: CPU 0: Machine Check: 0 Bank 13: be00000000800090'}, {dt: -25, src: 'kernel', lvl: 3, m: 'EDAC MC0: 1 UE memory read error on CPU_SrcID#0_MC#0_Chan#2_DIMM#0 (channel:2 slot:0 DIMM C1)'}, {dt: -24, src: 'kernel', lvl: 0, m: 'Kernel panic - not syncing: Fatal machine check'}])); sel(r, '03:12:46', 'Memory #0x87', 'Uncorrectable ECC (DIMM C1)', 'e'); sel(r, '03:12:47', 'OS Critical Stop #0x46', 'Run-time critical stop (panic)', 'e'); r.bootAt = new Date(+todayAt('03:14:30')); return refresh(r); },
  topo: r => topoLogs(r),
  chips: ['dmesg | grep -i -E "mce|panic|EDAC"', 'journalctl --list-boots', 'journalctl -b -1 -p err', 'journalctl -b -1 | tail -5', 'sudo ipmitool sel elist'],
  tasks: [{t: 'Look for the crash in dmesg', cmd: /^dmesg/}, {t: 'List the boots the journal has', cmd: /list-boots/}, {t: 'Read the previous boot\'s errors', cmd: /journalctl.*-b\s+-1/}, {t: 'Cross-check with the BMC event log', cmd: /ipmitool.*sel/}],
  hint: ['dmesg = kernel ring buffer <b>since this boot</b>; it is cleared on reboot.', '<code>journalctl -b -1</code> = the <b>previous</b> boot from the systemd journal (if it is kept on disk).', 'Before rebooting a failing server, save: <code>dmesg > before_reboot.txt</code>, the journal, the BMC SEL and sensors, and the console screen.'],
  answer: `<p><b><code>journalctl -b -1</code></b> shows what happened before the crash.</p><ul><li><b><code>dmesg</code></b> shows the <b>kernel messages since the current boot</b>, from a buffer in memory that is <b>cleared on reboot</b>. After the server rebooted itself, the crash messages are gone from it.</li><li><b><code>journalctl -b -1</code></b> reads the <b>previous boot</b> from the systemd journal — kernel and service messages — as long as the journal is kept on disk (persistent). <code>journalctl --list-boots</code> shows which boots it has. Here it shows the machine check, the uncorrectable ECC error on DIMM C1, and the kernel panic.</li></ul><p><b>Before rebooting a failing server, save the evidence:</b> <code>dmesg > before_reboot.txt</code>; the journal; the <b>BMC SEL</b> and sensors; and a screenshot of the <b>console</b> (via SOL/KVM) showing any panic. Then reboot, and read <code>journalctl -b -1</code> afterwards.</p>`,
  keys: [K('journalctl -b -1 wins', 'journalctl -b -1|-b -1'), K('dmesg = this boot', 'since boot|current boot|this boot'), K('cleared on reboot', 'clear|wiped|lost'), K('previous boot', 'previous'), K('persistent journal', 'persist|on disk|kept'), K('save dmesg to a file', 'dmesg >|save|file'), K('SEL', 'SEL|BMC'), K('console screenshot', 'console|screenshot|panic')]
});

M({n: 27, set: 'B', topic: 'The four layers of a working device', reread: ['m3'],
  q: 'Describe the four layers you check to decide whether a device is really working in Linux, and name the command or check you would use at each layer. Give an example where a device passes one layer and fails the next.',
  brief: '<p>A second NIC was just installed. Check it layer by layer; it will give you your example.</p>',
  rig: () => { const r = baseRig({nic2: true}); r.flags.layerNic = 'nic1'; r.devs.nic1.drv = false; r.ifaces.filter(i => i.dev === 'nic1').forEach(i => { i.carrier = true; }); kx(r, '09:31:00', 'warn', 'pci 0000:a3:00.0: no driver bound; install the vendor driver package for this device'); return refresh(r); },
  topo: r => topoLayers(r),
  chips: ['lspci | grep -i ethernet', 'lspci -k', 'ip a', 'nvidia-smi'],
  tasks: [{t: 'Layer 1 — physical: does the BIOS see it?', when: r => r.flags.bios}, {t: 'Layer 2 — bus', cmd: /^lspci(?!.*-k)/}, {t: 'Layer 3 — driver', cmd: /lspci.*-k|dmesg/}, {t: 'Layer 4 — function', cmd: /^ip\s+(a|addr|link)|nvidia-smi/}],
  actions: [{id: 'bios', kind: 'bios', label: 'BIOS Setup › PCIe device inventory', do: r => { r.flags.bios = true; return say('Slot 1: Mellanox ConnectX-6 Dx  ·  Slot 2/3/5/6: NVIDIA H100  ·  ' + L('g', 'Slot 4: Mellanox ConnectX-6 Dx (new)').slice(2), 'Layer 1 passes: installed, powered, seen by BIOS.'); }}],
  hint: ['1 Physical: installed, seated, powered, seen by BIOS/BMC? — look, LEDs, BIOS or BMC inventory.', '2 Bus: does the OS see it? — <code>lspci</code>, <code>lsblk</code>, <code>nvme list</code>.', '3 Driver: is one attached? — <code>lspci -k</code> "Kernel driver in use", <code>dmesg</code>.', '4 Function: configured and working? — <code>ip a</code>, <code>nvidia-smi</code>, a functional test.', 'Example: a NIC in lspci with no driver in use: passes 2, fails 3 — do not replace the card.'],
  answer: `<ol><li><b>Physical</b> — is it installed, seated, powered and seen by the BIOS/BMC? Check by looking, LEDs, and BIOS or BMC inventory.</li><li><b>Bus</b> — does the OS see it on the bus? <code>lspci</code> (or <code>lsblk</code>, <code>nvme list</code> for drives).</li><li><b>Driver</b> — is a driver attached? <code>lspci -k</code> ("Kernel driver in use"), <code>dmesg</code>.</li><li><b>Function</b> — is it configured and working? <code>ip a</code> for a NIC, <code>nvidia-smi</code> for a GPU, or a functional test.</li></ol><p><b>Example:</b> a NIC shows in <code>lspci</code> (passes the bus layer) but <code>lspci -k</code> has no "Kernel driver in use" line (fails the driver layer) — so there is no interface in <code>ip a</code>. The hardware is fine; the problem is the driver. <b>Do not replace the card.</b> (Another: a GPU in lspci but not in nvidia-smi.)</p>`,
  keys: [K('physical', 'physical'), K('BIOS / BMC inventory', 'BIOS|BMC|inventory|LED'), K('bus', 'bus'), K('lspci', 'lspci'), K('driver', 'driver'), K('lspci -k / dmesg', 'lspci -k|dmesg|kernel driver'), K('function', 'function|working'), K('ip a / nvidia-smi', 'ip a|nvidia-smi'), K('example passes then fails', 'example|pass')]
});

M({n: 28, set: 'B', topic: 'Swap with known-good', reread: ['m10'], mode: 'physical',
  q: 'Explain the swap with known-good technique. What does it mean if the problem follows the part, what does it mean if it stays with the slot, and what are the risks of the technique?',
  brief: '<p>Server A fails the GPU test. Use a known-good GPU and golden Server B to find out whether it is the part or the slot. This time the answer is different from Mission 19.</p>',
  rig: () => { const r = baseRig(); r.flags.A = 'orig'; r.flags.B = 'bgpu'; r.flags.slotBad = true; return r; },
  topo: r => Object.assign(topoMethod(r, {title: 'Swap with known-good: Server A, golden Server B'}), {sync: (t, rr) => { const f = rr.flags; const lab = x => x === 'orig' ? "A's original GPU" : x === 'bgpu' ? "B's own GPU" : x === 'kg' ? 'known-good GPU' : 'empty slot'; t.sub('srvA', 'holds: ' + lab(f.A)); t.sub('srvB', 'holds: ' + lab(f.B)); t.label('part', "A's original GPU"); if (f.lastA) t.set('srvA', f.lastA === 'PASS' ? 'good' : 'bad'); if (f.lastB) t.set('srvB', f.lastB === 'PASS' ? 'good' : 'bad'); }}),
  panel: lab => testStationPanel(lab, {units: ['Server A', 'Server B'], run: (r, u) => { const f = r.flags; const has = u === 'Server A' ? f.A : f.B; let res = has ? 'PASS' : 'FAIL'; if (u === 'Server A' && f.slotBad && has) res = 'FAIL'; f[u === 'Server A' ? 'lastA' : 'lastB'] = res; f.runs = (f.runs || []).concat(`${u}:${has}:${res}`); return res === 'PASS' ? L('g', `${u} (${has}): dcgmi diag -r 3 … PASS`) : L('e', `${u} (${has || 'empty'}): dcgmi diag -r 3 … FAIL — PCIe replay errors, link drops to x4`); }}),
  tasks: [{t: 'Test Server A as found', when: r => (r.flags.runs || []).includes('Server A:orig:FAIL')}, {t: 'Put a known-good GPU into Server A\'s suspect slot and test', when: r => (r.flags.runs || []).some(x => x.startsWith('Server A:kg'))}, {t: 'Test A\'s original GPU in golden Server B', when: r => (r.flags.runs || []).some(x => x.startsWith('Server B:orig'))}, {t: 'It stayed with the slot: inspect the slot path', when: r => r.flags.inspected}, {t: 'Fix the slot path, restore both servers, retest both', when: r => !r.flags.slotBad && r.flags.A === 'orig' && r.flags.B === 'bgpu' && r.flags.lastA === 'PASS' && r.flags.lastB === 'PASS'}],
  actions: [
    {id: 'kgA', node: ['kg', 'srvA'], kind: 'swap', label: 'Put the known-good GPU in Server A (original GPU aside, labelled)', do: r => { r.flags.A = 'kg'; r.flags.lastA = null; return 'Known-good GPU sn ...1323 in Server A\'s slot. A\'s original GPU bagged and labelled.'; }},
    {id: 'origB', node: ['part', 'srvB'], kind: 'swap', label: 'Put A\'s original GPU into golden Server B (B\'s own GPU aside)', do: r => { r.flags.B = 'orig'; r.flags.lastB = null; return 'A\'s original GPU now in Server B.'; }},
    {id: 'inspect', node: 'srvA', kind: 'look', label: 'Inspect Server A\'s slot, riser and riser cable', do: r => { r.flags.inspected = true; return r.flags.slotBad ? L('e', 'Server A\'s riser cable has a kinked section where it was pinched by the lid.') : 'Riser and cable good.'; }},
    {id: 'cable', node: 'srvA', kind: 'fix', label: 'Replace Server A\'s riser cable', do: r => { r.flags.slotBad = false; return L('g', 'New riser cable fitted and routed clear of the lid.'); }},
    {id: 'restore', node: ['srvA', 'srvB'], kind: 'move', label: 'Restore both servers: original GPU back in A, B\'s own GPU back in B', do: r => { r.flags.A = 'orig'; r.flags.B = 'bgpu'; r.flags.lastA = r.flags.lastB = null; return 'Both servers back to their original parts. Retest both.'; }}
  ],
  demo: ['#kgA', '#origB', '#inspect', '#cable', '#restore'],
  hint: ['Technique: move the suspect part to a working slot or system, or put a known-good part in the suspect location. Change one thing.', 'Follows the part → the part is bad. Stays with the location → slot, cable, riser or board.', 'Risks: a bad slot or power problem can damage the known-good part; it does not prove the original system healthy; ESD and handling; losing track of which part is which (serials); the "known-good" part might not be; an intermittent fault may not show in a short test; disturbing a working golden unit — restore and retest it.'],
  answer: `<p><b>The technique:</b> to tell a bad part from a bad location, change one thing — <b>move the suspect part</b> into a known-good slot or system, <b>or put a known-good part</b> into the suspect location — and retest.</p><ul><li><b>Problem follows the part</b> → the part is bad (very likely).</li><li><b>Problem stays with the slot/location</b> → suspect the <b>slot, cable, riser, or board</b>, not the part. (In this lab a known-good GPU still failed in Server A — the riser cable was kinked.)</li></ul><p><b>Risks:</b></p><ul><li>A bad slot or power problem can <b>damage the known-good part</b> you put into it.</li><li>A failure that follows the part <b>does not prove the original system is healthy</b> — it may have damaged the part.</li><li><b>ESD and handling damage</b>; always use a strap and hold parts by the edges.</li><li><b>Mixing up parts</b>: label everything and record serials.</li><li>The "known-good" part must really be known-good; an <b>intermittent</b> fault may not show in a short test — run enough cycles.</li><li>You disturb a working <b>golden unit</b>: return it to its original state and retest it.</li><li>Changing more than one thing per swap hides the answer.</li></ul>`,
  keys: [K('move suspect / known-good in', 'known.?good|move'), K('follows the part → part bad', 'follow'), K('stays with slot → slot/cable/riser/board', 'stay|slot|riser|board'), K('can damage known-good part', 'damag'), K('original system not proven', 'not prove|healthy'), K('ESD / handling', 'ESD|static|handl'), K('labels / serials', 'label|serial|mix'), K('intermittent / enough cycles', 'intermittent|cycle'), K('restore golden unit', 'restore|original state|retest'), K('one change', 'one (change|thing|variable)')]
});

M({n: 29, set: 'B', topic: 'A failure you have never seen', reread: ['m10'],
  q: 'You are given a failure you have never seen before, with an error message you do not recognize. Describe your approach, including when and how you would escalate.',
  brief: '<p>The NIC driver is printing a message nobody on shift recognises. Stay calm, collect, read, search, break it into layers, test one theory — and escalate <b>with data</b>.</p>',
  rig: () => { const r = baseRig(); r.devs.nic0.fw = '22.36.1010'; ['07:12:02', '07:58:44', '09:20:13'].forEach(t2 => { kx(r, t2, 'err', 'mlx5_core 0000:3b:00.0: mlx5_health_try_recover:  health compromised - reached miss count'); kx(r, t2, 'warn', 'mlx5_core 0000:3b:00.0: print_health_info: assert_var[0] 0x00000000 assert_exit_ptr 0x00a3f1c0 ext_synd 0x8f01'); kx(r, t2, 'info', 'mlx5_core 0000:3b:00.0 ens1f0: Link down'); kx(r, t2, 'info', 'mlx5_core 0000:3b:00.0 ens1f0: Link up'); }); return refresh(r); },
  topo: r => topoNetwork(r),
  chips: ['dmesg | grep -i mlx5', 'dmesg | grep -i mlx5 > mlx5_errors.txt', 'journalctl -k -p err', 'sudo ipmitool sel elist', 'ethtool -i ens1f0', 'ip a show ens1f0'],
  tasks: [{t: 'Write down the exact message: save it to a file', cmd: /dmesg.*>\s*\S+|journalctl.*>\s*\S+/}, {t: 'Gather the other logs (journal, SEL)', cmd: /journalctl|ipmitool.*sel/}, {t: 'Versions: driver and firmware', cmd: /ethtool\s+-i/}, {t: 'Break it into layers (link, IP)', cmd: /^ip\s+(a|addr)|ethtool\s+ens1f0$/}, {t: 'Read the service guide', when: r => r.flags.guide}, {t: 'Search the exact error message', when: r => r.flags.kb}, {t: 'Escalate with your data', when: r => r.flags.esc}],
  actions: [
    {id: 'guide', kind: 'doc', label: 'Read the NIC section of the service guide', do: r => { r.flags.guide = true; return 'Service guide: "NIC health errors → collect dmesg, firmware version and BMC log; confirm firmware matches the approved list."'; }},
    {id: 'kb', kind: 'doc', label: 'Search the knowledge base for the exact message "health compromised - reached miss count"', do: r => { r.flags.kb = true; return say('KB-2213: "mlx5 health compromised - reached miss count" — firmware 22.36.x known issue under heavy traffic, fixed in 22.39.1002 (approved).', L('w', 'This unit runs 22.36.1010 — a theory to test, not a fix to apply blindly.')); }},
    {id: 'esc', kind: 'ask', label: 'Escalate to the lead / engineering', do: r => { const have = r.ran.some(x => /dmesg.*>|journalctl.*>/.test(x)) && r.ran.some(x => /ethtool\s+-i/.test(x)) && r.ran.some(x => /sel/.test(x)); if (!have) return say(L('w', 'Lead: "What exactly does it say, how often, which firmware, anything in the BMC log? Come back with that."'), L('d', 'Escalate with data: saved message, timestamps, versions, SEL, what you tried.')); r.flags.esc = true; return L('g', 'Escalated with: saved messages (3 events today), firmware 22.36.1010 vs approved 22.39.1002, SEL clean, KB-2213 match. Engineering approves the firmware update; you will verify and document.'); }}
  ],
  hint: ['Stay calm and do not guess.', 'Write down the exact symptoms and messages; gather logs (dmesg, journal, SEL); note serials and versions.', 'Read the service guide and documentation; search the exact error message.', 'Break the problem into layers; test one theory at a time.', 'Escalate with your data when stuck (or when a fix needs approval); document what you learn.'],
  answer: `<ol><li><b>Stay calm and do not guess.</b></li><li><b>Write down the exact symptoms and messages</b> — copy the message word for word and save it (<code>dmesg | grep -i mlx5 > mlx5_errors.txt</code>), with timestamps and how often it happens.</li><li><b>Gather logs</b>: dmesg, the journal, the BMC SEL; note serial numbers, firmware and driver versions (<code>ethtool -i</code>).</li><li><b>Read the service guide and documentation</b>, and <b>search the exact error message</b> (knowledge base, vendor notes).</li><li><b>Break the problem into layers</b> (physical, bus, driver, function; link, IP, gateway) to see which part is affected.</li><li><b>Test one theory at a time</b>.</li><li><b>Escalate</b> when you are stuck, when the fix is outside your authority (a firmware change, a design issue), or when it affects other units — and escalate <b>with your data</b>: the exact message, timestamps and frequency, logs, versions, what you checked and what you ruled out.</li><li><b>Document what you learn</b> so the next person recognises it.</li></ol>`,
  keys: [K('stay calm / do not guess', 'calm|guess'), K('exact message written down', 'exact|write|word'), K('gather logs', 'log|dmesg|journal|SEL'), K('versions / serials', 'version|serial|firmware'), K('service guide / documentation', 'service guide|documentation|manual'), K('search the message', 'search'), K('layers', 'layer'), K('one theory at a time', 'one (theory|change|thing)'), K('escalate', 'escalat'), K('with data', 'data|evidence'), K('document', 'document')]
});

M({n: 30, set: 'B', topic: 'Evidence before a hard reset', reread: ['m8'], start: 'laptop',
  q: 'A server’s operating system is hung, and you are asked to hard reset it right away. What would you capture first, where would you get it, and why is it worth the time?',
  brief: '<p>The OS is hung and the customer wants it back <i>now</i>. Take two minutes to capture the evidence through the BMC first. Save files on your laptop.</p>',
  rig: () => { const r = baseRig(); ['09:35:12', '09:35:40'].forEach((t2, i) => kx(r, t2, i ? 'err' : 'warn', i ? 'INFO: task kworker/u512:3:4410 blocked for more than 122 seconds.' : 'nvme nvme1: I/O 98 QID 31 timeout, aborting')); refresh(r); r.os.state = 'hung'; r.consoleTail = ['[1638812.004233] nvme nvme1: I/O 98 QID 31 timeout, aborting', L('e', '[1638840.104410] INFO: task kworker/u512:3:4410 blocked for more than 122 seconds.'), '[1638840.104488] "echo 0 > /proc/sys/kernel/hung_task_timeout_secs" disables this message.']; sel(r, '09:35:41', 'Drive Slot 1 #0x61', 'Drive Fault', 'e'); return r; },
  topo: r => topoOob(r),
  chips: [LAPTOP_BMC + ' sol activate', LAPTOP_BMC + ' sel elist > sel_before_reset.txt', LAPTOP_BMC + ' sensor > sensors_before_reset.txt', LAPTOP_BMC + ' power status', LAPTOP_BMC + ' power cycle'],
  tasks: [{t: 'Console: what is on the screen right now?', cmd: /sol activate/}, {t: 'Save the BMC event log to a file', cmd: /ipmitool.*sel.*>\s*\S+/}, {t: 'Save the sensors to a file', cmd: /ipmitool.*(sensor|sdr).*>\s*\S+/}, {t: 'Check power state and health', cmd: /ipmitool.*(power status|chassis status)/}, {t: 'Now reset it', cmd: /ipmitool.*power (cycle|reset)/}, {t: 'After boot: read the previous boot', cmd: /journalctl.*-b\s+-1/, ok: r => r.journal.prevBoots.length > 0}],
  hint: ['Where: everything comes from the <b>BMC</b>, because the OS is hung (no SSH).', 'What: the <b>console</b> (SOL or virtual console — panic? hung-task messages? screenshot it), the <b>SEL</b>, <b>sensors</b>, health and power state. Save them to files. If engineering wants it: an <b>NMI</b> for a crash dump.', 'Then power cycle, and read <code>journalctl -b -1</code> after boot.', 'Why: a reset wipes the screen and the kernel buffer; without evidence you cannot find the root cause, it will happen again, and an RMA or escalation has nothing to go on.'],
  answer: `<p><b>Capture first (through the BMC, because the OS cannot answer):</b></p><ol><li>The <b>console</b> — SOL (<code>ipmitool sol activate</code>) or the virtual console (KVM): is there a kernel panic or hung-task message? <b>Screenshot</b> or copy it.</li><li>The <b>System Event Log</b> — <code>ipmitool sel elist</code> — saved to a file.</li><li>The <b>sensors</b> — temperatures, fans, PSUs, power — saved to a file; and the health/power state.</li><li>If engineering needs it, send an <b>NMI</b> (<code>ipmitool power diag</code>) to force a crash dump.</li></ol><p>Then power cycle, and after boot read <code>journalctl -b -1</code> (and <code>dmesg</code> of the new boot) to see what led up to the hang.</p><p><b>Why it is worth the time:</b> a hard reset <b>destroys the evidence</b> — the screen, the kernel ring buffer, the hung state. Two minutes of capture is the difference between finding the <b>root cause</b> (here: a drive fault on Slot 1 at the same moment) and having it happen again with nothing learned. It also supports escalation, RMA, and documentation.</p>`,
  keys: [K('BMC', 'BMC|ipmitool|out.?of.?band'), K('console / screenshot', 'console|screenshot|SOL|KVM'), K('panic / message on screen', 'panic|message'), K('SEL', 'SEL|event log'), K('sensors', 'sensor'), K('save logs', 'save|file'), K('NMI / crash dump', 'NMI|crash dump'), K('journalctl -b -1 after', '-b -1|journalctl'), K('reset destroys evidence', 'lost|destroy|wipe|gone'), K('root cause / happen again', 'root cause|again|recur')]
});

M({n: 31, set: 'B', topic: 'Downtrained NVMe link', reread: ['m4', 'm6'],
  q: 'An NVMe drive shows LnkSta: Speed 8GT/s, Width x2 while its LnkCap shows Speed 16GT/s, Width x4 . The drive works but is slow. How would you investigate?',
  brief: '<p>Bay 2\'s drive is slow. Confirm the downtrained link, check for errors and health, then isolate by moving the drive — and believe what the swap tells you.</p>',
  rig: () => { const r = baseRig(); const d = r.devs.nvme2; d.sta = {gt: 8, w: 2}; d.aer = 31; r.flags.driveBad = true; ['04:02:11', '06:15:40', '08:44:03'].forEach(t2 => kx(r, t2, 'warn', 'pcieport 0000:80:05.0: AER: Corrected error received: 0000:a5:00.0')); return refresh(r); },
  topo: r => topoStorage(r),
  chips: ['sudo nvme list', 'sudo lspci -vv -s a5:00.0 | grep -i lnk', 'dmesg | grep -i aer', 'sudo nvme smart-log /dev/nvme2', 'sudo ipmitool sel elist'],
  tasks: [{t: 'Confirm LnkCap vs LnkSta', cmd: /lspci.*-vv/}, {t: 'Errors on the port above the drive', cmd: /dmesg.*aer/i}, {t: 'Drive health and firmware', cmd: /smart-log|nvme list/}, {t: 'Simple physical check: reseat', when: r => r.flags.reseated}, {t: 'Isolate: move the drive to another bay and re-check the link', cmd: /lspci.*-vv/, ok: r => r.devs.nvme2.bay === 5}, {t: 'Act on the result and verify Gen 4 x4', cmd: /lspci.*-vv/, ok: r => !r.flags.driveBad && r.devs.nvme2.sta.w === 4}],
  actions: [
    {id: 'reseat', node: 'dev:nvme2', kind: 'look', label: 'Reseat the drive in Bay 2', reboot: 'cycle', do: r => { r.flags.reseated = true; return 'Drive reseated, latch closed. Powering on to retrain the link.'; }},
    {id: 'move', node: 'dev:nvme2', kind: 'move', label: 'Move the drive to empty Bay 5', reboot: 'cycle', do: r => { const d = r.devs.nvme2; d.bay = 5; r.nvmeInfo.nvme2.bay = 5; d.label = 'NVMe Bay 5'; r.flags.bayMoved = {nvme2: 5}; return 'Drive serial S6CKNA0W412384 moved to Bay 5. Powering on.'; }},
    {id: 'replace', node: 'dev:nvme2', kind: 'fix', label: 'Replace the drive (RMA the old one), back in Bay 2', reboot: 'cycle', do: r => { const d = r.devs.nvme2; r.flags.driveBad = false; d.sta = {gt: 16, w: 4}; d.aer = 0; d.bay = 2; r.nvmeInfo.nvme2.bay = 2; d.label = 'NVMe Bay 2'; r.nvmeInfo.nvme2.sn = 'S6CKNA0W498812'; r.dmesgExtra = []; r.flags.bayMoved = {nvme2: 2}; return 'New drive S6CKNA0W498812 in Bay 2; old drive tagged for RMA.'; }}
  ],
  hint: ['It is downtrained: half the speed and half the width = a quarter of the bandwidth (about 2 GB/s vs 8 GB/s).', 'Check AER errors on the port above the drive (match the address), drive health (smart-log), firmware of drive/backplane/BIOS.', 'Physical: seating, backplane connector, cable; then move the drive to another bay. Follows the drive → drive. Stays with the bay → bay, backplane or cable.', 'One change at a time; verify LnkSta; document.'],
  answer: `<p>The link is <b>downtrained</b>: LnkCap 16 GT/s x4 (Gen 4 x4, about 8 GB/s) but LnkSta 8 GT/s x2 (Gen 3 x2, about 2 GB/s) — a quarter of the bandwidth. It works, but slowly.</p><ol><li><b>Confirm and record</b>: <code>sudo lspci -vv -s a5:00.0</code> (LnkCap vs LnkSta), drive serial and firmware (<code>nvme list</code>).</li><li><b>Errors</b>: AER messages in <code>dmesg</code> for the port above the drive — a steady stream of corrected errors points to a signal problem. Check the BMC SEL.</li><li><b>Health</b>: <code>nvme smart-log</code> (temperature, media errors, warnings).</li><li><b>Firmware</b>: drive, backplane, BIOS; BIOS link-speed or bifurcation settings.</li><li><b>Physical</b>, one change at a time: reseat the drive, check the backplane connector and cable (or retimer).</li><li><b>Isolate</b>: move the drive to another bay and re-check LnkSta. <b>Follows the drive</b> → the drive (here: still Gen 3 x2 in Bay 5 → replace and RMA it). <b>Stays with the bay</b> → bay, backplane, or cable.</li><li><b>Verify</b> LnkSta = LnkCap and no new AER errors; run a load test; <b>document</b>.</li></ol>`,
  keys: [K('downtrained', 'downtrain|downgrad'), K('bandwidth lost', 'quarter|GB/s|slow|bandwidth'), K('lspci -vv', 'lspci'), K('AER / corrected errors', 'AER|corrected'), K('smart-log / health', 'smart|health'), K('firmware / BIOS', 'firmware|BIOS'), K('seating / connector / cable', 'seat|connector|cable|backplane'), K('move to another bay', 'bay|move'), K('follows the drive / stays', 'follow|stay'), K('verify / document', 'verif|document')]
});

M({n: 32, set: 'B', topic: 'IP works but name fails, and the reverse', reread: ['m7'],
  q: 'Compare these two cases: (a) ping 10.4.2.15 works but ping db01 fails with “Name or service not known”; (b) ping db01 resolves to 10.4.2.15 but gets no replies. What does each result point to, and what would you check in each case?',
  brief: '<p>The lab starts in case (a). Diagnose it, then flip the what-if switch to case (b) and diagnose that.</p>',
  rig: () => { const r = baseRig(); r.flags.resolvStatic = true; r.files['/etc/resolv.conf'] = 'search lab.local\nnameserver 10.20.5.5\n'; r.net.hosts['10.20.5.5'].dns = Object.assign({}, r.net.hosts['10.20.5.5'].dns); delete r.net.hosts['10.20.5.5'].dns.db01; delete r.net.hosts['10.20.5.5'].dns['db01.lab.local']; r.flags.caseA = true; return r; },
  topo: r => topoNetwork(r),
  chips: ['ping -c 2 10.4.2.15', 'ping -c 2 db01', 'cat /etc/resolv.conf', 'cat /etc/hosts', 'nslookup db01', 'ping -c 2 10.20.5.1', 'traceroute db01', 'ssh db01'],
  tasks: [{t: '(a) Ping by IP', cmd: /ping.*10\.4\.2\.15/}, {t: '(a) Ping by name', cmd: /ping.*db01/}, {t: '(a) Check the name-resolution chain', cmd: /resolv\.conf|\/etc\/hosts|nslookup|dig/}, {t: 'Switch to case (b)', when: r => r.flags.caseB}, {t: '(b) Ping by name: resolves, no reply', cmd: /ping.*db01/, ok: r => r.flags.caseB}, {t: '(b) Is the gateway reachable?', cmd: /ping.*10\.20\.5\.1\b/, ok: r => r.flags.caseB}, {t: '(b) Where does the path stop?', cmd: /traceroute/, ok: r => r.flags.caseB}],
  actions: [{id: 'b', kind: 'whatif', label: 'Switch to case (b): DNS fixed, db01 itself not answering', do: r => { r.flags.caseB = true; r.net.hosts['10.20.5.5'].dns.db01 = '10.4.2.15'; r.net.hosts['10.20.5.5'].dns['db01.lab.local'] = '10.4.2.15'; r.net.hosts['10.4.2.15'].up = false; return 'Case (b): the DNS record exists again, but db01 (10.4.2.15) is down.'; }}],
  hint: ['(a) The IP works, so the network is fine: the problem is <b>name resolution</b>. Check /etc/resolv.conf, whether the DNS server is reachable, <code>nslookup</code>/<code>dig</code>, /etc/hosts, the full name (FQDN).', '(b) The name resolved, so DNS is fine: the problem is <b>reaching the host</b>. Check the gateway (<code>ip route</code>, ping it), <code>traceroute</code>, whether db01 is up, firewalls blocking ping, the service, and test from another machine.'],
  answer: `<p><b>(a) IP works, name fails</b> → the network and routing are fine; the problem is <b>name resolution (DNS)</b>. Check: <code>/etc/resolv.conf</code> (right DNS server?), whether that DNS server is reachable, <code>nslookup db01</code> / <code>dig db01</code> (in this lab: NXDOMAIN — no A record), wrong entries in <code>/etc/hosts</code>, and whether you need the full name (FQDN, db01.lab.local).</p><p><b>(b) Name resolves, no replies</b> → DNS is fine; the problem is <b>reaching that host</b> — lower down, or the host itself. Check: <code>ip route</code> and ping the <b>gateway</b>; ping beyond it and <code>traceroute db01</code> to see where it stops; whether db01 is <b>up</b> (its console/BMC, or ask its owner); a <b>firewall</b> blocking ping; the service itself (try <code>ssh db01</code> or the port); and test from another machine. Document both.</p>`,
  keys: [K('(a) name resolution / DNS', 'name resolution|DNS'), K('(a) network is fine', 'network (is )?fine|IP works'), K('resolv.conf', 'resolv'), K('DNS server reachable', 'reachab'), K('nslookup / dig', 'nslookup|dig'), K('/etc/hosts', 'hosts'), K('FQDN', 'FQDN|full name'), K('(b) host reachability / lower', 'host|lower|reach'), K('gateway / ip route', 'gateway|route'), K('traceroute', 'traceroute'), K('host down', 'down|up\\b'), K('firewall', 'firewall')]
});

M({n: 33, set: 'B', topic: 'All devices on CPU 2 missing', reread: ['m1', 'm4'],
  q: 'In a dual-socket server, every PCIe device connected to CPU 2 is missing, while everything on CPU 1 works. What could cause this, and how would you narrow it down?',
  brief: '<p>Everything wired to CPU 2 has vanished. Before touching any card, ask: is CPU 2 itself even alive?</p>',
  rig: () => { const r = baseRig(); r.cpus[1].ok = false; r.flags.cpuLoose = true; sel(r, '08:12:01', 'Processor CPU2 #0x02', 'Configuration Error — CPU 2 not responding at POST', 'e'); r.hooks.onBoot = rr => { rr.cpus[1].ok = !rr.flags.cpuLoose; }; return refresh(r); },
  topo: r => topoPcie(r),
  chips: ['lspci -tv', 'lscpu | grep -i socket', 'free -h', 'sudo ipmitool sel elist', 'nvidia-smi'],
  tasks: [{t: 'What is missing in the tree?', cmd: /lspci.*-t/}, {t: 'Does Linux see CPU 2 at all?', cmd: /lscpu/}, {t: 'And CPU 2\'s memory?', cmd: /free|dmidecode/}, {t: 'What did the BMC log at POST?', cmd: /ipmitool.*sel/}, {t: 'Hands on: CPU 2', when: r => r.flags.looked}, {t: 'Fix and verify CPU 2, its memory and its devices', cmd: /lscpu|lspci|free/, ok: r => r.cpus[1].ok}],
  actions: [
    {id: 'riser', node: 'rt:rt2', kind: 'swap', label: 'Replace Riser 2', do: () => say(L('w', 'Nothing changes.'), L('d', 'The NVMe drives on CPU 2 are not on Riser 2 and they are missing too — the common part is CPU 2 itself.'))},
    {id: 'look', node: 'cpu2', kind: 'look', label: 'Power off, ESD strap: inspect CPU 2 heatsink, seating and socket', do: r => { r.flags.looked = true; return r.flags.cpuLoose ? say(L('e', 'CPU 2\'s heatsink screws were not torqued in sequence: one corner is loose, so the CPU is not evenly seated.'), 'Socket pins under a light: straight, no bent pins.') : 'CPU 2 seated, heatsink torqued.'; }},
    {id: 'reseat', node: 'cpu2', kind: 'fix', label: 'Reseat CPU 2 and torque the heatsink in the correct sequence', reboot: 'cycle', do: r => { r.flags.cpuLoose = false; return 'Reseated and torqued in the cross pattern. Powering on (memory training may take a few minutes).'; }}
  ],
  hint: ['Each slot belongs to one CPU: if CPU 2 has a problem, all its devices disappear — suspect the shared part (CPU 2), not each device.', 'Narrow down: is CPU 2 seen at all (<code>lscpu</code> sockets, BMC inventory, SEL)? Is CPU 2\'s memory present (<code>free -h</code>, <code>dmidecode</code>)?', 'Causes: CPU 2 seating, bent socket pins, overheating, a failed CPU, a BIOS setting, or (if only some devices) shared risers/cables.', 'Physical with ESD; swap CPUs to see if the fault follows; minimum configuration; document.'],
  answer: `<p>Each PCIe slot belongs to one CPU's root complex, so when <b>every</b> device on CPU 2 is missing, suspect the <b>shared part — CPU 2 and its connection</b> — not each device.</p><p><b>Possible causes:</b> CPU 2 <b>poorly seated</b> (uneven heatsink torque), <b>bent socket pins</b>, <b>overheating</b>, a failed CPU; a <b>BIOS</b> setting; or (if only some of its devices) a shared riser or cable.</p><p><b>Narrowing down:</b></p><ol><li><b>Is CPU 2 seen at all?</b> <code>lscpu</code> (Socket(s)), BMC inventory, and the <b>SEL</b> for processor errors at POST.</li><li><b>Is its memory there?</b> <code>free -h</code> / <code>dmidecode -t memory</code>: if CPU 2's DIMMs are missing too, it is CPU 2 itself, not its PCIe path. (In this lab: 1 socket, half the memory, SEL "CPU 2 not responding".)</li><li><b>Compare the tree with the diagram</b> (<code>lspci -tv</code>): the whole CPU 2 root is gone.</li><li><b>Physical</b>, powered off with ESD protection: CPU 2 seating, heatsink torque sequence, socket pins.</li><li><b>Isolate</b>: swap the CPUs (does the fault follow the CPU?), or minimum configuration.</li><li><b>Verify</b> (2 sockets, all memory, all devices, stress test) and <b>document</b>.</li></ol>`,
  keys: [K('each slot belongs to one CPU', 'belong|root complex|each CPU|owns'), K('shared part, not each device', 'shared|common|not each'), K('seating / torque', 'seat|torque'), K('bent pins', 'pin'), K('overheating', 'overheat|heat|temp'), K('BIOS', 'BIOS'), K('lscpu / sockets', 'lscpu|socket'), K('memory on CPU 2', 'memory|free|dmidecode|DIMM'), K('SEL / BMC', 'SEL|BMC'), K('swap CPUs / minimum config', 'swap|minimum')]
});

M({n: 34, set: 'B', topic: 'Memory shows less than installed', reread: ['m5', 'm11'],
  q: 'A server should have 1 TB of memory, but free -h shows about 960 GB. How would you find what is missing and why?',
  brief: '<p>1 TB expected (16 × 64 GB), about 960 GB seen. One 64 GB DIMM is unaccounted for. Find which slot and why.</p>',
  rig: () => { const r = baseRig(); r.dimms.find(d => d.loc === 'F1').seated = false; r.flags.f1 = true; r.hooks.onBoot = rr => { rr.dimms.find(d => d.loc === 'F1').seated = !rr.flags.f1; }; return refresh(r); },
  topo: r => topoMemory(r),
  chips: ['free -h', 'sudo dmidecode -t memory | grep -i -B3 -A3 "no module"', 'sudo ipmitool sel elist', 'cat notes.txt'],
  tasks: [{t: 'Confirm the total', cmd: /^free/}, {t: 'Find the slot that reports no module', cmd: /dmidecode/}, {t: 'Check the BMC log for memory errors', cmd: /ipmitool.*sel/}, {t: 'Hands on: the empty-looking slot', when: r => r.flags.looked}, {t: 'Fix and verify 1 TB', cmd: /^free|dmidecode/, ok: r => !r.flags.f1}],
