        t.say('2. Offer: the DHCP server offers an address and settings.', 'O'); await t.go('dhcp', 'srv', {c: 'ok', tag: 'OFFER 10.20.5.14'});
        t.say('3. Request: the client asks to use that offer (broadcast, so other servers know).', 'R'); await t.bcast('srv', ['dhcp', 'dns', 'gw', 'laptop'], {c: 'acc', tag: 'REQUEST'});
        t.say('4. Acknowledge: the server confirms; the client configures IP, mask, gateway, DNS and lease time.', 'A'); await t.go('dhcp', 'srv', {c: 'ok', tag: 'ACK'});
        t.sub('srv', '10.20.5.14/24 · dynamic'); t.set('srv', 'good'); await t.wait(1500);
      }},
      {name: 'DNS lookup', run: async t => {
        t.say('ssh db01: Linux checks /etc/hosts first (no entry), then asks the DNS server from /etc/resolv.conf.', 'DNS'); await t.pulse('srv', 'vi'); await t.wait(500);
        await t.go('srv', 'dns', {c: 'vi', tag: 'A db01?'}); t.say('The DNS server answers from its A record (name → IPv4). The answer is cached.', 'DNS'); await t.go('dns', 'srv', {c: 'ok', tag: '10.4.2.15'});
        t.say('Now the real traffic goes to 10.4.2.15 — another subnet, so through the gateway.', 'DNS'); await t.go('srv', 'db01', {c: 'acc', tag: 'ssh :22'}); await t.go('db01', 'srv', {c: 'ok', tag: 'reply'}); await t.wait(1000);
      }},
      {name: 'No link (bottom layer)', bad: true, run: async t => {
        t.setLink('srv', 'sw', 'down'); t.set('srv', 'bad', 'NO-CARRIER'); t.say('Cable unplugged: ip a shows NO-CARRIER, ethtool says "Link detected: no". Every layer above fails too.', 'L1');
        await t.go('srv', 'gw', {c: 'acc', tag: 'ping gw'}); await t.go('srv', 'dns', {c: 'vi', tag: 'DNS?'}); t.say('So start at the bottom: link lights, cable, transceiver, switch port.', 'L1'); await t.wait(1800);
      }},
      {name: 'IP works, name fails', bad: true, run: async t => {
        t.say('ping 10.4.2.15 works…', 'DNS'); await t.go('srv', 'db01', {c: 'ok', tag: 'ICMP'}); await t.go('db01', 'srv', {c: 'ok', tag: 'reply'});
        t.set('dns', 'bad', 'wrong server in resolv.conf'); t.say('…but ping db01 says "Name or service not known". The network is fine; the problem is name resolution.', 'DNS'); await t.go('srv', 'dns', {c: 'vi', tag: 'A db01?', failAt: 'dns', force: true}); await t.wait(1800);
      }}
    ],
    sync: (t, r) => {
      if (!r || !r.ifaces) return;
      const i = upIfaces(r).find(x => x.name === (r.flags.focusIf || 'ens1f0')) || upIfaces(r)[0];
      if (!i) { t.set('srv', 'bad', 'no interface'); t.setLink('srv', 'sw', 'down'); return; }
      t.label('srv', r.host); t.sub('srv', `${i.name} · ${i.ip ? i.ip + '/' + i.prefix : 'no IP'}${i.mtu !== 1500 ? ' · mtu ' + i.mtu : ''}`);
      if (r.os.state !== 'up') t.set('srv', 'bad', 'OS not running');
      else if (!i.admin) { t.set('srv', 'warn', i.name + ' is DOWN (admin)'); t.setLink('srv', 'sw', 'off'); }
      else if (!i.carrier) { t.set('srv', 'bad', i.name + ' NO-CARRIER'); t.setLink('srv', 'sw', 'down'); }
      else if (!i.ip) t.set('srv', 'warn', i.name + ' · no IP address');
      else if (i.ip.startsWith('169.254.')) t.set('srv', 'warn', i.ip + ' · DHCP failed');
      const port = r.net.ports[i.name] || {};
      if (port.vlanOk === false) { t.set('sw', 'warn', 'port in wrong VLAN'); }
      if (i.mtu > (port.mtu || 1500)) { t.setLink('srv', 'sw', 'slow'); t.linkLabel('srv', 'sw', `MTU ${i.mtu} ↔ switch ${port.mtu}`); }
      if (!r.net.dhcp.ok) t.set('dhcp', 'off', 'not answering');
      const rc = parseResolv(r); const ns = rc.ns[0];
      if (ns && ns !== '10.20.5.5') t.set('dns', 'warn', 'resolv.conf → ' + ns);
      const db = r.net.hosts['10.4.2.15']; if (db && !db.up) t.set('db01', 'bad', 'down'); else if (db && db.icmp === false) t.set('db01', 'warn', 'firewall drops ICMP');
      const gw = r.net.hosts[r.net.gw]; if (gw && !gw.up) t.set('gw', 'bad', 'down');
      if (t.nodes.bmc && r.bmc && !r.bmc.up) t.set('bmc', 'bad', 'unreachable');
    },
    dora: async (t, k, r) => {
      const all = ['dhcp', 'dns', 'gw', 'laptop'];
      if (k === 'D') { t.say('DISCOVER: broadcast to 255.255.255.255 — "I need an address."', 'D'); await t.bcast('srv', all, {c: 'acc', tag: 'DISCOVER', force: false}); }
      if (k === 'O') { t.say('OFFER: the DHCP server offers an address and settings.', 'O'); await t.go('dhcp', 'srv', {c: 'ok', tag: 'OFFER'}); }
      if (k === 'R') { t.say('REQUEST: broadcast — "I accept that offer."', 'R'); await t.bcast('srv', all, {c: 'acc', tag: 'REQUEST'}); }
      if (k === 'A') { t.say('ACK: confirmed. IP, mask, gateway, DNS and lease time are now set.', 'A'); await t.go('dhcp', 'srv', {c: 'ok', tag: 'ACK'}); }
    },
    anim: async (t, line, res, r) => {
      const evs = (res && res.evs) || [];
      const ne = evs.find(e => e.net) || (res && res.net ? res : null);
      if (ne) { await netFlow(t, r, ne, curCtx(r) === 'laptop' && !/^ssh/.test(line) ? 'laptop' : (ne.net.from === 'laptop' ? 'laptop' : 'srv')); return; }
      if (/^(sudo )?ip (a|addr|link)|ifconfig/.test(line)) { t.say('ip a: interface name, flags (UP, LOWER_UP or NO-CARRIER), MTU, MAC, IPv4 address/prefix, broadcast, and dynamic (DHCP) or forever (static).', 'IP'); await t.pulse('srv', 'acc'); }
      else if (/ip route/.test(line)) { t.say('ip route shows the default gateway.', 'ROUTE'); await t.go('srv', 'gw', {c: 'acc', tag: 'default via'}); }
      else if (/ip neigh/.test(line)) { t.say('ip neigh shows ARP: has the server learned the gateway\'s MAC address?', 'ARP'); r.flags.arpTried = true; await t.go('srv', 'gw', {c: 'vi', tag: 'ARP who-has'}); }
      else if (/ethtool/.test(line)) { t.say('ethtool: link speed and "Link detected".', 'L1'); await t.pulse('srv', 'acc'); await t.pulse('sw', 'acc'); }
      else if (/resolv\.conf|\/etc\/hosts/.test(line)) { await t.pulse('srv', 'vi'); }
      else if (/ipmitool/.test(line) && t.nodes.bmc) { await t.go('laptop', 'bmc', {c: 'vi', tag: 'IPMI'}); }
    }
  };
}

const BOOT_STAGES = [['1', 'Power + BMC', 'PSUs power the board', 'no lights, immediate shutoff, amber LED'], ['2', 'POST', 'CPUs, memory training, PCIe', 'stuck POST code, beep codes, memory errors'], ['3', 'UEFI / BIOS', 'find a boot device', '"No bootable device", PXE loop'], ['4', 'Bootloader', 'GRUB loads the OS', 'grub rescue>, file not found'], ['5', 'Kernel', 'drivers + root filesystem', 'kernel panic, unable to mount root fs'], ['6', 'System startup', 'mounts, services', 'emergency mode (often /etc/fstab or a failing disk)'], ['7', 'Login prompt', 'ready', '']];

  const links = BOOT_STAGES.slice(1).map((s, i) => Lk('st' + (i + 1), 'st' + (i + 2), 'flow'));
  const texts = BOOT_STAGES.slice(0, 6).map(([n, , , fail], i) => ({id: 'f' + n, x: 70 + i * 126, y: 168, text: '', anchor: 'middle', cls: 'bad'}));
  nodes.push(N('look', 440, 225, 'Where to look', 'BMC virtual console · SOL · monitor · SEL', 'box', 380, 46, {center: true}));
  const info = Object.fromEntries(BOOT_STAGES.map(([n, lab, sub, fail]) => ['st' + n, `<b>${n}. ${lab}</b>: ${sub}. ${fail ? 'Failure looks like: ' + fail + '.' : 'Success: a login prompt.'}`]));
  info.look = 'Watch the console (BMC virtual console, SOL, or monitor) and note exactly where it stops. Fans and lights only prove that power is on.';
  const runTo = async (t, stop, msg) => {
    for (let i = 1; i <= 7; i++) {
      if (i === stop) { t.set('st' + i, 'bad'); t.text('f' + i, 'stops here'); t.say(msg, 'STUCK'); await t.pulse('st' + i, 'bad'); return; }
      t.set('st' + i, 'good'); await t.pulse('st' + i, 'ok');
      if (i < 7) await t.flow(['st' + i, 'st' + (i + 1)], {c: 'ok', pulse: false});
    }
  };
  return {
    title: 'Booting is a chain — find the link that broke', w: 900, h: 260, nodes, links, texts, info,
    scenes: [
      {name: 'Healthy boot', run: async t => { t.say('Each stage hands over to the next. A login prompt means the whole chain worked.', 'BOOT'); await runTo(t, 99); await t.wait(1200); }},
      {name: 'Stuck in POST', bad: true, run: async t => { await runTo(t, 2, 'Fans spin, lights on — but POST never finishes. Look up the POST code; suspect memory, CPU or a PCIe card; reseat. Be patient: memory training on big servers takes minutes.'); await t.wait(2200); }},

    ],

      for (let i = 1; i < s; i++) t.set('st' + i, 'good');
      t.set('st' + s, 'hi'); t.pulse('st' + s, 'acc');
      const f = r.boot.fail; const failSt = {power: 1, post: 2, nobootdev: 3, grub: 4, kernel: 5, emergency: 6}[f];
      if (failSt && s === failSt) setTimeout(() => { t.set('st' + s, 'bad'); t.text('f' + s, 'stops here'); }, 600);

}

<script>

const refresh = r => { rebootFresh(r); return r; };
const todayAt = (hhmm, dayOff = 0) => { const [hh, mm, ss] = hhmm.split(':').map(Number); return new Date(Date.UTC(2026, 9, 1 + dayOff, hh, mm, ss || 0)); };
const tAt = (r, hhmm, dayOff = 0) => (todayAt(hhmm, dayOff) - r.bootAt) / 1000;
const sel = (r, hhmm, sensor, ev, sev, dayOff = 0, dir = 'Asserted') => r.bmc.sel.push({d: todayAt(hhmm, dayOff), sensor, ev, dir, sev});
const kx = (r, hhmm, lvl, m, dayOff = 0) => (r.dmesgExtra = r.dmesgExtra || []).push({t: tAt(r, hhmm, dayOff), lvl: LV[lvl], m});
const jx = (r, hhmm, src, lvl, m, dayOff = 0) => (r.journalExtra = r.journalExtra || []).push({t: tAt(r, hhmm, dayOff), src, lvl: LV[lvl], m});
const say = (...lines) => lines.join('\n');
const C = s => `<code>${esc(s)}</code>`;

MODULES.push({
  id: 'm1', n: 1, title: 'Server Hardware', tagline: 'What is inside the box, and how each part fails',
  lead: 'A server is a computer built to run all day with no one in front of it. Think of a desktop as a family car and a server as a delivery truck that never parks: it carries spares, reports its own health, and lets the mechanic work on it from far away.',
  video: 'Inside of a Server Explained',
  topo: () => topoChassis(baseRig()),
  lessons: [
    {h: 'What makes a server a server', body: `
      <p>Compared with a desktop, a server has five things you should be able to name in your sleep:</p>
      <ul>
        <li><b>Redundancy</b>: two power supplies, many fans. One can fail and the server keeps running.</li>
        <li><b>Remote management</b>: a BMC (Module 8) lets you see and control it over the network.</li>
        <li><b>ECC memory</b> (Module 5): catches and fixes memory errors.</li>
        <li><b>Hot-swap parts</b>: some parts can be replaced while it runs.</li>
        <li><b>Rack form factor</b>, measured in rack units: <b>1U = 1.75 inches</b>.</li>
      </ul>`, widget: 'rackUnits'},
    {h: 'The parts and how they fail', body: `
      <p>Tap each part in the drawing above. Here is the same list as a table — learn the "common problems" column, because that is what you will check first.</p>
      <div class="tblwrap"><table class="tbl"><tr><th>Component</th><th>What it does</th><th>Common problems</th></tr>
      <tr><td>CPU</td><td>Runs instructions. Servers often have two ("dual socket"); each CPU owns its own memory slots and PCIe slots.</td><td>Bent socket pins, poor seating, overheating</td></tr>
      <tr><td>DIMMs</td><td>Memory modules in labeled slots (A1, B1…)</td><td>Bad module, poor seating, wrong slot</td></tr>
      <tr><td>PCIe slots and risers</td><td>High-speed connection for cards. A riser holds cards sideways in thin servers.</td><td>Riser not seated, loose riser cable, slot disabled</td></tr>
      <tr><td>Storage and backplane</td><td>Drives plug into a backplane that connects the front bays to the motherboard</td><td>Failing drive, bad connector or cable</td></tr>
      <tr><td>NIC</td><td>Network card (copper RJ45, fiber, or DAC cables)</td><td>No link, bad cable or transceiver, driver</td></tr>
      <tr><td>GPU</td><td>Accelerator for AI and compute; needs extra power cables</td><td>Not seated, missing power cable, overheating</td></tr>
      <tr><td>PSU and fans</td><td>Power and cooling, usually redundant. Air baffles direct airflow.</td><td>Failed PSU or fan, missing baffle</td></tr>
      <tr><td>Cables</td><td>Power, SATA/SAS, and PCIe cables (MCIO, SlimSAS)</td><td>Loose, pinched, or in the wrong port (a very common assembly error)</td></tr>
      </table></div>
      <div class="callout"><b class="tag">Think of it like</b>Each CPU is a team manager with its own team: its memory slots and its PCIe slots. If one manager is out sick, their whole team goes quiet — that is why a CPU problem can make a PCIe slot stop working.</div>`},
    {h: 'Firmware', body: `
      <p><b>Firmware is software stored on a chip</b>: the BIOS/UEFI (starts the server), the BMC firmware, and firmware on NICs, drives and GPUs.</p>
      <p>Mismatched or outdated firmware can make a device <b>disappear, drop offline, or report false errors</b>. So always <b>note firmware versions</b> before and after you touch anything.</p>`},
    {h: 'LEDs help — but do not prove health', body: `
      <p>Green health LED is good, amber means a fault. The <b>UID</b> LED (usually blue) identifies one server in a rack full of identical boxes. Network ports have <b>link</b> and <b>activity</b> LEDs.</p>
      <p>A green light is a hint, not proof. Logs and sensors are proof.</p>`, widget: 'leds'},
    {h: 'ESD: the zap you never feel', body: `
      <p>Static electricity can damage a chip without you feeling anything. The damage may only show up <b>later as an intermittent fault</b> — the chip is weakened, not dead, so it passes today and fails next week.</p>
      <ul><li>Wear a grounded wrist strap.</li><li>Hold parts by the edges.</li><li>Keep parts in anti-static bags.</li></ul>
      <div class="callout ex"><b class="tag">Real life</b>A DIMM handled without a strap passes burn-in, ships, and starts logging correctable errors a month later. Nobody connects it to the zap — which is exactly why you prevent it.</div>`}
  ],
  check: [
    {q: 'Name four features a server has that a typical desktop does not.', a: 'Any four of: redundancy (two power supplies, many fans), remote management through a BMC, ECC memory, hot-swap parts, and a rack form factor measured in rack units (1U = 1.75 inches).'},
    {q: 'In a dual-socket server, why might a PCIe slot stop working if one CPU has a problem?', a: 'Each CPU owns its own memory slots and PCIe slots: the slot\'s lanes come from that CPU\'s root complex. If that CPU has a problem (seating, bent pins, overheating), the devices in its slots disappear.'},
    {q: 'Why can ESD damage show up later as an intermittent problem instead of an immediate failure?', a: 'Static can damage a chip without killing it. The weakened part may pass tests today and fail only sometimes later, so the damage shows up as an intermittent fault rather than an immediate one.'}
  ],
  lab: {
    id: 'lab-m1', mode: 'physical', title: 'Fans screaming at full speed', ticket: 'Ticket 4471 · srv-r07-u12', sev: 'P3', xp: 50,
    brief: `<p>The customer says this server's fans run at full speed <b>all the time</b>. A weak tech would just replace the fans. Do it the strong way: <b>BMC sensors and the event log first</b>, then look for physical causes (failed fan, missing air baffle, blocked airflow), note firmware, change one thing at a time, and finish with documentation.</p><p class="muted">This is a hardware lab, so there is no command line here: you read the BMC's web page and work on the parts in the drawing.</p>`,
    rig: () => {

      sel(r, '01:12:40', 'Temperature CPU2 Temp #0x31', 'Upper Non-critical going high', 'w', -6);
      sel(r, '01:12:41', 'Fan FAN1 #0x41', 'Fan speed raised to 100% (thermal policy)', 'w', -6);
      sel(r, '08:55:02', 'Temperature CPU2 Temp #0x31', 'Upper Non-critical going high', 'w');

    topo: r => topoChassis(r),
    topoIntro: 'Physical view of the open server. Parts with a copper wrench mark can be worked on: click one.',
    panel: lab => bmcWebPanel(lab),
    tasks: [
      {t: 'BMC web page → <b>Sensors</b>: which readings are abnormal?', when: r => r.flags['view:Sensors']},
      {t: 'BMC web page → <b>Event Log</b>: when did it start?', when: r => r.flags['view:Event Log']},
      {t: 'BMC web page → <b>Inventory</b>: note the BMC and BIOS firmware versions', when: r => r.flags['view:Inventory']},
      {t: 'Physically check the fans (click a fan in the drawing)', when: r => r.flags.fanChecked},
      {t: 'Inspect the airflow parts around the CPUs', when: r => r.flags.inspected},
      {t: 'Fix the physical cause — one change only', when: r => !r.flags.baffleMissing},
      {t: 'Verify on the <b>Sensors</b> tab: fans and CPU 2 back to normal', when: r => !r.flags.baffleMissing && r.flags.views && r.flags.views.Sensors > (r.flags.fixSeq || 0)},
      {t: 'Document what you found and did', when: r => r.flags.doc}
    ],
    actions: [
      {id: 'fancheck', node: ['FAN1', 'FAN2', 'FAN3', 'FAN4', 'FAN5', 'FAN6'], kind: 'look', label: 'Check the fan: spinning, latched, undamaged?', do: r => { r.flags.fanChecked = true; return say(L('g', 'FAN1–FAN6: all spinning, all latched, no damage.'), 'None has failed. They are fast because the BMC raised the fan policy — something is hot.'); }},
      {id: 'fans', node: ['FAN1', 'FAN2', 'FAN3', 'FAN4', 'FAN5', 'FAN6'], kind: 'swap', label: 'Replace all six fans', do: r => say(L('w', 'You replaced six healthy fans. They still run at full speed — CPU 2 is still hot.'), L('d', 'Never replace parts before the evidence points at them.'))},
      {id: 'inspect', node: ['baffle', 'cpu2', 'cpu1'], kind: 'look', label: 'Inspect the air baffle area over the CPUs', do: r => { r.flags.inspected = true; return r.flags.baffleMissing ? say(L('e', 'The CPU air baffle is MISSING — it is on the bench next to the rack, left out after last week\'s DIMM swap.'), 'Without it, air takes the easy path around the CPUs. Drive blanks in place; cables tidy.') : L('g', 'Air baffle seated correctly over both CPUs.'); }},
      {id: 'baffle', node: 'baffle', kind: 'fix', label: 'Power down, install the air baffle, power up', do: r => { r.flags.baffleMissing = false; r.flags.fixSeq = r.flags.viewSeq || 0; r.temps.cpu1 = 52; r.temps.cpu2 = 55; Object.keys(r.fans).forEach(k => r.fans[k] = 7200 + (k.charCodeAt(3) * 13) % 90); r.bmc.sel.push({d: new Date(+r.now + 60e3), sensor: 'Temperature CPU2 Temp #0x31', ev: 'Upper Non-critical going high', dir: 'Deasserted'}); return L('g', 'Baffle installed and seated. After power-on the fan policy settles. Check the Sensors tab to verify.'); }},

MODULES.push({
  id: 'm2', n: 2, title: 'Linux Essentials', tagline: 'The OS on almost every data-center server',
  lead: 'You will drive Linux by typing, not clicking. That sounds old-school until you realise one person can manage hundreds of servers this way — and that the logs tell you exactly what the hardware is doing.',
  video: 'The Grep Command · Linux for Hackers (beginner playlist)',
  topo: () => topoLogs(baseRig()),
  lessons: [
    {h: 'What Linux is and why data centers use it', body: `
      <p>Linux is an operating system. Strictly, "Linux" is the <b>kernel</b>, the core that talks to the hardware. It is packaged with tools into <b>distributions</b> such as Red Hat Enterprise Linux (RHEL), Rocky Linux, Ubuntu Server and SUSE. It is <b>open source</b>: the code is public and free to use.</p>
      <div class="callout"><b class="tag">Think of it like</b>The kernel is the engine. A distribution is the whole car built around it — seats, dashboard, radio. Different car brands, same kind of engine.</div>
      <p>Data centers use it because it is:</p>
      <ul>
        <li><b>Stable</b>: servers run for months without a reboot.</li>
        <li><b>Low cost</b>: many distributions are free; paid ones (like RHEL) charge for support.</li>
        <li><b>Built for remote work</b>: everything is done by command line and scripts over the network, with no screen — one person can manage hundreds of servers.</li>
        <li><b>Transparent about hardware</b>: tools like <code>lspci</code> and <code>dmesg</code> show exactly what the hardware is doing.</li>
        <li><b>Secure, efficient, and supported</b>: frequent updates, low overhead, and AI and cloud software is built for Linux first.</li>
      </ul>`},
    {h: 'Command line basics', body: `
      <p>Linux is <b>case-sensitive</b> ("Failure" and "failure" are different). Many hardware commands need <code>sudo</code> (run as administrator). <code>man grep</code> shows the manual for a command.</p>
      <div class="tblwrap"><table class="tbl"><tr><th>Command</th><th>What it does</th></tr>
      <tr><td><code>ls -l</code>, <code>cd</code>, <code>pwd</code></td><td>List files, change folder, show current folder</td></tr>
      <tr><td><code>cat</code>, <code>less</code>, <code>head</code>, <code>tail</code></td><td>Show a file, scroll a file, first or last lines</td></tr>
      <tr><td><code>tail -f /var/log/syslog</code></td><td>Follow a log live</td></tr>
      <tr><td><code>cmd &gt; file.txt</code></td><td>Save output to a file (useful for evidence)</td></tr>
      <tr><td><code>cmd1 | cmd2</code></td><td>Pipe: send one command's output into another</td></tr></table></div>
      <p>Logs live in <code>/var/log/</code>. The main system log is <code>/var/log/syslog</code> (Ubuntu) or <code>/var/log/messages</code> (Red Hat family). Config files live in <code>/etc/</code>.</p>`},
    {h: 'Searching with grep', body: `
      <p><code>grep</code> prints every line that contains a word: <code>grep "failure" /var/log/syslog</code>. Flip the switches below and watch the command and its output change live.</p>`, widget: 'grepLab'},
    {h: 'Kernel and system logs', body: `
      <p>The kernel talks directly to hardware, so <b>hardware problems show up in kernel messages</b>.</p>
      <ul>
        <li><code>dmesg</code> shows kernel messages since boot. Useful forms: <code>dmesg -T</code> (readable times), <code>dmesg | tail -50</code> (recent), <code>dmesg -w</code> (live), <code>dmesg --level=err,warn</code>.</li>
        <li><code>journalctl</code> reads the systemd journal: <code>-k</code> kernel only, <code>-b</code> this boot, <code>-b -1</code> the previous boot, <code>-p err</code> errors only, <code>-f</code> live.</li>
      </ul>
      <div class="callout warn"><b class="tag">Before you reboot</b>The dmesg buffer is <b>cleared on reboot</b>. Save evidence first (<code>dmesg &gt; before_reboot.txt</code>), and after a crash use <code>journalctl -b -1</code> to read the previous boot.</div>
      <div class="callout"><b class="tag">Think of it like</b>dmesg is a whiteboard: wiped clean every reboot. The journal on disk is a notebook: last boot's pages are still there.</div>`}
  ],
  check: [
    {q: 'Explain what Linux is and give three reasons data centers use it.', a: 'Linux is an operating system; strictly, the kernel that talks to the hardware, packaged with tools into distributions like RHEL, Rocky, Ubuntu Server and SUSE. It is open source. Reasons: stable (months without reboot), low cost, built for remote work by command line and scripts, transparent about hardware (lspci, dmesg), secure/efficient/supported, AI and cloud software built for Linux first.'},
    {q: 'Write a command to find every line containing "timeout" in /var/log/messages, ignoring case, with line numbers.', a: '<code>grep -in "timeout" /var/log/messages</code> (add <code>sudo</code> on Red Hat systems, where the file is root-only). -i ignores case, -n shows line numbers.'},
    {q: 'What is the difference between dmesg and journalctl -b -1, and why does it matter after a crash?', a: 'dmesg shows kernel messages since the current boot, from a buffer that is cleared on reboot. journalctl -b -1 reads the previous boot from the systemd journal. After a crash and reboot, the messages that explain the crash are in the previous boot, so dmesg no longer has them — journalctl -b -1 does (if the journal is kept on disk).'}
  ],
  lab: {
    id: 'lab-m2', title: 'Log detective: the overnight timeouts', ticket: 'Ticket 4480 · srv-r07-u12', sev: 'P3', xp: 50,
    brief: `<p>Overnight burn-in logged storage timeouts on this server. Engineering wants the evidence <b>before</b> tomorrow's scheduled reboot. Find it, count it, save it, then reboot and prove you can still read the old messages.</p><p class="muted">Tip: on Red Hat family systems <code>/var/log/messages</code> needs <code>sudo</code>.</p>`,
    rig: () => {
      const r = baseRig();
      kx(r, '02:41:10', 'warn', 'nvme nvme3: I/O 512 QID 7 timeout, aborting');
      kx(r, '02:41:10', 'info', 'nvme nvme3: Abort status: 0x0');
      kx(r, '02:41:40', 'err', 'nvme nvme3: I/O 77 QID 3 timeout, reset controller');
      kx(r, '02:41:42', 'info', 'nvme nvme3: 128/0/0 default/read/poll queues');
      kx(r, '04:15:03', 'warn', 'nvme nvme3: I/O 203 QID 12 timeout, aborting');
      jx(r, '02:41:41', 'fio-burnin[4410]', 'err', 'TIMEOUT waiting for /dev/nvme3n1 (retry 1 of 3)');
      jx(r, '04:15:05', 'fio-burnin[4410]', 'err', 'TIMEOUT waiting for /dev/nvme3n1 (retry 1 of 3)');
      return refresh(r);
    },
    topo: r => topoLogs(r),
    chips: ['dmesg -T | tail -30', 'dmesg --level=err,warn', 'sudo grep -in timeout /var/log/messages', 'sudo grep -ic timeout /var/log/messages'],
    tasks: [
      {t: 'Show the most recent kernel messages with readable times', cmd: /dmesg.*-T/, hint: 'dmesg -T | tail -30'},
      {t: 'Show only kernel errors and warnings', cmd: /dmesg.*--level=?\S*err|dmesg.*-l\s*err/, hint: 'dmesg --level=err,warn'},
      {t: 'Find every "timeout" line in the main log, ignoring case, with line numbers (notice the upper-case TIMEOUT lines)', cmd: /grep\s+(-\w*i\w*n\w*|-\w*n\w*i\w*|-i\s+-n|-n\s+-i).*timeout.*\/var\/log\/messages/, ok: (r, res) => res.some(x => x && x.out), hint: 'sudo grep -in timeout /var/log/messages'},

      {t: 'Save the kernel messages to a file before rebooting', cmd: /dmesg.*>\s*\S+/, hint: 'dmesg > before_reboot.txt'},
      {t: 'Reboot the server', when: r => r.journal.prevBoots.length > 0},
      {t: 'After the reboot, read the previous boot\'s nvme messages', cmd: /journalctl.*-b\s+-1/, ok: r => r.journal.prevBoots.length > 0, hint: 'journalctl -b -1 -k | grep -i nvme'}
    ],
    demo: ['dmesg -T | tail -12', 'dmesg --level=err,warn', 'sudo grep -in timeout /var/log/messages', 'sudo grep -ic timeout /var/log/messages', 'dmesg > before_reboot.txt', 'ls', 'sudo reboot', 'dmesg | grep -i timeout', 'journalctl -b -1 -k | grep -i nvme']
  }

MODULES.push({
  id: 'm3', n: 3, title: 'Finding Hardware from Linux', tagline: 'Prove which layer is failing before you blame a part',
  lead: 'A device can be plugged in, seen on the bus, have a driver, and still not work. Each of those is a different problem with a different fix. Find the layer first — then you know whether to grab a screwdriver or a driver package.',
  topo: () => topoLayers(baseRig()),
  lessons: [
    {h: 'The four layers of "is it working?"', body: `
      <div class="tblwrap"><table class="tbl"><tr><th>Layer</th><th>Question</th><th>How to check</th></tr>
      <tr><td>1. Physical</td><td>Installed, seated, powered, seen by BIOS/BMC?</td><td>Look, LEDs, BIOS or BMC inventory</td></tr>
      <tr><td>2. Bus</td><td>Does the OS see it on the bus?</td><td><code>lspci</code>, <code>lsblk</code>, <code>nvme list</code></td></tr>
      <tr><td>3. Driver</td><td>Is a driver attached?</td><td><code>lspci -k</code> ("Kernel driver in use"), <code>dmesg</code></td></tr>
      <tr><td>4. Function</td><td>Is it configured and working?</td><td><code>ip a</code>, <code>nvidia-smi</code>, a functional test</td></tr></table></div>
      <div class="callout ex"><b class="tag">Example</b>A NIC shows in <code>lspci</code> but has no driver in use. The hardware is fine; the problem is the driver. <b>Do not replace the card.</b></div>`, widget: 'layerQuiz'},
    {h: 'Reading lspci', body: `

/* ---------------- Module 4 ---------------- */
MODULES.push({
  id: 'm4', n: 4, title: 'PCIe', tagline: 'Lanes, generations, link training, topology, retimers',
  lead: 'PCIe is the highway between the CPU and the fast parts: GPUs, NICs and NVMe drives. Lanes are the highway lanes, the generation is the speed limit, and link training is the moment at power-on when both ends agree how many lanes and how fast.',
  video: 'PCIe Lanes, Versions & Speeds Explained · Understanding PCIe: Lanes, Links, and Signal Integrity',
  topo: () => topoPcie(baseRig()),
  lessons: [
    {h: 'Lanes, generations, and bandwidth', body: `
      <p>A link is made of lanes (x1, x4, x8, x16). Each new generation <b>doubles</b> the speed per lane.</p>
      <div class="tblwrap"><table class="tbl tnum"><tr><th>Generation</th><th>Per lane</th><th>Approx. per lane, each direction</th><th>x16 link</th></tr>
      <tr><td>Gen 3</td><td>8 GT/s</td><td>1 GB/s</td><td>16 GB/s</td></tr><tr><td>Gen 4</td><td>16 GT/s</td><td>2 GB/s</td><td>32 GB/s</td></tr>
      <tr><td>Gen 5</td><td>32 GT/s</td><td>4 GB/s</td><td>64 GB/s</td></tr><tr><td>Gen 6</td><td>64 GT/s</td><td>8 GB/s</td><td>128 GB/s</td></tr></table></div>
      <p>Bandwidth is how much data a link moves per second, <b>in each direction</b> (PCIe sends and receives at the same time). It is determined by:</p>
      <ol><li>Generation (transfer rate per lane) and width (number of lanes).</li><li>Encoding overhead: Gen 3 to 5 lose about 1.5% (Gen 1 and 2 lost 20%).</li><li>The weakest part of the path: a Gen 5 card in a Gen 4 slot runs at Gen 4.</li><li>What the link actually trained to, and how the slot is wired (an x16 slot may be wired x8).</li><li>Shared links: devices behind a PCIe switch share its single upstream link (oversubscription).</li></ol>
      <div class="callout"><b class="tag">Quick math</b>GT/s × lanes ÷ 8 ≈ GB/s. A Gen 5 x8 link equals a Gen 4 x16 link (about 32 GB/s).</div>`, widget: 'pcieCalc'},
    {h: 'Link training: LnkCap versus LnkSta', body: `
      <p>At power on, each link negotiates ("trains") its speed and width. <code>sudo lspci -vv</code> shows <b>LnkCap</b> (what the device can do) and <b>LnkSta</b> (what it actually got).</p>
      <p>If LnkSta is lower, the link is <b>downtrained</b>: it works, but slower. Suspect poor seating, a dirty connector, a bad riser, cable, or retimer, or a BIOS speed setting.</p>
      <pre class="out">		LnkCap:	Port #0, Speed 32GT/s, Width x16, ASPM not supported
		LnkSta:	Speed 32GT/s, Width x8 (downgraded)</pre>`},
    {h: 'Topology: how PCIe is wired', body: `
      <p>PCIe is a <b>tree</b>. The <b>root complex</b> is inside the CPU, with several root ports. A <b>PCIe switch</b> fans one upstream link out to several devices. <b>Risers and cables</b> carry lanes to slots and backplanes. <b>Endpoints</b> are the devices.</p>
      <p>In a dual-socket server, each slot belongs to one CPU; if that CPU has a problem, its devices disappear. <b>Bifurcation</b> (a BIOS setting) splits an x16 slot into smaller links, for example four x4 links for a four-drive NVMe card.</p>
      <p>Press <b>Play</b> on the drawing at the top: watch links train, one downtrain, and a whole branch vanish.</p>`},
    {h: 'Retimers versus redrivers', body: `
      <p>Faster signals lose strength more quickly over traces, connectors, risers and cables. At Gen 4 and Gen 5, long paths need help.</p>
      <ul><li>A <b>redriver</b> is a simple amplifier. It boosts the signal <b>and its noise</b>, and does not take part in link training.</li>
      <li>A <b>retimer</b> fully recovers the data and re-transmits a clean signal, <b>resetting the loss budget</b> so the link can reach much farther. It takes part in link training, is normally <b>invisible to the OS</b> (not in lspci), and sits on risers, backplanes, motherboards and GPU baseboards.</li></ul>
      <p>A failed or misconfigured retimer can make <b>every device behind it disappear</b>, cause <b>downtrained links</b>, or produce a <b>stream of corrected PCIe errors</b>. Retimers have firmware, and some BMCs report their health.</p>`, widget: 'retimer'},
    {h: 'Topology diagram versus topology tree', body: `
      <p>The <b>topology diagram</b> (service guide or engineering) is the <b>expected</b> picture: which CPU and root port each slot connects to, which switches, risers, retimers and cables sit in between, expected link width, slot-to-bus mapping, and shared paths. The <b>tree</b> from <code>lspci -tv</code> is the <b>actual</b> picture:</p>
      <pre class="out">-[0000:00]-+-01.0-[17-1a]----00.0-[18-1a]--+-00.0-[19]----00.0   NVIDIA GPU   (Slot 1)
           |                               \\-04.0-[1a]----00.0   NVIDIA GPU   (Slot 2)
           +-03.0-[3b]----00.0 Mellanox NIC                      (Slot 3)
           \\-05.0-[5e]----00.0 NVMe SSD                          (Bay 0)</pre>
      <p><code>01.0</code> is a port, <code>[17-1a]</code> is the range of buses behind it, and the port with two branches is a PCIe switch. Compare expected with actual:</p>
      <ul><li><b>Port present, nothing under it</b>: the device did not link. Suspect the device, its power cable, seating, the slot, or a retimer.</li>
      <li><b>Whole branch missing</b>: suspect something upstream: riser, cable, switch, retimer, CPU root port, or a slot disabled in BIOS.</li>
      <li><b>Every device under one switch missing</b>: suspect the switch or its upstream link, not each device.</li></ul>`, widget: 'treeGame'},
    {h: 'PCIe errors and BIOS settings', body: `
      <p><b>AER</b> messages in dmesg report PCIe errors. A few corrected errors are harmless; a <b>steady stream</b> points to a signal problem (seating, connector, cable, riser, retimer). Uncorrected errors can drop the device or crash the system. Match the address in the message to lspci and the diagram.</p>
      <p>BIOS settings that hide or break devices: <b>slot disabled</b>, <b>wrong bifurcation</b>, <b>forced link speed</b>, and <b>Above 4G Decoding or Resizable BAR turned off</b> (large GPUs need them).</p>`}
  ],
  check: [
    {q: 'A Gen 4 x16 card shows LnkSta: Speed 16GT/s, Width x4. What does it mean, and what would you check?', a: 'The speed trained correctly (Gen 4) but the width is x4 instead of x16: the link is downtrained to a quarter of its bandwidth (about 8 GB/s instead of 32 GB/s each direction). It works, but slowly. Check seating, a dirty connector, the riser, cable or retimer, the slot wiring, and BIOS speed/bifurcation settings — then reseat and re-check LnkSta.'},
    {q: 'Name five factors that determine PCIe bandwidth.', a: '1) Generation (GT/s per lane) and width (lanes); 2) encoding overhead (~1.5% for Gen 3–5, 20% for Gen 1–2); 3) the weakest part of the path (both ends and everything between); 4) what the link actually trained to and how the slot is wired; 5) shared links behind a PCIe switch (oversubscription).'},
    {q: 'What is a retimer, how is it different from a redriver, and why are retimers common in Gen 5 servers?', a: 'A retimer fully recovers the data and re-transmits a clean signal, resetting the loss budget; it takes part in link training and is normally invisible to the OS. A redriver only amplifies — it boosts the signal and its noise and does not take part in training. At Gen 5 speeds signals lose strength quickly over traces, connectors, risers and cables, so long paths need retimers to reach.'},
    {q: 'In lspci -tv, what is the difference between an empty port and a missing branch?', a: 'An empty port (port present, nothing under it) means the device did not link: suspect the device, its power cable, seating, the slot, or a retimer. A missing branch (the port and everything under it gone) points upstream: riser, cable, switch, retimer, CPU root port, or a slot disabled in BIOS.'}
  ],
  lab: {
    id: 'lab-m4', title: 'One GPU runs at half speed', ticket: 'Ticket 4507 · srv-r07-u12', sev: 'P3', xp: 60,
    brief: `<p>The customer says GPU 1 finishes training jobs much slower than its three neighbours. All four GPUs show up. Check the link, find the error stream, fix one thing, and prove it is fixed.</p>`,
    rig: () => {
      const r = baseRig();
      const g = r.devs.gpu1; g.sta = {gt: 32, w: 8}; g.aer = 214;
      ['03:10:11', '03:10:12', '05:44:02', '07:01:59', '09:12:30'].forEach(t2 => { kx(r, t2, 'warn', 'pcieport 0000:18:04.0: AER: Corrected error received: 0000:1a:00.0'); kx(r, t2, 'warn', 'nvidia 0000:1a:00.0: PCIe Bus Error: severity=Corrected, type=Physical Layer, (Receiver ID)'); kx(r, t2, 'warn', 'nvidia 0000:1a:00.0:    [ 0] RxErr'); });
      r.live = [{d: 1800, e: {lvl: 4, m: 'pcieport 0000:18:04.0: AER: Corrected error received: 0000:1a:00.0'}}, {d: 300, e: {lvl: 4, m: 'nvidia 0000:1a:00.0: PCIe Bus Error: severity=Corrected, type=Physical Layer, (Receiver ID)'}}];
      r.hooks.onBoot = rr => { if (rr.flags.reseated) { rr.devs.gpu1.sta = {gt: 32, w: 16}; rr.devs.gpu1.aer = 0; rr.dmesgExtra = []; } };
      return refresh(r);
    },
    topo: r => topoPcie(r),
    chips: ['nvidia-smi', 'lspci -tv', 'sudo lspci -vv -s 1a:00.0', 'dmesg | grep -i aer'],
    tasks: [
      {t: 'Confirm all four GPUs are detected by the driver', cmd: /nvidia-smi/, hint: 'nvidia-smi'},
      {t: 'Find GPU 1 in the PCIe tree (which switch and riser?)', cmd: /lspci.*-t/, hint: 'lspci -tv'},
      {t: 'Compare LnkCap and LnkSta for GPU 1 (1a:00.0)', cmd: /lspci.*-vv/, ok: (r, res, lab) => /1a:00/.test(lab.lastLine || '') || true, hint: 'sudo lspci -vv -s 1a:00.0'},
      {t: 'Find the PCIe error stream in the kernel log', cmd: /dmesg.*(aer|pcie|1a:00)/i, hint: 'dmesg | grep -i aer'},
      {t: 'Fix: change exactly one thing', when: r => r.flags.reseated},
      {t: 'Verify: LnkSta back to x16 and no new AER errors', cmd: /lspci.*-vv/, ok: r => r.devs.gpu1.sta.w === 16}
    ],
    actions: [
      {id: 'bios', kind: 'bios', label: 'BIOS: check slot 3 link speed setting', do: () => 'BIOS › PCIe › Slot 3 Link Speed: ' + L('g', 'Auto') + ' · Bifurcation: x16 · Above 4G Decoding: Enabled · Resizable BAR: Enabled. Nothing wrong here.'},
      {id: 'reseat', node: 'dev:gpu1', kind: 'fix', label: 'Power off (ESD strap on) and reseat GPU 1', reboot: 'cycle', do: r => { r.flags.reseated = true; return say('Riser 1 out. GPU 1 was ' + L('w', 'not fully down in the slot — the retention latch was half open.'), 'Reseated firmly, latch closed, riser back in. Powering on…'); }},
      {id: 'riser', node: 'rt:rt1', kind: 'look', label: 'Inspect Riser 1 and its cable', do: () => say(L('g', 'Riser 1 fully seated, cable latched, connector clean.'), 'GPU 0 on the same riser trains at x16, so the shared path is fine.')}
    ],
    demo: ['nvidia-smi', 'lspci -tv', 'sudo lspci -vv -s 1a:00.0 | grep -i lnk', 'dmesg | grep -i aer | tail -4', '#reseat', 'sudo lspci -vv -s 1a:00.0 | grep -i lnk']
  }

MODULES.push({
  id: 'm5', n: 5, title: 'Memory and ECC', tagline: 'Correctable vs uncorrectable, and DIMM vs system',
  lead: 'Memory errors are the most common thing a server log will complain about. ECC is the reason most of them are harmless — and the reason you can catch a dying DIMM before it takes the server down.',
  video: 'ECC Memory Explained',
  topo: () => topoMemory(baseRig()),
  lessons: [
    {h: 'RDIMMs and population rules', body: `
      <p>Servers use <b>RDIMMs</b> (registered DIMMs) in labeled slots on channels belonging to each CPU. Follow the <b>population rules</b> in the service guide; wrong placement can lower performance or disable a DIMM. <b>Do not mix</b> DDR4 and DDR5, or RDIMM and UDIMM.</p>`},
    {h: 'How ECC works', body: `
      <p>ECC (Error-Correcting Code) memory stores <b>extra check bits</b> with the data. When data is read back:</p>
      <ul><li>A <b>single-bit error</b> is detected and <b>corrected automatically</b> (a correctable error). The server keeps running and logs it.</li>
      <li>A <b>double-bit error</b> is detected but <b>cannot be fixed</b> (an uncorrectable error). The server usually stops or crashes rather than use bad data.</li></ul>
      <p><b>Why it matters in a data center:</b> it prevents silent data corruption, keeps servers running through single-bit errors, and gives <b>early warning</b> — a DIMM logging more and more correctable errors is likely to fail and can be replaced before it causes an outage.</p>
      <p>Try it: flip one bit, then flip two.</p>`, widget: 'ecc'},
    {h: 'Where memory errors show up', body: `
      <ul><li>BMC event log, e.g. <code>Correctable ECC logging limit reached, DIMM C1</code> (<code>ipmitool sel elist</code>)</li>
      <li><code>dmesg | grep -i edac</code></li><li><code>ras-mc-ctl --summary</code></li>
      <li>missing memory in <code>free -h</code></li><li><code>dmidecode -t memory</code> (maps a slot name to a serial number)</li></ul>`},
    {h: 'Is it the DIMM or the system?', body: `
      <ol><li><b>Record the evidence</b>: slot name, error type and count, DIMM serial, timestamps.</li>
      <li><b>Check simple things</b>: seated with both latches closed, correct part, correct slot, current BIOS.</li>
      <li><b>Swap test</b>: move the suspect DIMM to a slot on a <b>different channel</b> and put a known-good DIMM in the suspect slot. Clear logs and run a memory test.
        <ul><li>Errors <b>follow the DIMM</b> to its new slot: the DIMM is bad.</li><li>Errors <b>stay in the original slot</b>: suspect the slot, board, or CPU.</li></ul></li>
      <li><b>Look for patterns</b>: errors on many DIMMs on one channel or one CPU point to the CPU's memory controller, CPU seating, or bent socket pins.</li>
      <li><b>Stress test</b> after each change (vendor diagnostics, MemTest86, stress-ng), one change at a time, and document.</li></ol>`, widget: 'dimmSwap'}
  ],
  check: [
    {q: 'What is the difference between a correctable and an uncorrectable memory error?', a: 'A correctable error is a single-bit error: ECC detects and fixes it automatically, the server keeps running and logs it. An uncorrectable error is a double-bit error: ECC detects it but cannot fix it, so the server usually stops or crashes rather than use bad data.'},
    {q: 'You move a suspect DIMM from B2 to D1 and put a known-good DIMM in B2. Errors now appear on D1. What is your conclusion?', a: 'The errors followed the DIMM to its new slot, so the DIMM is bad. Replace it (RMA), retest, and document both serials.'},
    {q: 'Errors appear on every DIMM connected to CPU 2. What do you suspect?', a: 'Not the DIMMs — a common cause on CPU 2: its memory controller, CPU 2 seating, or bent socket pins.'}
  ],
  lab: {
    id: 'lab-m5', title: 'ECC logging limit reached', ticket: 'Ticket 4513 · srv-r07-u12', sev: 'P2', xp: 60,
    brief: `<p>The BMC raised a memory warning overnight. Find the slot, record the evidence, check the simple things, then run a proper <b>swap test</b> to decide: DIMM or system?</p>`,
    rig: () => {
      const r = baseRig();
      const b2 = r.dimms.find(d => d.loc === 'B2'); b2.ce = 1204; b2.bad = true;
      sel(r, '23:02:11', 'Memory #0x87', 'Correctable ECC (DIMM B2)', 'w', -1);
      sel(r, '03:12:44', 'Memory #0x87', 'Correctable ECC logging limit reached (DIMM B2)', 'w');
      ['23:02:11', '01:40:09', '03:12:43'].forEach((t2, i) => kx(r, t2, 'warn', `EDAC MC0: ${400 + i * 2} CE memory read error on CPU_SrcID#0_MC#0_Chan#1_DIMM#1 (channel:1 slot:1 page:0x${(0x4c2f1 + i * 77).toString(16)} offset:0x0 grain:32 syndrome:0x0)`, i === 0 ? -1 : 0));
      r.hooks.cmd = {'stress-ng': (a, X) => {
        const rr = X.r; const bad = rr.dimms.find(d => d.bad);
        return {stream: [{d: 400, line: 'stress-ng: info:  [5120] dispatching hogs: 32 vm'}, {d: 1600, line: null, fx: q => { if (bad && bad.seated) { bad.ce += 37; q.bmc.sel.push({d: new Date(q.now), sensor: 'Memory #0x87', ev: `Correctable ECC (DIMM ${bad.loc})`, dir: 'Asserted', sev: 'w'}); q.dmesg.push({t: (q.now - q.bootAt) / 1000, lvl: 4, m: `EDAC MC${bad.cpu === 1 ? 0 : 4}: 37 CE memory read error on DIMM ${bad.loc}`}); return L('w', `stress-ng: info:  [5120] memory errors logged by EDAC during run: 37 (DIMM ${bad.loc})`); } return L('g', 'stress-ng: info:  [5120] no memory errors logged during run'); }}, {d: 600, line: 'stress-ng: info:  [5120] successful run completed in 600.00s'}]};

    topo: r => topoMemory(r),
    chips: ['sudo ipmitool sel elist', 'sudo ras-mc-ctl --summary', 'dmesg | grep -i edac', 'sudo dmidecode -t memory | grep -B3 -A6 DIMM_B2'],
    tasks: [
      {t: 'Find the slot and error type in the BMC event log', cmd: /ipmitool.*sel/, hint: 'sudo ipmitool sel elist'},
      {t: 'Get the error count per DIMM from Linux', cmd: /ras-mc-ctl|edac/, hint: 'sudo ras-mc-ctl --summary'},
      {t: 'Record the serial number of the DIMM in B2', cmd: /dmidecode/, hint: 'sudo dmidecode -t memory'},
      {t: 'Check the simple things: seating and latches', when: r => r.flags.seatChecked},
      {t: 'Swap test: suspect DIMM to a different channel, known-good DIMM into B2, clear logs', when: r => r.flags.swapped},
      {t: 'Run a memory stress test and see where the errors go now', cmd: /stress-ng|memtest/, ok: r => r.flags.swapped},
      {t: 'Read the result: did the errors follow the DIMM?', cmd: /ras-mc-ctl|sel|edac/, ok: r => r.flags.swapped && r.dimms.find(d => d.loc === 'D1').ce > 0},
      {t: 'Replace the bad DIMM and verify with a clean stress run', when: r => r.flags.replaced && r.dimms.every(d => !d.bad)}
    ],
    actions: [
      {id: 'seat', node: 'dimm:B2', kind: 'look', label: 'Check DIMM B2 seating, latches and part number', do: r => { r.flags.seatChecked = true; return say(L('g', 'B2: both latches closed, fully seated. Part M321R8GA0BB0-CQKZJ matches the build sheet. BIOS 2.3a is current.'), 'Simple things are fine — next step is the swap test.'); }},
      {id: 'swap', node: ['dimm:B2', 'dimm:D1'], kind: 'swap', label: 'Move the B2 DIMM to D1 (other channel), put a known-good DIMM in B2, clear the SEL', do: r => {
        const b2 = r.dimms.find(d => d.loc === 'B2'), d1 = r.dimms.find(d => d.loc === 'D1');
        const susp = {sn: b2.sn, bad: true}; b2.sn = '80CEKG0001'; b2.bad = false; b2.ce = 0; b2.knownGood = true;
        d1.sn = susp.sn; d1.bad = true; d1.ce = 0; r.flags.swapped = true;

        return say('Suspect DIMM (serial ' + susp.sn + ') → slot D1 on channel D.', 'Known-good DIMM 80CEKG0001 → slot B2.', 'SEL cleared, EDAC counters reset. Now run a stress test.'); }},

    ],

  lead: 'NVMe drives plug straight into PCIe, so a flaky NVMe drive is often really a flaky PCIe link. And when a reboot "fixes" a missing drive, it only reset the link — the cause is still there.',

      <div class="tblwrap"><table class="tbl"><tr><th>Command</th><th>Shows</th></tr>

    {h: 'A drive that drops out and comes back after reboot', body: `
      <p>A reboot resets the link, so the drive returns, but the cause remains. Likely causes: poor seating or a worn backplane connector, a bad or misrouted cable, overheating, power-saving features that fail to wake, a firmware bug, PCIe signal problems, or a failing drive.</p>
      <ol><li>Capture evidence before rebooting (<code>dmesg &gt; file.txt</code>), or read <code>journalctl -b -1 -k | grep -i nvme</code> after.</li>
      <li>Check the BMC event log for drive or PCIe events at the same time.</li>
      <li>Check health: <code>nvme smart-log</code> (temperature, media errors, warnings).</li>
      <li>Check the link: LnkSta versus LnkCap, and AER errors on the port above the drive.</li>
      <li>Check firmware for the drive, backplane, and BIOS.</li>
      <li>Isolate: move the drive to another bay. Problem follows the drive: the drive. Stays with the bay: bay, backplane, or cable.</li>
      <li>Reproduce under load (for example with <code>fio</code>) while watching <code>dmesg -w</code> and temperature. Document everything.</li></ol>`},

    {q: 'Which command shows an NVMe drive\'s temperature and media errors?', a: '<code>nvme smart-log /dev/nvme0</code> (critical warnings, temperature, media errors, unsafe shutdowns).'},

  lab: {

    brief: `<p>During storage burn-in the drive in Bay 3 disappears from <code>lsblk</code>. Reproduce it under load, capture the evidence, then <b>isolate by moving the drive</b> to empty Bay 5 to learn whether the problem follows the drive or stays with the bay.</p>`,

        if (inBad && !d.gone) {
          st.push({d: 1200, line: null, fx: q => { const t = (q.now - q.bootAt) / 1000; q.dmesg.push({t, lvl: 4, m: 'nvme nvme3: I/O 512 QID 7 timeout, aborting'}, {t: t + 30, lvl: 3, m: 'nvme nvme3: controller is down; will reset: CSTS=0xffffffff, PCI_STATUS=0xffff'}, {t: t + 31, lvl: 3, m: 'nvme nvme3: Removing after probe failure status: -19'}, {t: t + 31, lvl: 4, m: 'pcieport 0000:80:07.0: AER: Corrected error received: 0000:a6:00.0'}); q.devs.nvme3.gone = true; q.bmc.sel.push({d: new Date(q.now), sensor: 'Drive Slot 3 #0x63', ev: 'Drive Fault', dir: 'Asserted', sev: 'e'}); return L('e', 'fio: io_u error on file /dev/nvme3n1: No such device: read offset=8851320832, buflen=131072'); }});
          st.push({d: 500, line: L('e', 'fio: pid=6620, err=19/file:io_u.c:1889, func=io_u error, error=No such device')});
        } else st.push({d: 1500, line: 'Jobs: 4 (f=4): [m(4)][100.0%][r=9.3GiB/s,w=4.0GiB/s]'}, {d: 300, line: L('g', 'Run status: 4 jobs, 0 errors.' + (d.bay !== 3 ? ' (the drive is now in Bay ' + d.bay + ')' : ''))});
        return {stream: st};
      };
      r.hooks.cmd = {fio: fioHook};

      {t: 'Reproduce under load', cmd: /^fio/, ok: r => r.devs.nvme3.gone, hint: 'fio --name=burnin --rw=randrw --runtime=600'},
      {t: 'Capture the kernel evidence (save it to a file)', cmd: /dmesg.*>|dmesg.*nvme/, hint: 'dmesg | grep -i nvme > nvme_drop.txt'},
      {t: 'Check the BMC event log at the same time', cmd: /ipmitool.*sel/, hint: 'sudo ipmitool sel elist'},

      {t: 'Isolate: move the drive to empty Bay 5 and run the load again', cmd: /^fio/, ok: r => r.devs.nvme3.bay === 5},

    ],
    actions: [

      {id: 'inspect', node: 'cab3', kind: 'look', label: 'Inspect the Bay 3 backplane connector and its MCIO cable', do: r => { r.flags.inspected = true; return r.flags.cableBad === 3 ? say(L('e', 'The MCIO cable for Bay 3 is pinched under the fan-wall bracket — the jacket is crushed.'), 'Backplane connector pins look clean.') : 'Cable and connector look good.'; }},
      {id: 'cable', node: 'cab3', kind: 'cable', label: 'Replace the Bay 3 MCIO cable and reroute it', do: r => { r.flags.cableBad = null; r.devs.nvme3.aer = 0; return L('g', 'New cable installed and routed clear of the bracket.'); }},
      {id: 'back', node: 'dev:nvme3', kind: 'move', label: 'Power off, move the drive back to Bay 3, power on', reboot: 'cycle', do: r => { r.devs.nvme3.bay = 3; r.nvmeInfo.nvme3.bay = 3; r.devs.nvme3.label = 'NVMe Bay 3'; r.flags.bayMoved = {nvme3: 3}; if (r.flags.cableBad === 3) r.devs.nvme3.aer = 9; return 'Drive back in Bay 3.'; }}

MODULES.push({
  id: 'm7', n: 7, title: 'Networking', tagline: 'IP, ip a, DHCP, DNS, and the bottom-up method',
  lead: 'Network problems feel mysterious until you go bottom-up: is there a link, is there an address, can I reach the gateway, does the name resolve, is the service listening? Each layer needs the one below it.',
  video: 'DHCP Explained · How a DNS Server Works · Default Gateway Explained',
  topo: () => topoNetwork(baseRig()),
  lessons: [
    {h: 'The basics', body: `
      <div class="tblwrap"><table class="tbl"><tr><th>Item</th><th>Meaning</th><th>Example</th></tr>
      <tr><td>IP address</td><td>The device's network address</td><td><code>10.20.5.14</code></td></tr>
      <tr><td>Subnet mask</td><td>Which addresses are local (/24 = 255.255.255.0)</td><td><code>/24</code></td></tr>
      <tr><td>Default gateway</td><td>The router used to reach other networks</td><td><code>10.20.5.1</code></td></tr>
      <tr><td>DNS server</td><td>Translates names into IP addresses</td><td><code>10.20.5.5</code></td></tr>
      <tr><td>MAC address</td><td>The card's permanent hardware address</td><td><code>3c:ec:ef:12:34:56</code></td></tr></table></div>
      <p><b>169.254.x.x</b> is a self-assigned address: the device asked DHCP and got no answer. <b>127.0.0.1</b> is the machine itself.</p>
      <p>Networks work in layers: <b>physical</b> (cable, link light) → <b>local network</b> (MAC, VLAN) → <b>IP and routing</b> (address, gateway) → <b>ports</b> (SSH uses TCP 22) → <b>application</b> (the service). Each layer depends on the ones below it, so troubleshoot from the bottom up.</p>
      <div class="callout"><b class="tag">Think of it like</b>Mailing a letter: the road must exist (cable), the house must have an address (IP), the post office must know the route out of town (gateway), you need the address book to turn a name into an address (DNS), and someone has to be home to open it (the service).</div>`},
    {h: 'Reading ip a', body: `<p><code>ip a</code> shows the IP address on each interface, and much more. Tap any highlighted part:</p>`, widget: 'ipA', after: `
      <p>It does <b>not</b> show the gateway (<code>ip route</code>), DNS servers (<code>/etc/resolv.conf</code>), or link speed (<code>ethtool</code>). The older command is <code>ifconfig</code>.</p>`},
    {h: 'DHCP: automatic network settings', body: `
      <p>When a device joins a network, DHCP gives it its settings in four steps — <b>DORA</b>. Press Play on the drawing above and pick "DHCP (DORA)".</p>
      <ol><li><b>Discover</b>: the client broadcasts "I need an address."</li><li><b>Offer</b>: a DHCP server offers an address and settings.</li><li><b>Request</b>: the client asks to use that offer.</li><li><b>Acknowledge</b>: the server confirms, and the client configures itself.</li></ol>
      <p>DHCP provides the <b>IP address, subnet mask, default gateway, DNS servers, and lease time</b>. Leases are renewed partway through. A <b>reservation</b> always gives a device the same address; a <b>static</b> address is set by hand without DHCP. Broadcasts do not cross routers, so other subnets need a <b>DHCP relay</b>.</p>`},
    {h: 'DNS: names to addresses', body: `
      <p>DNS translates a name such as <code>fileserver01</code> into an IP address. Linux checks <code>/etc/hosts</code> first, then asks the DNS server in <code>/etc/resolv.conf</code>. The DNS server answers from its records (an <b>A record</b> maps name to IPv4) or asks other servers, and the answer is <b>cached</b>.</p>
      <div class="callout ok"><b class="tag">Key clue</b>If the IP works but the name fails ("Name or service not known"), the network is fine and the problem is name resolution. Check resolv.conf, whether the DNS server is reachable, <code>nslookup name</code> or <code>dig name</code>, wrong entries in /etc/hosts, and whether you need the full name (FQDN). If neither the name nor the IP works, the problem is lower down, not DNS.</div>`, widget: 'dnsOrder'},
    {h: 'A server that stops responding on the network', body: `
      <ol><li><b>Is the server alive?</b> Use the BMC console (Module 8). You cannot SSH into a crashed server.</li>
      <li><b>Physical</b>: link lights, cable, transceiver, switch port. <code>ethtool eth0</code> shows "Link detected". Try a known-good cable or port.</li>
      <li><b>NIC detected and driver loaded?</b> <code>lspci</code>, <code>lspci -k</code>, <code>ip link</code>, <code>dmesg</code>.</li>
      <li><b>Correct IP?</b> <code>ip a</code>: missing, 169.254 (DHCP failed), wrong subnet, or duplicate address.</li>
      <li><b>Gateway</b>: <code>ip route</code>, then ping the gateway. Then ping beyond it and use <code>traceroute</code>.</li>
      <li><b>Name resolution</b>: test by IP and by name.</li>
      <li><b>Service and firewall</b>: <code>systemctl status sshd</code>, <code>ss -tulpn</code>, firewall rules.</li>
      <li><b>What changed?</b> Then test from another machine, and document every check.</li></ol>`}
  ],
  check: [
    {q: 'Write out the four DHCP steps and what happens in each.', a: '1) Discover — the client broadcasts "I need an address." 2) Offer — a DHCP server offers an address and settings. 3) Request — the client asks to use that offer. 4) Acknowledge — the server confirms and the client configures itself (IP, mask, gateway, DNS servers, lease time).'},
    {q: 'In ip a, what do LOWER_UP, NO-CARRIER, and dynamic tell you?', a: 'LOWER_UP: a physical link is detected. NO-CARRIER: no link (cable, transceiver, or switch port). dynamic: the address came from DHCP (with valid_lft showing the lease time left); static addresses show "forever".'},
    {q: 'You can ping 10.1.1.50 but ssh server50 says "Could not resolve hostname". List four things to check.', a: 'The network is fine; it is name resolution. Check /etc/resolv.conf (right DNS server?), whether that DNS server is reachable, <code>nslookup server50</code> or <code>dig server50</code>, wrong entries in /etc/hosts, and whether you need the full name (FQDN, e.g. server50.lab.local).'},
    {q: 'A server shows 169.254.33.10. What happened?', a: 'It is a self-assigned address: the server asked DHCP and got no answer. Check the link and switch port/VLAN, whether the DHCP server is up, and whether this subnet needs a DHCP relay.'}
  ],
  lab: {
    id: 'lab-m7', title: 'The IP works, the name does not', ticket: 'Ticket 4533 · srv-r07-u12', sev: 'P3', xp: 60,
    brief: `<p>An engineer can ping <code>10.1.1.50</code> from this server, but <code>ssh server50</code> says <i>Could not resolve hostname</i>. Work bottom-up, prove which layer is broken, fix it, and verify. Start by watching a DHCP renewal so you know what settings this server is supposed to get.</p>`,
    rig: () => { const r = baseRig(); r.flags.resolvStatic = true; r.files['/etc/resolv.conf'] = '# Edited by hand during the 2025 migration (NetworkManager told not to manage DNS)\nsearch lab.local\nnameserver 10.20.9.5\n'; return r; },
    topo: r => topoNetwork(r, {remote: ['server50', '10.1.1.50 · other subnet']}),
    chips: ['sudo dhclient -v ens1f0', 'ip a', 'ip route', 'ping -c 4 10.1.1.50', 'ssh server50', 'cat /etc/resolv.conf', 'nslookup server50'],
    tasks: [
      {t: 'Renew the DHCP lease and watch DORA happen', cmd: /dhclient/, ok: (r, res) => true, hint: 'sudo dhclient -v ens1f0'},
      {t: 'Layer 1–3: link, address and gateway', cmd: /^ip\s+(a|addr|route|r)\b/, hint: 'ip a   then   ip route'},
      {t: 'Test by IP address', cmd: /ping.*10\.1\.1\.50/, hint: 'ping -c 4 10.1.1.50'},
      {t: 'Reproduce the failure by name', cmd: /(ssh|ping).*server50/, hint: 'ssh server50'},
      {t: 'Read the resolver configuration', cmd: /cat.*resolv\.conf|cat.*\/etc\/hosts/, hint: 'cat /etc/resolv.conf'},
      {t: 'Ask the configured DNS server, then the correct one (10.20.5.5) directly', cmd: /(nslookup|dig).*(10\.20\.5\.5)/, hint: 'nslookup server50 10.20.5.5'},
      {t: 'Fix the resolver configuration from the command line', when: r => parseResolv(r).ns[0] === '10.20.5.5', hint: 'sudo nano /etc/resolv.conf'},
      {t: 'Verify by name', cmd: /(ssh|ping|nslookup|dig).*server50/, ok: r => !!resolve(r, 'server50').ip}
    ],
    demo: ['sudo dhclient -v ens1f0', 'ip a show ens1f0', 'ip route', 'ping -c 2 10.1.1.50', 'ssh server50', 'cat /etc/resolv.conf', 'nslookup server50', 'nslookup server50 10.20.5.5', 'echo "nameserver 10.20.5.5" | sudo tee /etc/resolv.conf', 'ping -c 2 server50']
  }
});

/* ---------------- Module 8 ---------------- */
MODULES.push({
  id: 'm8', n: 8, title: 'The BMC and Out-of-Band Management', tagline: 'See and control a server when the OS cannot help',
  lead: 'The BMC is a tiny computer living inside the server, with its own processor, network port and power. When the main OS is frozen — or the server is switched off — the BMC is how you still see it and control it.',
  video: 'BMC out-of-band management explained · Serial over LAN (Wikipedia)',
  topo: () => topoOob(baseRig()),
  lessons: [
    {h: 'What the BMC is', body: `
      <p>The <b>BMC</b> (Baseboard Management Controller) is a small separate computer on the motherboard with its own processor, firmware, and network port. It runs on <b>standby power</b>, so it works even when the server is off, the OS has crashed, or no OS is installed. This is called <b>out-of-band management</b>.</p>
      <p>Vendor names: <b>iDRAC</b> (Dell), <b>iLO</b> (HPE), <b>XCC</b> (Lenovo), <b>IPMI/BMC</b> (Supermicro and others). It is used through a <b>web page</b>, the <b>IPMI protocol</b> (<code>ipmitool</code>), or <b>Redfish</b>.</p>
      <div class="callout"><b class="tag">Think of it like</b>A building's security desk: open all night on its own power line, with cameras (sensors), a logbook (SEL), and keys to every door (power control) — even when the offices upstairs are dark.</div>`},
    {h: 'What you can do with it', body: `
      <ul><li>Read the <b>System Event Log (SEL)</b>: memory, PCIe, power, fan, and temperature events with timestamps.</li>
      <li>Read <b>sensors</b>: temperatures, voltages, fan speeds, PSU status, power draw.</li>
      <li>See <b>hardware inventory</b> and health, and <b>firmware versions</b>.</li>
      <li>Use the <b>virtual console (KVM)</b> to see the screen, and <b>Serial Over LAN</b>.</li>
      <li><b>Control power</b>: on, off, reset, power cycle, or send an <b>NMI</b> to force a crash dump.</li>
      <li>Change <b>boot order</b> and mount an ISO as <b>virtual media</b>.</li></ul>
      <div class="tblwrap"><table class="tbl"><tr><th>ipmitool command</th><th>Does</th></tr>
      <tr><td><code>ipmitool sel elist</code></td><td>Event log</td></tr><tr><td><code>ipmitool sensor</code></td><td>Sensors</td></tr>
      <tr><td><code>ipmitool power status</code> / <code>power cycle</code></td><td>Power state / power cycle</td></tr>
      <tr><td><code>ipmitool fru print</code></td><td>Serial numbers</td></tr><tr><td><code>ipmitool sol activate</code></td><td>SOL console</td></tr></table></div>
      <p class="muted">From your laptop the same commands go over the network to the BMC: <code>ipmitool -I lanplus -H 10.99.0.12 -U admin -P &lt;pw&gt; sel elist</code>.</p>`},
    {h: 'When the OS is frozen but the BMC works', body: `
      <p><b>Collect evidence before rebooting</b>: look at the console (kernel panic?), check the SEL and sensors, check health and power, screenshot and save the logs, then power cycle. After it boots, read <code>journalctl -b -1</code>.</p>`},
    {h: 'SSH versus Serial Over LAN (SOL)', body: `
      <div class="tblwrap"><table class="tbl"><tr><th></th><th>SSH</th><th>SOL</th></tr>
      <tr><td>Type</td><td>In-band: runs inside the OS, over the normal network</td><td>Out-of-band: runs through the BMC and management network</td></tr>
      <tr><td>Needs the OS running?</td><td>Yes, plus working network and the sshd service</td><td>No</td></tr>
      <tr><td>What you see</td><td>A shell after the OS has booted and you log in</td><td>The serial console: BIOS/POST (if console redirection is on), GRUB, kernel boot messages, kernel panics</td></tr>
      <tr><td>Use it for</td><td>Daily work on a healthy server, running tests, copying logs</td><td>A server that will not boot, is frozen, or has lost its network; changing BIOS settings</td></tr></table></div>
      <div class="callout ok"><b class="tag">Remember</b>SSH talks to the operating system. SOL talks to the server's console through the BMC. If the OS is broken, SSH is gone but SOL still works. The virtual console (KVM) is the graphical version of SOL.</div>`, widget: 'sshSol'}

  check: [

    {q: 'List six things you can check or do through the BMC.', a: 'Read the SEL; read sensors (temps, voltages, fans, PSUs, power draw); see hardware inventory, health and firmware versions; use the virtual console (KVM) and Serial Over LAN; control power (on, off, reset, cycle, NMI for a crash dump); change boot order and mount an ISO as virtual media.'},
    {q: 'Give two reasons SSH could fail while SOL still works.', a: 'SSH needs the OS running, a working network and the sshd service. So: the OS has crashed or frozen (kernel panic), or the server lost its network (cable, NIC, IP or switch problem) — or sshd is stopped. SOL goes through the BMC on the management network and needs none of those.'}

MODULES.push({
  id: 'm9', n: 9, title: 'Boot Process', tagline: '"Powers on but will not boot" — find the broken link',
  lead: '"It powers on but won\'t boot" is not one problem — it is six possible problems, one for each stage of the boot chain. Your job is to find out how far it gets. Fans and lights only prove that power is on.',
  video: 'Linux Boot Process Explained Step by Step',
  topo: () => topoBoot(baseRig()),
  lessons: [
    {h: 'Booting is a chain', body: `
      <div class="tblwrap"><table class="tbl"><tr><th>Stage</th><th>What happens</th><th>Failure looks like</th></tr>
      <tr><td>1. Power and BMC</td><td>PSUs power the board</td><td>No lights, immediate shutoff, amber LED</td></tr>
      <tr><td>2. POST</td><td>Tests CPUs, trains memory, finds PCIe devices</td><td>Stuck POST code, beep codes, memory errors</td></tr>
      <tr><td>3. UEFI/BIOS</td><td>Finds a boot device in the boot order</td><td>"No bootable device", wrong device, PXE loop</td></tr>
      <tr><td>4. Bootloader (GRUB)</td><td>Loads the OS from the boot drive</td><td><code>grub rescue&gt;</code> prompt, file not found</td></tr>
      <tr><td>5. Kernel</td><td>Loads drivers and the root filesystem</td><td>Kernel panic, "Unable to mount root fs"</td></tr>
      <tr><td>6. System startup</td><td>Mounts filesystems, starts services</td><td>"Emergency mode" (often /etc/fstab or a failing disk)</td></tr></table></div>`},
    {h: 'The approach', body: `
      <ol><li>Watch the console (BMC virtual console, SOL, or monitor) and note exactly where it stops.</li>
      <li>Check the BMC event log and health for CPU, memory, PCIe, or power errors.</li>
      <li>Be patient: memory training on large servers can take several minutes.</li>
      <li>Stuck in POST: look up the code; suspect memory, CPU, or a PCIe card; reseat.</li>
      <li>No boot device: is the drive seen in BIOS? Check boot order, UEFI versus Legacy mode, Secure Boot, cables, RAID controller.</li>
      <li>Fails in GRUB or kernel: read the exact message; suspect the boot partition, a storage driver, or the drive.</li>
      <li>Minimum configuration: strip to one CPU, one DIMM, no cards, then add parts back one at a time.</li>
      <li>Ask what changed, check firmware, and document.</li></ol>`},
    {h: 'Minimum configuration', body: `<p>Strip the server to <b>one CPU, one DIMM, no cards</b>. If it boots, add parts back <b>one at a time</b> until it fails — the last part added is your suspect. Use it when POST hangs and you cannot tell which part is to blame. Try it on the bench below (physical, no CLI):</p>`, widget: 'minConfig'}
  ],
  check: [
    {q: 'List the boot stages in order.', a: '1) Power and BMC, 2) POST, 3) UEFI/BIOS (finds a boot device), 4) bootloader (GRUB), 5) kernel, 6) system startup (mounts filesystems, starts services).'},
    {q: 'A server shows the BIOS logo, then "No bootable device". Name four things to check.', a: 'Is the drive seen in BIOS? Boot order; UEFI versus Legacy mode; Secure Boot; cables; the RAID controller. Also ask what changed and check firmware.'},
    {q: 'What is a minimum configuration test, and when would you use it?', a: 'Strip the server to one CPU, one DIMM and no cards, then add parts back one at a time until it fails. Use it when the server will not get through POST (or boots inconsistently) and you cannot tell which part is responsible.'}
  ],
  lab: {

    brief: `<p>The data drive in Bay 3 was pulled for RMA this morning. Since the next reboot the server never comes back on the network. You are at your laptop. Watch the console through SOL, find the stage where it stops, fix it from the console, and verify.</p>`,

      const bad = rr => (rr.files['/etc/fstab'] || '').split('\n').some(l => !l.trim().startsWith('#') && l.includes('/dev/nvme3n1'));

    tasks: [

MODULES.push({
  id: 'm10', n: 10, title: 'Troubleshooting Method', tagline: 'Prove it, one change at a time, and write it down',
  lead: 'Good technicians are not the ones who guess right. They are the ones who prove things — one change at a time — and write it down so the next person, and the next unit, benefits.',
  video: 'The 5 Whys Explained',
  topo: () => topoMethod(baseRig()),
  lessons: [
    {h: 'The process', body: `
      <ol><li><b>Identify the problem</b>: exact symptom, when it started, what changed, can it be reproduced.</li><li><b>Theory of probable cause</b>: simplest and most likely first.</li><li><b>Test the theory</b>; if wrong, form a new one or escalate.</li><li><b>Plan and apply the fix</b>, following procedures.</li><li><b>Verify full functionality</b>: retest the failure and run the full test.</li><li><b>Document</b> findings, actions, and results.</li></ol>
      <p>Graders use the same pattern: gather information → check the evidence → simple physical things first → isolate by swapping one change at a time → fix and verify → document and prevent.</p>`},
    {h: 'Symptom versus root cause: the 5 Whys', body: `
      <p>A <b>symptom</b> is what you observe ("the GPU is not detected"). The <b>root cause</b> is why it happened. Fixing only the symptom lets the problem come back. Walk the chain:</p>`, widget: 'fiveWhys'},
    {h: 'Change one variable at a time', body: `
      <p>If you reseat a card, swap its cable, and update firmware at once, and the problem goes away, you do not know which change fixed it. Changing one thing at a time tells you the real cause, avoids new problems, keeps results repeatable, and avoids replacing good parts.</p>`, widget: 'oneVar'},
    {h: 'Isolation techniques', body: `
      <ul><li><b>Swap with known-good</b>: move the suspect part to a working slot or system, or put a known-good part in the suspect location. If the problem <b>follows the part</b>, the part is bad. If it <b>stays with the location</b>, suspect the slot, cable, riser, or board.</li>
      <li><b>Half-splitting</b>: split the possible causes in half and test which half has the problem.</li>
      <li><b>Minimum configuration</b> and comparison with a <b>golden</b> (known-good) unit.</li></ul>`, widget: 'halfSplit'},
    {h: 'When the failure follows the part', body: `
      <p>If the failure follows a part into a known-good system, the part is very likely bad. But it does <b>not</b> prove the original system is healthy: a bad slot or power problem may have damaged the part.</p>
      <p>Next: <b>tag and quarantine</b> the bad part, <b>return the good system to its original state and retest it</b>, <b>inspect the original slot and test the original system with a known-good part</b>, <b>document both serials</b>, and start the <b>RMA</b> process. Press Play on "Fault follows the part" above.</p>`},
    {h: 'Unfamiliar and intermittent problems', body: `
      <p><b>Unfamiliar</b>: stay calm and do not guess. Write down the exact symptoms and messages, gather logs, read the service guide and documentation, search the exact error message, break the problem into layers, test one theory at a time, and escalate with your data when stuck. Document what you learn.</p>
      <p><b>Intermittent — collect</b>: exact errors, timestamps and frequency, which tests pass and fail, temperature and load at the time, logs (dmesg, journal, SEL), serial numbers, firmware and driver versions, and whether other units show it.</p>
      <p><b>Intermittent — troubleshoot</b>: look for a pattern (only under load, only when hot, only in one slot), reproduce it on purpose with looped or stress tests, check seating and cables, look for corrected errors that warn of a weak link, swap one variable at a time, run enough cycles to trust the result, and compare with a golden unit.</p>`},
    {h: 'Why documentation matters', body: `
      <p>It gives <b>traceability</b> (what was wrong, what was replaced, by serial number), reveals <b>patterns</b> across units and batches, speeds up <b>future repairs and shift handoffs</b>, supports <b>RMA and warranty</b> claims, and meets <b>quality and audit</b> requirements.</p>
      <p>Record the unit serial, symptom, steps and results, parts changed, firmware versions, root cause, fix, and verification.</p>`}
  ],
  check: [
    {q: 'Explain symptom versus root cause, with your own example.', a: 'A symptom is what you observe; the root cause is why it happened. Example: symptom "NIC link down"; why — transceiver not latched; why — it was pushed in without the click; why — the assembler was never shown the latch; why — the work instruction has no picture of it. Root cause: the work instruction, not the single unit. Fixing only the symptom lets it come back.'},
    {q: 'Give three reasons to change only one variable at a time.', a: 'It tells you the real cause; it avoids introducing new problems; it keeps results repeatable; and it avoids replacing good parts.'},
    {q: 'A failure follows a part into a known-good system. What does that prove, and what does it not prove?', a: 'It proves the part is very likely bad. It does not prove the original system is healthy — a bad slot or power problem there may have damaged the part. So tag and quarantine the part, restore and retest the good system, test the original system with a known-good part, document both serials, start the RMA.'},
    {q: 'List five reasons documentation matters after a repair.', a: 'Traceability (what was wrong and replaced, by serial); revealing patterns across units and batches; faster future repairs and shift handoffs; supporting RMA and warranty claims; meeting quality and audit requirements.'}
  ],
  lab: {
    id: 'lab-m10', title: 'It fails about once in ten runs', ticket: 'Ticket 4562 · srv-r07-u12', sev: 'P3', xp: 70,
    brief: `<p>The network throughput test <code>./test.sh</code> fails roughly one run in ten, and nobody can make it fail on demand. Turn it into a failure you can reproduce, find the pattern, change <b>one</b> thing, and run enough cycles to trust the result.</p>`,
    rig: () => {
      const r = baseRig();
      r.ifaces[0].stats = {crc: 412, flaps: 6, sym: 88};
      r.ifaces[0].xcvr = {type: 'QSFP28', vendor: 'Mellanox', pn: 'MMA1B00-C100D', len: '100 m (OM4 fiber, SR4)', rx: [-1.9, -2.2, -2.0, -2.1]};
      r.hooks.cmd = {'./test.sh': (a, X) => {
        const q = X.r; q.testRun = (q.testRun || 0) + 1;
        const fail = !q.flags.fixed && q.testRun % 10 === 7;
        if (fail) { const t = (q.now - q.bootAt) / 1000; q.dmesg.push({t, lvl: 6, m: 'mlx5_core 0000:3b:00.0 ens1f0: Link down'}, {t: t + 2, lvl: 6, m: 'mlx5_core 0000:3b:00.0 ens1f0: Link up'}); q.ifaces[0].stats.crc += 97; q.ifaces[0].stats.flaps += 1; }
        return `${fmtIso(q.now)} run ${q.testRun}: ${fail ? 'FAIL throughput 3.1 Gb/s (expected > 90) — connection reset by peer' : 'PASS 94.2 Gb/s'}`;
      }};
      return r;
    },
    topo: r => topoNetwork(r, {}),
    chips: ['for i in $(seq 1 20); do ./test.sh >> results.txt; done', 'grep -c FAIL results.txt', 'grep FAIL results.txt', 'dmesg -T | grep -i ens1f0', 'ethtool -S ens1f0'],
    tasks: [
      {t: 'Reproduce on purpose: loop the test 20 times and save every result', cmd: /for .*seq.*test\.sh.*>>/, hint: 'for i in $(seq 1 20); do ./test.sh >> results.txt; done'},
      {t: 'Count the failures', cmd: /grep\s+-\w*c\w*\s+FAIL|grep.*FAIL.*wc -l/, hint: 'grep -c FAIL results.txt'},
      {t: 'Get the exact failure lines and timestamps', cmd: /grep\s+(-\w+\s+)?FAIL\s+results/, hint: 'grep FAIL results.txt'},
      {t: 'Look for kernel messages at the same times', cmd: /dmesg.*(ens1f0|link|mlx5)/i, hint: 'dmesg -T | grep -i ens1f0'},
      {t: 'Check the NIC error counters (corrected errors warn of a weak link)', cmd: /ethtool\s+-S/, hint: 'ethtool -S ens1f0'},
      {t: 'Check the transceiver', cmd: /ethtool\s+-m/, hint: 'ethtool -m ens1f0'},
      {t: 'Change one thing: work on the cable/transceiver in the drawing', when: r => r.flags.fixed},
      {t: 'Run enough cycles to trust it: at least 20 more runs, zero failures', cmd: /for .*seq.*test\.sh/, ok: r => r.flags.fixed && (r.testRun - r.flags.fixedAt) >= 20}
    ],
    actions: [
      {id: 'look', node: 'srv', kind: 'look', label: 'Inspect the QSFP transceiver and fiber at ens1f0', do: r => { r.flags.looked = true; return say(L('w', 'The QSFP transceiver is not fully latched: the pull-tab sits 2 mm proud of its neighbours.'), 'The fiber end faces look clean under the scope.'); }},
      {id: 'reseat', node: 'srv', kind: 'fix', label: 'Reseat the transceiver until it clicks, then reconnect the fiber', do: r => { r.flags.fixed = true; r.flags.fixedAt = r.testRun || 0; r.ifaces[0].stats = {crc: 0, flaps: 0, sym: 0}; return L('g', 'Transceiver latched. Counters cleared so you can see whether new errors appear.'); }},
      {id: 'swapsw', node: 'sw', kind: 'cable', label: 'Move the cable to a different switch port', do: r => say(L('w', 'Not yet — that is a second variable.'), L('d', 'Only change one thing per test cycle. Try the transceiver first, because the evidence (CRC errors, link down/up) points at the physical link at the server end.'))}
    ],
    demo: ['for i in $(seq 1 20); do ./test.sh >> results.txt; done', 'grep -c FAIL results.txt', 'grep FAIL results.txt', 'dmesg -T | grep -i ens1f0', 'ethtool -S ens1f0', '#look', '#reseat', 'for i in $(seq 1 30); do ./test.sh >> after.txt; done', 'grep -c FAIL after.txt']
  }

MODULES.push({
  id: 'm11', n: 11, title: 'Scenario Playbooks', tagline: 'Ready-made plans for the common failures',
  lead: 'These are the moves you will make again and again. Learn the order: count at each layer, read the logs, check the simple physical things, look at the topology, swap to see whether it follows the part, then verify and document.',
  topo: () => topoPcie(baseRig(), {title: 'A 4-GPU server — the map you use for Playbook B'}),
  lessons: [
    {h: 'A. A component is not detected', body: '', widget: 'playbookA'},
    {h: 'B. A GPU in one slot is missing (3 of 4 detected)', body: '', widget: 'playbookB'},
    {h: 'C. A network card is detected but cannot communicate', body: '', widget: 'playbookC'},
    {h: 'D. Root cause was a cable connected wrong during assembly', body: `
      <ol><li>Verify the unit fully passes and the mistake caused no damage.</li><li>Document the unit, the cable, wrong versus correct port, and test results (photos if allowed).</li><li>Notify your lead, quality, and assembly.</li><li><b>Contain</b>: check other units from the same line, shift, or batch, including units waiting to ship.</li><li><b>Prevent</b>: update the work instruction with clear pictures, add labels or color coding, use mistake-proofing (keyed connectors, cable lengths that only reach the right port), and add an inspection step. Track it through the site's corrective action process (CAPA).</li></ol>
      <div class="callout"><b class="tag">Focus</b>Focus on the process, not on blaming a person.</div>`, widget: 'assembly'},
    {h: 'More scenarios to practice', body: `<p>Plan your approach to each of these using the six-step pattern, then flip the card to compare.</p>`, widget: 'moreScenarios'}
  ],
  check: [
    {q: 'A server should have two NICs but only one appears in lspci. Outline your steps.', a: 'Confirm what is expected from the build sheet. Check BIOS/BMC inventory: if they do not see it either, it is physical or firmware. Powered off with ESD protection: seating, latches, riser, power and data cables. BIOS: slot enabled, bifurcation; firmware. Topology: are other devices on the same path missing too (lspci -tv)? Then suspect the shared part. Swap to see whether it follows the card or stays with the slot. Fix, verify, document.'},
