  actions: [{id: 'look', node: 'dimm:F1', kind: 'look', label: 'Inspect DIMM F1', do: r => { r.flags.looked = true; return r.flags.f1 ? L('e', 'A DIMM IS in F1 — but one latch is open and the module sits crooked: not seated.') : 'Seated, latches closed.'; }}, {id: 'reseat', node: 'dimm:F1', kind: 'fix', label: 'Power off, reseat DIMM F1 until both latches click', reboot: 'cycle', do: r => { r.flags.f1 = false; return 'Reseated, both latches closed. Powering on.'; }}],
  hint: ['Missing ≈ 64 GB = one DIMM. Which slot? <code>sudo dmidecode -t memory</code> — look for "No Module Installed" where the build sheet says there should be one.', 'BIOS: any DIMM disabled? BMC SEL: memory errors at POST that made the BIOS disable a DIMM?', 'Physical: seating and latches; population rules (right slots, matching parts).', 'Fix, verify with free -h and dmidecode, run a memory test, document.'],
  answer: `<p>About 64 GB is missing — the size of <b>one DIMM</b>.</p><ol><li><b>Map every slot</b>: <code>sudo dmidecode -t memory</code> lists each slot's size, part and serial, or <b>"No Module Installed"</b>. Compare with the build sheet: a slot that should be full but reports no module is your suspect (here CPU2_DIMM_F1).</li><li><b>BIOS</b>: check for DIMMs <b>disabled</b> by the BIOS (often after errors at POST).</li><li><b>BMC SEL</b>: memory errors or configuration errors for that slot.</li><li><b>Physical</b> (powered off, ESD): is the DIMM <b>seated with both latches closed</b>? Correct part? Do the <b>population rules</b> allow that slot? (Here the DIMM was present but not seated.)</li><li>If seating does not fix it, <b>swap test</b> (DIMM vs slot), as for memory errors.</li><li><b>Verify</b>: <code>free -h</code> shows 1 TB, dmidecode lists all 16, run a memory test; <b>document</b>.</li></ol>`,
  keys: [K('one DIMM ≈ 64 GB', '64|one DIMM'), K('dmidecode', 'dmidecode'), K('No Module Installed', 'no module'), K('build sheet / expected', 'build sheet|expect'), K('BIOS disabled DIMM', 'disabl|BIOS'), K('SEL memory errors', 'SEL|error'), K('seating / latches', 'seat|latch'), K('population rules', 'population|slot rule'), K('verify / memory test', 'verif|test|free -h'), K('document', 'document')]
});

M({n: 35, set: 'B', topic: 'ip a shows 169.254', reread: ['m7'],
  q: 'Here is part of the ip a output from a server that cannot reach anything on the network. What does it tell you, what is most likely wrong, and what would you check next?',
  code: '3: ens2f1: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 9000 qdisc mq state UP\n    link/ether b8:ce:f6:4a:10:22 brd ff:ff:ff:ff:ff:ff\n    inet 169.254.88.4/16 brd 169.254.255.255 scope link ens2f1',
  brief: '<p>This server matches the output in the question. Read it, prove what failed, and get it fixed — some of the fix belongs to the network team.</p>',
  rig: () => {
    const r = baseRig(); const d = r.devs.nic0; d.slot = '2'; d.label = 'NIC (Slot 2)';
    r.ifaces[0].name = 'ens2f0'; r.ifaces[0].admin = false; r.ifaces[0].carrier = false; r.ifaces[0].ip = null; r.ifaces[0].mac = 'b8:ce:f6:4a:10:21';
    Object.assign(r.ifaces[1], {name: 'ens2f1', admin: true, carrier: true, mtu: 9000, mac: 'b8:ce:f6:4a:10:22', ip: '169.254.88.4', prefix: 16, dynamic: false, linklocal: true});
    r.net.ports.ens2f1 = {vlanOk: false, mtu: 9216, dhcp: true}; r.net.ports.ens2f0 = {vlanOk: true, mtu: 1500, dhcp: true}; r.net.dhcp.lease.ens2f1 = '10.20.5.14';
    r.flags.focusIf = 'ens2f1'; r.flags.resolvStatic = false;
    return refresh(r);
  },
  topo: r => topoNetwork(r),
  chips: ['ip a show ens2f1', 'ip route', 'ethtool ens2f1', 'sudo dhclient -v ens2f1', 'ping -c 2 10.20.5.1'],
  tasks: [{t: 'Read the interface', cmd: /^ip\s+(a|addr)/}, {t: 'Is there a default route?', cmd: /^ip\s+(r|route)/}, {t: 'Physical link confirmed?', cmd: /ethtool\s+ens2f1|ip a/}, {t: 'Ask DHCP again and watch', cmd: /dhclient/}, {t: 'Get the switch side checked', when: r => r.net.ports.ens2f1.vlanOk}, {t: 'Renew and verify a real address and the gateway', cmd: /dhclient|ping.*10\.20\.5\.1/, ok: r => r.ifaces[1].ip && !r.ifaces[1].ip.startsWith('169.254')}],
  actions: [{id: 'net', kind: 'ask', label: 'Ask the network team to check the switch port for ens2f1 (VLAN, DHCP relay)', do: r => { r.net.ports.ens2f1.vlanOk = true; return 'Network team: "That port was in VLAN 30, which has no DHCP relay. Moved to VLAN 20." Renew DHCP now.'; }}],
  hint: ['Read it: ens2f1, UP (enabled), LOWER_UP (physical link OK), mtu 9000 (jumbo — must match the switch), MAC, 169.254.88.4/16, scope link, no "dynamic".', '169.254.x.x = self-assigned: the server asked DHCP and got no answer. Link is fine, so it is above layer 1.', 'Next: is the DHCP server up and reachable; switch port VLAN; DHCP relay for this subnet; is this port meant to be static or reserved; then renew (and check no default route, MTU match).'],
  answer: `<p><b>What it tells you:</b> interface <b>ens2f1</b> is <b>UP</b> (enabled) and <b>LOWER_UP</b> (physical link detected — cable and switch port have link). <b>mtu 9000</b> = jumbo frames, which must match the switch. MAC b8:ce:f6:4a:10:22. The address <b>169.254.88.4/16</b> with <b>scope link</b> and no "dynamic" is a <b>self-assigned (link-local) address</b>.</p><p><b>Most likely wrong:</b> <b>DHCP failed</b> — the server asked for an address and <b>got no answer</b>, so it gave itself 169.254.x.x. With that address it has no default route and cannot reach anything beyond the link.</p><p><b>Check next:</b></p><ol><li><code>ip route</code> (no default gateway), and renew with <code>sudo dhclient -v ens2f1</code> to watch for an Offer.</li><li>Is the <b>DHCP server</b> up and reachable? Is this port in the right <b>VLAN</b> on the switch? Does this subnet need a <b>DHCP relay</b> (broadcasts do not cross routers)?</li><li>Should this port have a <b>static</b> address or a reservation instead?</li><li>Also confirm the <b>MTU</b> matches the switch. Then renew, verify a real address, ping the gateway, document.</li></ol>`,
  keys: [K('UP = enabled', '\\bUP\\b|enabled'), K('LOWER_UP = link ok', 'LOWER.?UP|link'), K('MTU 9000 must match', 'mtu|jumbo|9000'), K('169.254 self-assigned', '169\\.254|self.?assign|link.?local'), K('DHCP failed / no answer', 'DHCP'), K('no default route', 'route|gateway'), K('DHCP server reachable', 'server'), K('VLAN', 'VLAN'), K('relay', 'relay'), K('static / reservation', 'static|reserv'), K('renew', 'renew|dhclient')]
});

M({n: 36, set: 'B', topic: 'Small pings work, big transfers hang', reread: ['m11'],
  q: 'One port of a dual-port network card works. The other has a link and a valid IP address on the same subnet as its gateway, but small pings succeed while large file transfers hang. What do you suspect, and how would you confirm it?',
  brief: '<p>ens1f0 works. ens1f1 has a link and an address on the gateway\'s subnet, but large transfers hang. Prove the cause with pings of different sizes, sent out of ens1f1 (<code>-I ens1f1</code>).</p>',
  rig: () => { const r = baseRig(); Object.assign(r.ifaces[1], {admin: true, carrier: true, ip: '10.20.5.15', prefix: 24, dynamic: true, lft: 86000, mtu: 9000}); r.net.ports.ens1f1.mtu = 1500; r.net.ports.ens1f0.mtu = 1500; r.flags.focusIf = 'ens1f1'; return refresh(r); },
  topo: r => topoNetwork(r),
  chips: ['ip a', 'ping -I ens1f1 -c 3 10.20.5.1', 'ping -I ens1f1 -M do -s 8972 -c 3 10.20.5.1', 'ping -I ens1f1 -M do -s 1472 -c 3 10.20.5.1', 'sudo ip link set ens1f1 mtu 1500'],
  tasks: [{t: 'Compare the two ports in ip a', cmd: /^ip\s+(a|addr)/}, {t: 'Small ping out of ens1f1 works', cmd: /ping.*-I\s+ens1f1(?!.*-s)/}, {t: 'Large ping with Don\'t Fragment fails', cmd: /ping.*ens1f1.*-M do.*-s\s+(8972|[2-9]\d{3})|ping.*-s\s+(8972|[2-9]\d{3}).*ens1f1/}, {t: 'A 1500-byte ping works', cmd: /ping.*-s\s+1472/}, {t: 'Make the MTUs match', when: r => r.ifaces[1].mtu === 1500 || r.net.ports.ens1f1.mtu >= 9000}, {t: 'Verify large packets now pass', cmd: /ping.*ens1f1/, ok: r => r.ifaces[1].mtu <= r.net.ports.ens1f1.mtu}],
  actions: [{id: 'jumbo', kind: 'ask', label: 'Ask the network team to enable jumbo frames (MTU 9216) on ens1f1\'s switch port', do: r => { r.net.ports.ens1f1.mtu = 9216; return 'Network team: "Te1/0/15 now MTU 9216." Re-test the large ping.'; }}],
  hint: ['Suspect an <b>MTU mismatch</b>: server port at 9000 (jumbo), switch port at 1500. Small packets fit; large ones are dropped.', 'Confirm: <code>ip a</code> shows mtu 9000 on ens1f1 vs 1500 on the working port.', 'Ping with Don\'t Fragment: <code>ping -M do -s 8972</code> (9000 bytes) fails; <code>-s 1472</code> (1500) works.', 'Fix: match the MTU on both ends (server down to 1500, or switch up to jumbo), retest, document.'],
  answer: `<p><b>Suspect an MTU mismatch.</b> The link, IP and gateway are fine (small pings work), so the problem is packet size: the server sends large frames that the switch port will not pass. Typical cause: the server port is set to <b>MTU 9000 (jumbo frames)</b> and the <b>switch port is at 1500</b> — jumbo frames must match on both ends.</p><p><b>Confirm:</b></p><ol><li><code>ip a</code>: ens1f1 shows <b>mtu 9000</b>; the working port shows 1500.</li><li>Ping the gateway out of that port with "don't fragment": <code>ping -I ens1f1 -M do -s 8972 10.20.5.1</code> (a 9000-byte packet) <b>fails</b>, while <code>ping -I ens1f1 -M do -s 1472 10.20.5.1</code> (1500 bytes) <b>works</b>.</li><li>Check the switch port's MTU with the network team; compare with the working port.</li></ol><p><b>Fix</b>: make both ends match — set the server to 1500 (<code>sudo ip link set ens1f1 mtu 1500</code>) or enable jumbo frames on the switch port — then retest a large transfer and <b>document</b>. (Also rule out a wrong VLAN or ARP, but those break small pings too.)</p>`,
  keys: [K('MTU mismatch', 'MTU'), K('jumbo / 9000', 'jumbo|9000'), K('switch 1500', '1500|switch'), K('both ends must match', 'match|both ends'), K('ip a shows mtu', 'ip a'), K('large ping test', 'ping|-s'), K('don\'t fragment', 'fragment|-M do'), K('compare with working port', 'compare|working port|other port'), K('fix and retest', 'retest|verif|set'), K('document', 'document')]
});

M({n: 37, set: 'B', topic: 'GPU falls off the bus under stress', reread: ['m11', 'm12'],
  q: 'In a 4-GPU server, the GPU in slot 2 disappears from nvidia-smi and lspci after 30 to 60 minutes of a stress test, and comes back after a cold power cycle. Before it vanished, dmesg showed “GPU has fallen off the bus”. Describe the data you would collect, the hypotheses you would test in order, and how you would prove the root cause.',
  brief: '<p>GPU 0 lives in Slot 2. Reproduce the fall-off with <code>dcgmi diag</code> while watching temperature, test the hypotheses in order, change one thing, and prove it over repeated runs.</p>',
  rig: () => {
    const r = baseRig({upDays: 0}); r.flags.airGap = true;
    r.journal.prevBoots.unshift(prevBoot(new Date(+r.bootAt - 5 * 3600e3), new Date(+r.bootAt - 120e3), [{dt: -900, src: 'kernel', lvl: 3, m: 'NVRM: GPU at PCI:0000:19:00: GPU-6a1f0c4e'}, {dt: -900, src: 'kernel', lvl: 3, m: 'NVRM: Xid (PCI:0000:19:00): 79, pid=8811, name=dcgmi, GPU has fallen off the bus.'}, {dt: -899, src: 'kernel', lvl: 3, m: 'NVRM: GPU 0000:19:00.0: GPU has fallen off the bus.'}]));
    sel(r, '06:40:12', 'Temperature GPU0 Temp #0x59', 'Upper Critical going high (92 C)', 'e');
    r.hooks.cmd = {dcgmi: (a, X) => {
      const q = X.r; const g = q.gpuInfo.gpu0; const st = [{d: 300, line: 'Successfully started diagnostic -r 3 (targeted stress, 4 GPUs). Live GPU 0 (Slot 2) readings:'}];
      const temps = q.flags.airGap ? [71, 79, 85, 89, 92] : [68, 71, 73, 74, 74];
      temps.forEach((tp, k) => st.push({d: 900, line: null, fx: qq => { qq.gpuInfo.gpu0.temp = tp; qq.gpuInfo.gpu0.pwr = 330; qq.now = new Date(+qq.now + 600e3); return `  +${(k + 1) * 10} min  GPU0 ${tp} C  330 W` + (tp >= 85 ? '  ← hot' : ''); }}));
      if (q.flags.airGap) st.push({d: 700, line: null, fx: qq => { const t = (qq.now - qq.bootAt) / 1000; qq.dmesg.push({t, lvl: 3, m: 'NVRM: Xid (PCI:0000:19:00): 79, pid=9120, name=dcgmi, GPU has fallen off the bus.'}); qq.devs.gpu0.offbus = true; qq.gpuInfo.gpu0.fell = true; return L('e', '| Targeted Stress   | FAIL — GPU 0: GPU has fallen off the bus (Xid 79)'); }});
      else st.push({d: 400, line: L('g', '| Targeted Stress   | PASS — all 4 GPUs')}, {d: 0, line: null, fx: qq => { qq.flags.passes = (qq.flags.passes || 0) + 1; return L('d', `(clean runs since the change: ${qq.flags.passes})`); }});
      return {stream: st};
    }};
    r.hooks.onBoot = rr => { rr.devs.gpu0.offbus = false; rr.gpuInfo.gpu0.fell = false; };
    return refresh(r);
  },
  topo: r => topoChassis(r),
  chips: ['journalctl -b -1 -k | grep -i -E "xid|fallen"', 'sudo ipmitool sel elist', 'dcgmi diag -r 3', 'nvidia-smi', 'lspci | grep -i nvidia | wc -l', 'nvidia-smi -q | grep -i -E "serial|vbios"'],
  tasks: [{t: 'Collect: the Xid evidence from the previous boot', cmd: /journalctl.*-b\s+-1/}, {t: 'Collect: BMC events (temperature, power) at the same time', cmd: /ipmitool.*sel/}, {t: 'Collect: serials, VBIOS, driver', cmd: /nvidia-smi\s+-q|nvidia-smi$/}, {t: 'Reproduce under stress while watching temperature', cmd: /dcgmi/, ok: r => r.devs.gpu0.offbus || r.flags.airGap === false}, {t: 'Hypothesis 1, thermal: inspect Slot 2 airflow', when: r => r.flags.thermal}, {t: 'Hypothesis 2, power: aux cable and PSUs', when: r => r.flags.power}, {t: 'Change one thing (cold power cycle afterwards)', when: r => !r.flags.airGap}, {t: 'Prove it: three clean stress runs in a row', cmd: /dcgmi/, ok: r => (r.flags.passes || 0) >= 3}],
  actions: [
    {id: 'thermal', node: ['gpu0', 'baffle'], kind: 'look', label: 'Hypothesis 1 — thermal: inspect airflow over Slot 2', do: r => { r.flags.thermal = true; return r.flags.airGap ? say(L('e', 'The filler blank for the empty slot next to GPU 0 is missing and the GPU section of the air baffle is cracked: hot exhaust recirculates into GPU 0\'s inlet.'), 'Fans fine, heatsink fine.') : 'Airflow parts in place.'; }},
    {id: 'power', node: ['gpu0', 'psu1', 'psu2'], kind: 'look', label: 'Hypothesis 2 — power: GPU 0 aux cable and both PSUs', do: r => { r.flags.power = true; return L('g', 'Aux power cable latched; PS1 and PS2 OK in the BMC, no power events in the SEL.'); }},
    {id: 'signal', node: ['gpu0', 'riser1'], kind: 'look', label: 'Hypothesis 3 — signal: seating, Riser 1, retimer', do: r => { r.flags.signal = true; return L('g', 'Seated, latch closed; Riser 1 seated; no AER errors before the Xid.'); }},
    {id: 'fix', node: ['gpu0', 'baffle'], kind: 'fix', label: 'Install the slot blank and replace the baffle section, then cold power cycle', reboot: 'cycle', do: r => { r.flags.airGap = false; r.flags.passes = 0; return 'Blank installed, baffle section replaced. Cold power cycle.'; }}
  ],
  hint: ['Collect: the exact Xid (79 = fallen off the bus) and timestamps, temperature and power at the time, which slot, how long into the test, GPU serial/VBIOS/driver/firmware, SEL (thermal, power), AER messages, whether other units show it.', 'Hypotheses in order (simplest/most likely first): <b>heat</b> (airflow parts, fans, heatsink), <b>power</b> (aux cable, PSU), <b>signal</b> (seating, riser, retimer, corrected errors), then the <b>GPU</b> itself.', 'Prove it: reproduce on purpose, change one variable, then run enough clean cycles. Swap the GPU with another slot: follows the GPU → GPU; stays with the slot → slot/airflow/power.', 'Document.'],
  answer: `<p><b>Data to collect:</b> the exact kernel messages (<b>Xid 79</b> "fallen off the bus") with timestamps — from the saved dmesg or <code>journalctl -b -1 -k</code>; <b>how long</b> into the test it happens; <b>temperature and power</b> of the GPU at that time (nvidia-smi logging, BMC sensors); the <b>BMC SEL</b> (thermal or power events); <b>PSU status</b>; any <b>AER</b> errors before it fell; the GPU <b>serial, VBIOS, driver and firmware</b> versions; and whether other units or slots show it.</p><p><b>Hypotheses, in order</b> (Xid 79 is often power, heat, or signal):</p><ol><li><b>Thermal</b> — it only fails after 30–60 minutes of load: airflow parts (baffles, blanks), fans, cables blocking air, heatsink contact.</li><li><b>Power</b> — auxiliary power cable, PSU status and redundancy.</li><li><b>Signal</b> — seating, riser, retimer; corrected errors warning of a weak link.</li><li>The <b>GPU itself</b>.</li></ol><p><b>Proving the root cause:</b> reproduce it on purpose with the stress test while logging temperature (here GPU 0 climbed to 92 °C before Xid 79); change <b>one</b> thing (the missing slot blank and cracked baffle); cold power cycle; then run <b>enough cycles</b> to trust it (several full-length clean runs at normal temperature). A <b>swap</b> of GPU 0 with another slot confirms: if the fault stays with Slot 2, it is the location, not the GPU. Compare with a golden unit, and <b>document</b>.</p>`,
  keys: [K('Xid 79', 'Xid|79|fallen'), K('timestamps / time into test', 'timestamp|minutes|time'), K('temperature', 'temp|thermal|heat'), K('power / PSU / aux', 'power|PSU|aux'), K('SEL', 'SEL|BMC'), K('AER / signal', 'AER|signal|riser|retimer'), K('serial / VBIOS / driver', 'serial|VBIOS|driver|firmware'), K('order: heat, power, signal, GPU', 'order|first'), K('reproduce', 'reproduc|stress'), K('one change', 'one (change|thing|variable)'), K('enough cycles', 'cycle|repeat|several'), K('swap GPU / slot', 'swap|follow|stay'), K('document', 'document')]
});

M({n: 38, set: 'B', topic: 'No bootable device after a part swap', reread: ['m9'], start: 'laptop',
  q: 'A server booted fine yesterday. Overnight, someone replaced the PCIe adapter card that holds the boot NVMe drive, and now the console shows the BIOS logo and then “No bootable device”. Describe your approach.',
  brief: '<p>Something changed overnight: the boot drive\'s adapter card. Watch the console, then work Stage 3 of the boot chain: does the BIOS see the drive? If not, why not? If yes, what does the boot order say?</p>',
  rig: () => {
    const r = baseRig({upDays: 0}); r.flags.bif = 'x16'; r.flags.entry = false;
    const apply = rr => { rr.devs.nvme0.present = rr.flags.bif === 'x4x4x4x4'; rr.boot.fail = (!rr.devs.nvme0.present || !rr.flags.entry) ? 'nobootdev' : null; rr.boot.order = rr.flags.entry ? 'Rocky Linux (NVMe PM174X)' : 'UEFI PXE IPv4 (ens1f0)'; };
    r.hooks.onBoot = apply; apply(r); refresh(r); r.os.state = 'bootfail'; r.bootTail = bootStream(r).map(s => s.line).filter(x => x != null);
    sel(r, '22:40:02', 'Add-in Card Slot 6 #0x96', 'Device removed / inserted (adapter replaced)', null, -1);
    return r;
  },
  topo: r => { const s = topoBoot(r); s.nodes.find(n => n.id === 'look').x = 640; s.nodes.find(n => n.id === 'look').w = 340; s.nodes.push(N('adapter', 210, 225, 'PCIe adapter + boot NVMe', 'Slot 6 · replaced overnight', 'nvme', 230, 46)); return s; },
  chips: [LAPTOP_BMC + ' sol activate', LAPTOP_BMC + ' sel elist', LAPTOP_BMC + ' power cycle', 'ssh tech@10.20.5.14'],
  tasks: [{t: 'Watch the console: where does it stop?', cmd: /sol activate/}, {t: 'What changed? (BMC log)', cmd: /ipmitool.*sel/}, {t: 'BIOS: is the boot drive seen at all?', when: r => r.flags.devsSeen}, {t: 'Physical: adapter and drive seating', when: r => r.flags.seat}, {t: 'BIOS: the slot setting the new card needs', when: r => r.flags.bif === 'x4x4x4x4'}, {t: 'BIOS: boot order / boot entry', when: r => r.flags.entry}, {t: 'Power cycle and verify: login and SSH', cmd: /^ssh/, ok: r => r.os.state === 'up'}],
  actions: [
    {id: 'devs', kind: 'bios', label: 'BIOS Setup › Boot › detected boot devices', do: r => { r.flags.devsSeen = true; const seen = r.flags.bif === 'x4x4x4x4'; return seen ? say('Detected: ' + L('g', 'NVMe PM174X (Slot 6)').slice(2) + ', UEFI PXE IPv4 (ens1f0)', 'Boot order: ' + (r.flags.entry ? 'Rocky Linux (NVMe PM174X), PXE' : L('w', 'UEFI PXE IPv4 only — the old boot entry pointed at the old adapter').slice(2))) : say('Detected: UEFI PXE IPv4 (ens1f0)', L('e', 'No NVMe device detected.')); }},
    {id: 'seat', node: 'adapter', kind: 'look', label: 'Power off, ESD strap: check adapter seating and the drive on it', do: r => { r.flags.seat = true; return say(L('g', 'Adapter fully seated, latch closed; NVMe drive seated in the adapter\'s first slot.'), 'Note: the new adapter is a 4-drive model WITHOUT a PCIe switch on it — the old one had a switch.'); }},
    {id: 'bif', kind: 'bios', label: 'BIOS › PCIe › Slot 6 bifurcation: x16 → x4x4x4x4, save', do: r => { r.flags.bif = 'x4x4x4x4'; return 'Slot 6 bifurcation → x4x4x4x4 (the new switchless adapter needs it). Saved — power cycle to apply.'; }},
    {id: 'entry', kind: 'bios', label: 'BIOS › Boot › add/select "Rocky Linux (NVMe PM174X)" as boot option 1', do: r => { if (r.flags.bif !== 'x4x4x4x4' || !r.devs.nvme0.present) return L('w', 'The BIOS cannot see the NVMe drive yet, so there is nothing to put in the boot order. (Power cycle after changing bifurcation.)'); r.flags.entry = true; return 'Boot option 1: Rocky Linux (NVMe PM174X). Saved — power cycle.'; }}
  ],
  hint: ['Ask what changed: the adapter card. Watch the console and note exactly where it stops (Stage 3, UEFI/BIOS).', 'Is the drive seen in BIOS? If not: seating, cables, the new card\'s needs (slot enabled, bifurcation), firmware. If yes: boot order, UEFI vs Legacy, Secure Boot.', 'Change one thing at a time, power cycle, re-check; then verify it boots to login and SSH; document.'],
  answer: `<ol><li><b>What changed?</b> The PCIe adapter holding the boot NVMe was replaced overnight — start there. Check the BMC SEL for errors around the swap.</li><li><b>Watch the console</b> (SOL or virtual console): it gets through POST and stops at <b>Stage 3 (UEFI/BIOS)</b> — no boot device found.</li><li><b>Is the drive seen in BIOS?</b><ul><li><b>No</b> → physical and settings: adapter and drive <b>seated</b> (powered off, ESD), cables, the right slot; BIOS <b>slot enabled</b> and <b>bifurcation</b> (a new adapter without a PCIe switch needs the slot split, e.g. x4x4x4x4 — the cause in this lab); firmware; compare the new card's part number with the old one.</li><li><b>Yes</b> → <b>boot order</b> (the old boot entry may point at the old card), <b>UEFI versus Legacy</b> mode, <b>Secure Boot</b>, RAID controller settings.</li></ul></li><li>Change <b>one thing at a time</b>, power cycle, re-check.</li><li><b>Verify</b> it reaches the login prompt and the network (SSH), then <b>document</b> — and feed back to whoever swapped the card (process: the new card needs a BIOS change).</li></ol>`,
  keys: [K('what changed', 'changed|replac'), K('watch the console', 'console|SOL'), K('stage 3 / BIOS', 'stage|BIOS|UEFI'), K('drive seen in BIOS?', 'seen|detect'), K('seating / cables', 'seat|cable'), K('bifurcation / slot setting', 'bifurcat|slot'), K('boot order', 'boot order|boot entry'), K('UEFI vs Legacy', 'Legacy'), K('Secure Boot', 'Secure Boot'), K('RAID controller', 'RAID'), K('verify / document', 'verif|document')]
});

M({n: 39, set: 'B', topic: 'No network after a firmware update', reread: ['m8', 'm12'], start: 'laptop',
  q: 'After a firmware update, a Linux server stops responding to ping and SSH, but its BMC is reachable. How do you work out whether the problem is the hardware, the operating system, or the network?',
  brief: '<p>A firmware update ran last night. Now: no ping, no SSH — but the BMC answers. Use the BMC to split hardware vs OS vs network, then fix with the approved version.</p>',
  rig: () => { const r = baseRig({upDays: 0}); const d = r.devs.nic0; d.fw = '22.41.1000'; d.drv = false; d.modPresent = true; d.drvMsg = 'mlx5_core 0000:3b:00.0: firmware version 22.41.1000 is not supported by driver 24.07 (approved: 22.39.1002); probe failed with error -95'; r.hooks.onBoot = rr => { rr.devs.nic0.drv = rr.devs.nic0.fw === '22.39.1002'; }; sel(r, '23:10:44', 'System Firmware Progress #0x0f', 'NIC Slot 1 firmware updated 22.39.1002 → 22.41.1000', null, -1); return refresh(r); },
  topo: r => topoOob(r),
  chips: ['ping -c 2 10.20.5.14', LAPTOP_BMC + ' power status', LAPTOP_BMC + ' sel elist', LAPTOP_BMC + ' sensor', LAPTOP_BMC + ' sol activate', 'ip a', 'lspci | grep -i ethernet', 'lspci -k | grep -A3 3b:00', 'dmesg | grep -i mlx5'],
  tasks: [{t: 'Confirm the symptom', cmd: /^(ping|ssh)/}, {t: 'Hardware: is it powered and healthy? (BMC)', cmd: /ipmitool.*(power status|sensor|chassis)/}, {t: 'What changed? (SEL)', cmd: /ipmitool.*sel/}, {t: 'OS: is it running? Look at the console', cmd: /sol activate/}, {t: 'Network layers from the console: interface?', cmd: /^ip\s+(a|addr|link)/, ok: r => r.ctx.includes('sol')}, {t: 'Bus and driver: is the NIC there, is a driver bound?', cmd: /lspci/, ok: r => r.ctx.includes('sol')}, {t: 'Why no driver?', cmd: /dmesg|journalctl/, ok: r => r.ctx.includes('sol')}, {t: 'Fix with the approved firmware, verify from the laptop', cmd: /^(ping|ssh).*10\.20\.5\.14/, ok: r => r.devs.nic0.drv && r.os.state === 'up'}],
  actions: [{id: 'fw', kind: 'gui', label: 'BMC web › Firmware › install the approved NIC firmware 22.39.1002, then power cycle', reboot: 'cycle', do: r => { r.devs.nic0.fw = '22.39.1002'; return 'NIC firmware 22.41.1000 → 22.39.1002 (approved). Versions recorded. Not interrupted. Power cycling.'; }}],
  hint: ['BMC first: power status, sensors, SEL — is the <b>hardware</b> up and healthy? What exactly changed?', 'Console (SOL/KVM): did the <b>OS</b> boot? Kernel panic? Login prompt?', 'If the OS is up, work the <b>network</b> layers from the console: link, NIC in lspci, driver bound (lspci -k, dmesg), IP, gateway, sshd.', 'Firmware: compare before/after versions with the approved list; roll back or install the approved version; never interrupt the update; retest; document.'],
  answer: `<p>The BMC is reachable, so use it to split the problem:</p><ol><li><b>Hardware?</b> Through the BMC: <code>ipmitool power status</code> (is it on?), <b>sensors</b> and <b>SEL</b> (hardware errors, and what the firmware update changed and when).</li><li><b>Operating system?</b> Open the <b>console</b> (SOL or virtual console). Is it stuck in POST, at a boot error, a kernel panic — or at a normal login prompt? If you can log in on the console, the OS is running.</li><li><b>Network?</b> From the console, work bottom-up: link (<code>ip a</code>, <code>ethtool</code>), NIC on the bus (<code>lspci</code>), <b>driver bound</b> (<code>lspci -k</code>, <code>dmesg</code>), IP address, gateway (<code>ip route</code>, ping it), and sshd.</li><li>Tie it back to the change: compare <b>firmware versions before and after</b> against the <b>approved</b> list. (In this lab: the NIC was updated to 22.41.1000, which the driver rejects — the hardware is present, the OS is fine, the NIC has no driver, so there is no interface.)</li><li>Fix with the <b>approved version</b> (do not power off during the update), retest ping and SSH, and <b>document</b> versions before and after.</li></ol>`,
  keys: [K('BMC power status / health', 'power status|BMC|health'), K('SEL / what changed', 'SEL|changed|event'), K('console (SOL/KVM)', 'console|SOL|KVM'), K('OS running? login / panic', 'login|panic|boot|OS'), K('link / ip a', 'ip a|link|ethtool'), K('lspci / driver', 'lspci|driver'), K('dmesg', 'dmesg'), K('IP / gateway / sshd', 'gateway|sshd|route'), K('firmware versions approved', 'approved|version'), K('roll back / reinstall', 'roll|reinstall|install'), K('document', 'document')]
});

M({n: 40, set: 'B', topic: 'Random reboots', reread: ['m11', 'm8'],
  q: 'A server randomly reboots once or twice a day, with nothing obvious in the operating system logs. Describe what you would check and how you would catch the cause.',
  brief: '<p>Three unexplained reboots in three days. The OS logs just stop. The answer is in comparing timestamps across the OS journal and the BMC — then in your hands.</p>',
  rig: () => {
    const r = baseRig({upDays: 0}); r.bootAt = todayAt('08:12:30');
    const ends = [todayAt('08:10:40'), todayAt('19:01:20', -1), todayAt('22:14:30', -2)];
    const starts = [todayAt('19:03:10', -1), todayAt('22:16:20', -2), todayAt('09:00:00', -5)];
    r.journal.prevBoots = ends.map((e, i) => prevBoot(starts[i], e));
    r.bmc.psu.ps1 = 'fail';
    sel(r, '14:22:09', 'Power Supply PS1 #0xc8', 'Failure detected', 'e', -9); sel(r, '14:22:10', 'Power Unit Redundancy #0xd0', 'Redundancy Lost', 'w', -9);
    sel(r, '22:14:31', 'Power Supply PS2 #0xc9', 'Power Supply AC lost', 'e', -2); sel(r, '22:16:01', 'System ACPI Power State #0x84', 'S0/G0: working', null, -2);
    sel(r, '19:01:21', 'Power Supply PS2 #0xc9', 'Power Supply AC lost', 'e', -1); sel(r, '19:02:51', 'System ACPI Power State #0x84', 'S0/G0: working', null, -1);
    sel(r, '08:10:41', 'Power Supply PS2 #0xc9', 'Power Supply AC lost', 'e'); sel(r, '08:12:11', 'System ACPI Power State #0x84', 'S0/G0: working', null);
    r.flags.cordLoose = true;
    return refresh(r);
  },
  topo: r => topoChassis(r),
  chips: ['journalctl --list-boots', 'journalctl -b -1 | tail -5', 'journalctl -b -1 -p err', 'sudo ipmitool sel elist', 'sudo ipmitool sensor | grep -i -E "ps|power"'],
  tasks: [{t: 'How many boots, and when did each end?', cmd: /list-boots/}, {t: 'How did the last boot end?', cmd: /journalctl.*-b\s+-1/}, {t: 'BMC event log: anything at those exact times?', cmd: /ipmitool.*sel/}, {t: 'Power supply status and redundancy', cmd: /ipmitool.*(sensor|sdr)/}, {t: 'Hands on: both PSUs and their cords', when: r => r.flags.ps1 && r.flags.ps2}, {t: 'Fix: restore redundancy', when: r => r.bmc.psu.ps1 === 'ok' && !r.flags.cordLoose}, {t: 'Verify redundancy restored in the BMC', cmd: /ipmitool.*(sensor|sdr)/, ok: r => r.bmc.psu.ps1 === 'ok' && !r.flags.cordLoose}],
  actions: [
    {id: 'ps1', node: 'psu1', kind: 'look', label: 'Inspect PSU 1', do: r => { r.flags.ps1 = true; return r.bmc.psu.ps1 === 'ok' ? 'PSU 1 LED green.' : L('e', 'PSU 1 LED is AMBER — failed 9 days ago. The server has been running on PSU 2 alone.'); }},
    {id: 'ps2', node: 'psu2', kind: 'look', label: 'Inspect PSU 2 and its power cord to the PDU', do: r => { r.flags.ps2 = true; return r.flags.cordLoose ? L('e', 'PSU 2\'s cord is not latched at the PDU end: bump the rack door and it loses contact for a second.') : 'Cord latched at both ends.'; }},
    {id: 'cord', node: 'psu2', kind: 'cable', label: 'Reseat PSU 2\'s cord and fit the retention clip', do: r => { r.flags.cordLoose = false; return L('g', 'Cord seated and clipped at the PDU and the PSU.'); }},
    {id: 'newps1', node: 'psu1', kind: 'swap', label: 'Replace PSU 1 with a matching known-good PSU', do: r => { r.bmc.psu.ps1 = 'ok'; r.bmc.sel.push({d: new Date(r.now), sensor: 'Power Unit Redundancy #0xd0', ev: 'Fully Redundant', dir: 'Asserted'}); return L('g', 'New PSU 1 (same model and wattage as PSU 2) installed: LED green.'); }}
  ],
  hint: ['OS side: <code>journalctl -b -1</code> for the last messages (an abrupt end with no shutdown points below the OS), <code>journalctl --list-boots</code> for the times.', 'BMC side: the SEL for <b>power</b>, <b>thermal</b>, or <b>uncorrectable memory</b> events at those exact times; PSUs, temperatures, any watchdog.', 'Correlate timestamps. Check physical power: PSU LEDs, cords, outlets/PDU, redundancy.', 'To catch it: persistent journal, save logs, console logging via SOL, leave SEL and sensors recorded, reproduce (burn-in), one change at a time, verify redundancy, document.'],
  answer: `<p>"Nothing in the OS logs" is itself a clue: if the journal just <b>stops</b> with no shutdown messages, the reboot came from <b>below the OS</b> — power, a hardware reset, a watchdog.</p><p><b>Check:</b></p><ol><li><code>journalctl --list-boots</code> for the time each boot ended, and <code>journalctl -b -1</code> for the last messages before each reboot (make sure the journal is persistent).</li><li>The <b>BMC SEL</b> for <b>power</b>, <b>thermal</b>, or <b>uncorrectable memory</b> events at those exact times; any <b>watchdog</b> events.</li><li><b>PSUs</b>: status and redundancy in BMC sensors, LEDs, cords, outlets/PDU. <b>Temperatures</b> and fans.</li></ol><p><b>Catching the cause:</b> line up the timestamps (here every reboot matched "PS2 AC lost" — and PS1 had failed 9 days earlier, so there was no redundancy); keep logs persistent and log the console through SOL; record sensors; reproduce if possible (burn-in); change <b>one thing at a time</b> (reseat the cord, replace the failed PSU with a matching one); <b>verify redundancy is restored</b> and run long enough to trust it; <b>document</b>.</p>`,
  keys: [K('journalctl -b -1', '-b -1|journalctl'), K('list-boots / timestamps', 'list-boots|timestamp|time'), K('abrupt end = below OS', 'abrupt|stop|below|no shutdown'), K('SEL', 'SEL|event log'), K('power events / PSU', 'power|PSU'), K('thermal', 'thermal|temp'), K('uncorrectable memory', 'uncorrect|memory'), K('watchdog', 'watchdog'), K('cords / PDU / outlet', 'cord|PDU|outlet'), K('redundancy', 'redundan'), K('correlate', 'correlat|line up|match'), K('one change / verify / document', 'one (change|thing)|verif|document')]
});

/* ---------- Course practice exam (20) — linked to missions or own answers ---------- */
const COURSE_EXAM = [
  {q: 'What is Linux, and give four reasons it is used on data center servers.', m: 1},
  {q: 'Which command shows the IP addresses on a Linux server? List five other things the same command shows.', a: '<code>ip a</code>. Besides IP addresses it shows: interface names; flags such as UP (enabled) and LOWER_UP (link) or NO-CARRIER; the MTU (9000 = jumbo frames); the MAC address (link/ether); the subnet prefix and broadcast address (brd); and whether the address is dynamic (DHCP, with lease time) or static ("forever"). It does not show the gateway (<code>ip route</code>), DNS (<code>/etc/resolv.conf</code>) or link speed (<code>ethtool</code>).', see: 2},
  {q: 'A server can reach 10.4.2.15 but not db01, which should be that address. What do you check, and why?', m: 32, a: 'The IP works, so the network is fine and the problem is name resolution. Check /etc/hosts (checked first, may hold a wrong entry), /etc/resolv.conf (right DNS server?), whether that DNS server is reachable, <code>nslookup db01</code> / <code>dig db01</code>, and whether the full name (FQDN) is needed.'},
  {q: 'Describe each step of DHCP, and list what DHCP gives a client.', m: 4},
  {q: 'A Gen 5 x16 card trained at Gen 4 x8. Explain what that means, what bandwidth was lost, and what you would check.', a: 'LnkCap Gen 5 x16, LnkSta Gen 4 x8: the link is downtrained in both speed and width. Gen 5 x16 ≈ 64 GB/s each direction; Gen 4 x8 = 16 GT/s × 8 ÷ 8 ≈ 16 GB/s. About 48 GB/s per direction — three quarters of the bandwidth — is lost. Check: is the slot Gen 4 or wired x8 (weakest part of the path); seating, dirty connector, riser, cable or retimer; BIOS link-speed and bifurcation settings; AER errors on the port. Change one thing, re-check LnkSta.', see: 25},
  {q: 'What is a retimer, how is it different from a redriver, and how could a failed one show up?', m: 24},
  {q: 'How would you use lspci -tv and a topology diagram to tell one failed device from a failed riser or switch?', m: 22},
  {q: 'Explain ECC memory, including what it can and cannot fix, and why it matters in servers.', m: 6},
  {q: 'List six things the BMC lets you do when the operating system is down.', m: 23},
  {q: 'Give two situations for SSH and two where only SOL will work, and explain why.', a: 'SSH (in-band, needs the OS, network and sshd): daily work on a healthy server — running tests, copying logs. SOL (out-of-band through the BMC, no OS needed): a server that will not boot or is frozen/panicked (you see BIOS/POST, GRUB, kernel messages), a server that has lost its network, and changing BIOS settings. SSH talks to the OS; SOL talks to the console through the BMC.', see: 3},
  {q: 'Write a command to find every line containing "timeout" in a log, ignoring case, with line numbers.', a: '<code>grep -in "timeout" /var/log/syslog</code> (or <code>/var/log/messages</code> on Red Hat, with sudo). -i ignores case, -n shows line numbers.', see: 7},
  {q: 'A Linux server stopped answering ping and SSH after it was moved. Walk through your troubleshooting.', m: 8},
  {q: 'A newly installed PCIe card is not in lspci. What do you check before calling it defective?', m: 9},
  {q: 'A test fails about once in every ten runs. How do you investigate?', m: 10},
  {q: 'A server keeps logging memory errors on one DIMM slot. How do you find out whether the DIMM or the system is at fault?', m: 11},
  {q: 'A server powers on, fans run, but it never reaches the operating system. Describe your approach.', m: 15},
  {q: 'A network card is detected, but the server cannot reach its gateway. Describe your process.', m: 16},
  {q: 'An NVMe drive drops out under load and returns after reboot. What do you investigate, and why?', m: 17},
  {q: 'You move a suspect part into a known-good system and the failure follows it. What does this tell you, and what do you do next?', m: 19},
  {q: 'Three servers fail the same way because a cable was plugged into the wrong port during assembly. What do you do beyond fixing them?', m: 20}
];

<script>
/* =====================================================================
   PEN & PAPER EXAM PREP
   The real assessment: 20 free-response questions, handwritten, 60 min,
   no notes. These pages train that format: question only, timer, mark
   yourself against the course's grading criteria, paper-length answers.
   ===================================================================== */
const QKIND = {1: 'define', 2: 'read', 3: 'compare', 4: 'define', 5: 'define', 6: 'define', 7: 'command', 8: 'scenario', 9: 'scenario', 10: 'scenario', 11: 'scenario', 12: 'concept', 13: 'concept', 14: 'concept', 15: 'scenario', 16: 'scenario', 17: 'scenario', 18: 'scenario', 19: 'concept', 20: 'scenario', 21: 'define', 22: 'compare', 23: 'define', 24: 'compare', 25: 'define', 26: 'compare', 27: 'define', 28: 'concept', 29: 'scenario', 30: 'scenario', 31: 'scenario', 32: 'compare', 33: 'scenario', 34: 'scenario', 35: 'read', 36: 'scenario', 37: 'scenario', 38: 'scenario', 39: 'scenario', 40: 'scenario'};
const countRe = (t, re) => (t.match(new RegExp(re, 'gim')) || []).length;
const keyCov = (q, t) => q.keys && q.keys.length ? q.keys.filter(k => new RegExp(k.re, 'i').test(t)).length / q.keys.length : 0;
const KINDS = {
  define: {name: 'Explain it', mins: 2.5, lines: '5–8 lines',
    pattern: ['What it is — one plain sentence', 'How it works', 'Why it matters in a data center', 'One example (a command, a log line, a real case)'],
    checks: [['Says what it is in the first sentence', t => /\b(is|are|means)\b/i.test(t.slice(0, 200))], ['Explains how it works', t => /work|by |uses|stores|sends|checks|reads|when |first|then/i.test(t)], ['Says why it matters (in a data center)', t => /matter|important|because|so that|prevent|data cent|server|keep/i.test(t)], ['Gives an example, a command or a real case', t => /example|e\.g|for instance|such as|lspci|ip a|grep|ipmitool|dmesg|journalctl|nvme|ethtool|nslookup|dig /i.test(t)], ['Uses the course\'s terms (half the key ideas or more)', (t, q) => keyCov(q, t) >= 0.5]]},
  read: {name: 'Read the output', mins: 3, lines: '8–12 short lines',
    pattern: ['Go left to right, line by line', 'Name each field AND say what it means', 'What it does NOT show, and where to find it', 'Your conclusion or next check, if asked'],
    checks: [['Names most of the fields (60%+ of key ideas)', (t, q) => keyCov(q, t) >= 0.6], ['Says what each field means, not just copies it', t => countRe(t, '(means|=|tells|shows|is the|so )') >= 3], ['Names what is NOT shown and where it lives', t => /not (show|in)|doesn.?t show|ip route|resolv|ethtool/i.test(t)], ['States the conclusion / next step where asked', t => /likely|next|check|so the|therefore|means the/i.test(t)]]},
  compare: {name: 'Compare two things', mins: 3, lines: '6–10 lines or a small table',
    pattern: ['The key difference in one line', 'How each one works / what it shows', 'What each one depends on', 'When you would use each — one real situation'],
    checks: [['States the key difference up front', t => /whereas|while|but|unlike|instead|versus| vs|differ|not the same/i.test(t)], ['Covers BOTH sides', (t, q) => keyCov(q, t) >= 0.4], ['Says what each depends on or shows', t => /depend|need|requir|show|reads|cleared|keeps/i.test(t)], ['Gives a situation / when to use each', t => /when|situation|if |use (it|them)? ?for|only/i.test(t)], ['Uses the course\'s terms (half the key ideas or more)', (t, q) => keyCov(q, t) >= 0.5]]},
  command: {name: 'Write the command', mins: 2, lines: '1 command + 3–4 lines',
    pattern: ['The exact command, written carefully (Linux is case-sensitive)', 'What each option does', 'The variant they asked for (e.g. how to count)', 'sudo where the file needs it'],
    checks: [['Writes the full command', t => /grep\s+-|grep\s+["']?\w/i.test(t)], ['Explains each option', t => countRe(t, '-(r|i|n|c)\\b') >= 3], ['Gives the counting variant', t => /-\w*c\b|wc -l|count/i.test(t)], ['Mentions sudo where needed', t => /sudo/i.test(t)]]},
  concept: {name: 'Explain and reason', mins: 3, lines: '5–8 lines',
    pattern: ['Answer the question directly in the first line', 'The reasons (what it proves / why)', 'What could go wrong, or the limits', 'What you do next — end with an action'],
    checks: [['Answers directly in the first line', t => t.trim().length > 0 && t.trim().split(/\n/)[0].length > 12], ['Gives reasons', t => /because|so |prove|means|reason|therefore|which is why/i.test(t)], ['Covers risks, limits or what could go wrong', t => /later|risk|could|might|not prove|doesn.?t|limit|come back/i.test(t)], ['Ends with a practical action (verify, document, prevent)', t => /document|verif|prevent|RMA|CAPA|retest|record/i.test(t)], ['Uses the course\'s terms (half the key ideas or more)', (t, q) => keyCov(q, t) >= 0.5]]},
  scenario: {name: 'Troubleshooting scenario', mins: 4.5, lines: '6–10 numbered steps',
    pattern: ['1. Gather information: exact symptom, what changed, can I reproduce it?', '2. Check the evidence: logs (dmesg, journalctl, BMC SEL), sensors, LEDs, what BIOS and OS see', '3. Simple, physical things first: seating, cables, power, settings', '4. Isolate: swap with known-good, one change at a time — follows the part or stays?', '5. Fix and verify: retest fully', '6. Document and prevent'],
    checks: [['Numbered steps in a logical order', t => countRe(t, '^\\s*(\\d+[.):]|step\\s*\\d|first|then|next|finally)') >= 3], ['Gathers evidence BEFORE changing anything', t => { const ev = t.search(/log|dmesg|journal|SEL|event|sensor|evidence|lspci|ip a|smart|console|symptom|what changed/i); const ch = t.search(/replac|reseat|swap|fix|update|rma/i); return ev >= 0 && (ch < 0 || ev < ch); }], ['Names specific tools, commands and logs', t => countRe(t, '(lspci|dmesg|journalctl|ipmitool|SEL|ip a|ip route|ethtool|nvidia-smi|smart-log|dmidecode|grep|ping|BMC|nvme|lscpu|free -h|traceroute|nslookup)') >= 2], ['Simple physical checks early (seating, cables, power, settings)', t => /seat|cable|power|latch|LED|connector|plug|BIOS/i.test(t)], ['Isolates by swapping with a known-good part', t => /swap|known.?good|another (slot|bay|port|system)|follow|stays|isolat|half/i.test(t)], ['Changes one thing at a time', t => /one (change|thing|variable)|one at a time/i.test(t)], ['Verifies the fix', t => /verif|retest|re-test|confirm|test again|run .*test|enough cycles/i.test(t)], ['Ends with documentation (and prevention)', t => /document|record|write.?up|ticket|prevent/i.test(t)]]}
};

/* Paper-length answers: what fits in the time on paper. From the course text. */
const PAPER = {
  1: ['Linux is an operating system; strictly the kernel that talks to the hardware, packaged with tools into distributions. Open source.', 'Server distributions: RHEL and Ubuntu Server (also Rocky Linux, SUSE).', 'Reasons: 1) stable — months without a reboot; 2) low cost — many are free; 3) built for remote work — command line and scripts over the network, one person runs hundreds of servers; 4) transparent about hardware — lspci, dmesg; 5) secure, efficient, supported — AI and cloud software built for Linux first.'],
  2: ['2 = index; ens1f0 = interface name (Ethernet, slot 1, port 0).', 'UP = enabled; LOWER_UP = physical link detected; state UP.', 'mtu 9000 = jumbo frames, must match the switch.', 'link/ether 3c:ec:ef:12:34:56 = MAC address.', 'inet 10.20.5.14/22 = IPv4 address and subnet (255.255.252.0); brd 10.20.7.255 = broadcast; scope global.', 'dynamic = address came from DHCP (a lease).', 'Not shown: default gateway → ip route; DNS servers → /etc/resolv.conf; link speed → ethtool ens1f0.'],
  3: ['They are different paths to different things.', 'SSH: in-band, inside the OS over the normal network. Needs the OS running, a working network and sshd. Gives a shell after boot.', 'SOL: out-of-band, through the BMC on the management network (standby power). Shows the serial console — BIOS/POST, GRUB, kernel messages, panics. Needs no OS.', 'Only SOL helps: the kernel has panicked, the server will not boot, it has lost its network, or you need BIOS settings.'],
  4: ['1) Discover — the new server (client) broadcasts "I need an address".', '2) Offer — a DHCP server offers an address and settings.', '3) Request — the client broadcasts that it wants that offer.', '4) Acknowledge — the server confirms; the client configures itself.', 'Broadcasts: Discover and Request (the client has no address yet).', 'Ends up with: IP address, subnet mask, default gateway, DNS servers, lease time.', 'No answer: no address or a self-assigned 169.254.x.x. Check link/VLAN, the DHCP server, a DHCP relay for other subnets.'],
  5: ['Factors: 1) generation (GT/s per lane) and width (lanes); 2) encoding overhead (~1.5% Gen 3–5); 3) the weakest part of the path; 4) what it actually trained to (LnkSta) and how the slot is wired; 5) shared links behind a PCIe switch.', 'Gen 4 x8: 16 GT/s × 8 lanes ÷ 8 = 16 GB/s in each direction (about 15.75 GB/s after encoding).'],
  6: ['ECC stores extra check bits with the data and checks them on every read.', 'Can fix: single-bit errors — corrected automatically, logged, the server keeps running.', 'Cannot fix: double-bit errors — detected; the server stops or crashes rather than use bad data.', 'Why servers: prevents silent data corruption and keeps them running.', 'The corrected-error log matters: a DIMM with a rising count is likely to fail — replace it before it causes an outage (BMC SEL, ras-mc-ctl, dmesg | grep -i edac).'],
  7: ['sudo grep -rin "nvme" /var/log/', '-r = search the folder and all subfolders; -i = ignore case (nvme, NVMe); -n = show line numbers.', 'Count instead: grep -ric "nvme" /var/log/ (count per file) or grep -ri "nvme" /var/log/ | wc -l (one total).'],
  8: ['First: is the server alive? Check through the BMC — power status, SEL, console (SOL/KVM). You cannot SSH into a crashed server.', '1) Physical: link LEDs, cable, transceiver, switch port; ethtool "Link detected"; try a known-good cable/port.', '2) NIC detected, driver loaded: lspci, lspci -k, dmesg.', '3) IP: ip a — missing, 169.254, wrong subnet.', '4) Gateway: ip route, ping it, traceroute.', '5) DNS: test by IP and by name.', '6) Service: systemctl status sshd, ss -tulpn, firewall.', '7) What changed — new port or VLAN after the move? Verify, document.'],
  9: ['lspci shows devices even without a driver, so this is the hardware path or a setting.', '1) Confirm expected (build sheet) vs lspci.', '2) Does BIOS/BMC inventory see it? No → physical or firmware.', '3) Power off, ESD strap: seated, latch, right slot, riser, power cables, bent pins.', '4) BIOS: slot enabled, bifurcation, link speed, Above 4G; firmware.', '5) lspci -tv vs topology diagram: missing branch → upstream (riser, cable, root port, BIOS).', '6) Swap into a known-good slot or system — only if it follows the card is it dead. Verify, document.'],
  10: ['Gather: exact errors, timestamps and frequency, which tests pass/fail, temperature and load at the time, logs (dmesg, journal, SEL), serials, firmware and driver versions, other units.', 'Reproduce: 1) look for a pattern — load, heat, one slot; 2) loop or stress test on purpose (for i in $(seq 1 50); do ./test.sh >> results.txt; done); 3) check seating and cables, corrected errors; 4) change one variable at a time; 5) run enough cycles to trust it; 6) compare with a golden unit; document.'],
  11: ['1) Record: slot, error type and count, DIMM serial (dmidecode), timestamps.', '2) Simple checks: seated, both latches, right part and slot, current BIOS.', '3) Swap: suspect DIMM to a slot on a different channel, known-good DIMM into the suspect slot; clear logs; memory test.', '4) Errors follow the DIMM → DIMM bad. Stay in the slot → slot, board or CPU.', '5) Pattern: many DIMMs on one channel/CPU → memory controller, CPU seating, bent pins.', '6) Stress test after each change, one at a time; document.'],
  12: ['Three changes at once: when it works, you don\'t know which fixed it — no root cause.', 'One at a time tells you the real cause, avoids new problems, keeps results repeatable, avoids replacing good parts.', 'Later: it comes back and you repeat all three; the firmware change may add bugs or be unapproved; a good part gets scrapped or RMA\'d; other units aren\'t contained; the record misleads the next tech.'],
  13: ['"GPU not detected" is what was observed — a symptom. A root cause says why it happened; fixing only the symptom lets it come back.', '5 Whys: not detected → its power cable wasn\'t connected → the cable was routed where it couldn\'t reach → the work instruction showed an old layout → it wasn\'t updated after a design change.', 'Root cause: the outdated work instruction (process). Fix: update the WI, check other units.'],
  14: ['Document: unit serial, symptom, steps and results, parts changed with serials (old and new), firmware versions, root cause, fix, verification.', 'Matters to others: traceability; patterns across units and batches; faster future repairs and shift handoffs; RMA and warranty claims; quality and audit.'],
  15: ['Fans and green LED only prove power. Watch the console (KVM/SOL) and note where it stops; check the BMC SEL.', '1) Power/BMC: health, sensors, SEL.', '2) POST: stuck code, memory errors — be patient during memory training; reseat; minimum config.', '3) BIOS: "no bootable device" — drive seen? boot order, UEFI/Legacy, Secure Boot, cables, RAID.', '4) GRUB: grub rescue — boot partition, drive.', '5) Kernel: panic, can\'t mount root — storage driver, drive.', '6) Startup: emergency mode — /etc/fstab, failing disk.', 'Ask what changed; verify; document.'],
  16: ['1) Confirm lspci -k driver and ip link interface.', '2) Link: LOWER_UP vs NO-CARRIER, ethtool "Link detected", LEDs both ends — cable, transceiver, dirty fiber, switch port.', '3) Interface up? ip link set ... up.', '4) IP: none, 169.254, wrong subnet, old interface name in config.', '5) Local network: VLAN, ARP (ip neigh), MTU mismatch.', '6) ip route, ping the gateway, firewall.', '7) ethtool -i / -S; compare with a working port; document.'],
  17: ['Evidence: dmesg saved before reboot, or journalctl -b -1 -k | grep -i nvme ("I/O timeout, aborting", "controller is down; will reset", "Removing after probe failure"); BMC SEL at the same time; nvme smart-log (temperature, media errors, warnings, unsafe shutdowns); LnkSta vs LnkCap and AER on the port above; firmware (drive, backplane, BIOS).', 'Causes: seating or worn backplane connector, bad/misrouted cable, overheating, power saving not waking, firmware bug, PCIe signal, failing drive.', 'Then: move it to another bay (follows/stays); reproduce under load with fio, watching dmesg -w and temperature; document.'],
  18: ['Empty port = the device did not link. Causes: the GPU, its aux power cable, seating, the slot, or a retimer.', '1) Count each layer (nvidia-smi, lspci, BMC inventory); map the slot on the diagram.', '2) Logs: dmesg Xid/PCIe, SEL power/temperature, PSU status.', '3) BIOS: slot enabled, Above 4G, Resizable BAR.', '4) Power off, ESD: aux cable, reseat, latch.', '5) Swap GPU 6 with a working slot: follows → GPU; stays → slot/retimer/power.', '6) Verify 8 GPUs + full GPU test; document.'],
  19: ['Proves: the GPU is very likely bad — the failure followed it.', 'Does not prove: Server A is healthy — a bad slot or power problem there may have damaged the GPU.', 'Next: tag and quarantine the GPU; return Server B to its original state and retest it; inspect A\'s slot and test A with a known-good GPU; document both serials; start the RMA.'],
  20: ['1) Verify the units fully pass and nothing was damaged.', '2) Document unit, cable, wrong vs correct port, results (photos).', '3) Notify lead, quality, assembly.', '4) Contain: check other units from the same line, shift or batch, including ones waiting to ship.', '5) Prevent: update the work instruction with pictures; labels/colour coding; mistake-proofing (keyed connectors, cable lengths); an inspection step; track in CAPA.', 'Focus on the process, not blame.'],
  21: ['1) /etc/hosts is checked first — a local list of names and IPs.', '2) Then /etc/resolv.conf gives the DNS server (nameserver) and search domain, so db01 becomes db01.lab.local (FQDN).', '3) The DNS server answers from its records — an A record maps a name to an IPv4 address — or asks other servers.', '4) The answer is cached (for its TTL) so the next lookup is fast. Tools: nslookup db01, dig db01.'],
  22: ['Diagram (service guide) = the expected wiring: which CPU and root port each slot uses; switches, risers, retimers, cables; expected widths; slot-to-bus mapping; shared paths.', 'Tree = what Linux actually found: lspci -tv.', 'Compare: port present but empty → the device (device, power cable, seating, slot, retimer); whole branch missing → upstream (riser, cable, switch, retimer, root port, BIOS slot); everything under one switch missing → the switch or its upstream link.'],
  23: ['BMC = Baseboard Management Controller: a small separate computer on the motherboard with its own processor, firmware and network port. Runs on standby power and doesn\'t use the OS — out-of-band — so it works when the OS has crashed or the server is off.', 'Can: 1) read the SEL; 2) read sensors (temps, fans, PSUs, power); 3) inventory and firmware versions, serials; 4) virtual console (KVM) and SOL; 5) power on/off/reset/cycle, NMI for a crash dump; 6) boot order and virtual media (ISO).'],
  24: ['Retimer: recovers the data and re-transmits a clean signal, resetting the loss budget; takes part in link training; invisible to the OS (not in lspci).', 'Redriver: an amplifier — boosts the signal and its noise; no link training.', 'Gen 5: signals lose strength fast over traces, connectors, risers and cables, so long paths need retimers.', 'Failed retimer: devices behind it disappear, downtrained links, a stream of corrected (AER) errors; check BMC health and firmware.'],
  25: ['LnkCap = what the device can do (max speed GT/s and width). LnkSta = what the link actually trained to at power-on (sudo lspci -vv).', 'Lower LnkSta = downtrained: it works, but slower ("downgraded").', 'Causes: poor seating, dirty connector, bad riser/cable/retimer, a BIOS speed setting; also a slower slot or narrower wiring (weakest part of the path).'],
  26: ['journalctl -b -1 shows it.', 'dmesg = the kernel ring buffer since the current boot; cleared on reboot, so the crash messages are gone.', 'journalctl -b -1 = the previous boot from the systemd journal (if it is persistent).', 'Save before rebooting: dmesg > file.txt, the journal/logs, BMC SEL and sensors, a screenshot of the console (panic).'],
  27: ['1) Physical: installed, seated, powered, seen by BIOS/BMC — look, LEDs, inventory.', '2) Bus: does the OS see it — lspci, lsblk, nvme list.', '3) Driver: is one attached — lspci -k "Kernel driver in use", dmesg.', '4) Function: configured and working — ip a, nvidia-smi, a functional test.', 'Example: a NIC in lspci with no driver in use passes the bus layer and fails the driver layer — don\'t replace the card.'],
  28: ['Swap: put the suspect part into a known-good location (or a known-good part into the suspect location), change only that, retest.', 'Follows the part → the part is bad. Stays with the slot → slot, cable, riser or board.', 'Risks: a bad slot can damage the known-good part; it doesn\'t prove the original system healthy; ESD/handling; mixing up parts (label, record serials); the "known-good" part must really be good; an intermittent fault may not show — run enough cycles; restore and retest the golden unit.'],
  29: ['Stay calm, don\'t guess.', '1) Write down the exact message (save it to a file), timestamps, how often.', '2) Gather logs (dmesg, journal, SEL), serials, firmware/driver versions.', '3) Read the service guide; search the exact error message.', '4) Break it into layers; test one theory at a time.', '5) Escalate when stuck, when the fix needs approval, or other units are affected — with your data: message, logs, what you checked and ruled out.', '6) Document what you learned.'],
  30: ['Capture through the BMC first: the console screen (SOL/KVM — panic? hung task?) as a screenshot; the SEL; sensors (temps, fans, PSUs); health and power state; save logs to files; optionally an NMI for a crash dump.', 'Then power cycle and read journalctl -b -1 after boot.', 'Worth it: a reset wipes the screen and the ring buffer — no evidence means no root cause, it happens again, and escalation/RMA has nothing to go on.'],
  31: ['Downtrained: Gen 4 x4 (~8 GB/s) → Gen 3 x2 (~2 GB/s), a quarter of the bandwidth.', '1) Confirm with sudo lspci -vv; record serial/firmware (nvme list).', '2) AER errors on the port above (dmesg); SEL.', '3) nvme smart-log health.', '4) Firmware (drive, backplane, BIOS); BIOS link settings.', '5) Reseat; check connector/cable.', '6) Move to another bay: follows the drive → drive; stays → bay/backplane/cable.', '7) Verify LnkSta = LnkCap under load; document.'],
  32: ['(a) IP works, name fails → network is fine; problem is name resolution. Check /etc/resolv.conf, the DNS server is reachable, nslookup/dig db01, /etc/hosts, the full name (FQDN).', '(b) Name resolves, no reply → DNS is fine; problem is reaching the host. Check ip route and ping the gateway, traceroute db01, is db01 up, a firewall blocking ping, the service/port, test from another machine.'],
  33: ['Each slot belongs to one CPU, so suspect the shared part — CPU 2 — not each device.', 'Causes: CPU 2 seating, bent socket pins, overheating, a failed CPU; a BIOS setting; shared risers/cables.', 'Narrow: 1) is CPU 2 seen? lscpu sockets, BMC inventory, SEL; 2) is its memory there? free -h, dmidecode; 3) lspci -tv vs diagram; 4) power off, ESD: CPU 2 seating, heatsink torque, pins; 5) swap CPUs or minimum config; verify, document.'],
  34: ['~64 GB missing = one DIMM.', '1) sudo dmidecode -t memory: find the slot showing "No Module Installed" vs the build sheet.', '2) BIOS: is a DIMM disabled?', '3) SEL: memory or configuration errors.', '4) Physical: seated, both latches, right part; population rules.', '5) Swap test if needed.', '6) Verify free -h shows 1 TB; memory test; document.'],
  35: ['ens2f1 is UP (enabled) and LOWER_UP (link OK); mtu 9000 (jumbo, must match the switch); MAC b8:ce:f6:4a:10:22.', '169.254.88.4/16, scope link = self-assigned: it asked DHCP and got no answer.', 'Most likely: DHCP failed. Next: ip route (no gateway); is the DHCP server up and reachable; switch port VLAN; a DHCP relay for this subnet; should it be static/reserved; renew (dhclient); MTU matches; document.'],
  36: ['Suspect an MTU mismatch: the port at 9000 (jumbo), the switch at 1500 — small packets fit, big ones are dropped.', 'Confirm: ip a shows mtu 9000 on that port and 1500 on the working one; ping -M do -s 8972 to the gateway fails, -s 1472 works; check the switch port MTU.', 'Fix: match both ends (ip link set ... mtu 1500, or jumbo on the switch); retest a transfer; document.'],
  37: ['Collect: Xid 79 and timestamps, time into the test, GPU temperature and power at failure, SEL thermal/power, PSU status, AER before it fell, serial/VBIOS/driver/firmware, other units or slots.', 'Hypotheses in order: 1) thermal (airflow parts, fans, heatsink); 2) power (aux cable, PSU); 3) signal (seating, riser, retimer); 4) the GPU itself.', 'Prove: reproduce under stress while logging temperature; change one thing; run enough clean cycles; swap the GPU to another slot (follows/stays); compare a golden unit; document.'],
  38: ['What changed: the adapter. Watch the console — it stops at the UEFI/BIOS stage.', 'Is the drive seen in BIOS? No → seating (power off, ESD), cables, slot enabled, bifurcation the new card needs, firmware. Yes → boot order (old entry), UEFI vs Legacy, Secure Boot, RAID controller.', 'One change at a time; verify it boots to login and the network; document and feed back to whoever swapped it.'],
  39: ['BMC: power status, sensors, SEL → is the hardware on and healthy? What changed?', 'Console (SOL/KVM): POST/boot error/panic, or a login prompt → is the OS running?', 'If the OS is up, from the console: link (ip a, ethtool), NIC in lspci, driver bound (lspci -k, dmesg), IP, gateway, sshd → the network.', 'Compare firmware before/after with the approved list; roll back or install approved (never power off mid-update); retest; document.'],
  40: ['OS logs that just stop point below the OS — power, hardware, a watchdog.', 'Check: journalctl --list-boots and journalctl -b -1 (persistent journal); BMC SEL for power, thermal, uncorrectable memory events and watchdog at those times; PSUs (status, redundancy, cords, PDU); temperatures and fans.', 'Catch it: correlate timestamps; keep logs persistent, log the console via SOL, record sensors; reproduce (burn-in); one change at a time; verify redundancy; document.']
};

/* ---------- typing helpers ---------- */
const WORDS = {define: [60, 110], read: [60, 110], compare: [70, 120], command: [25, 60], concept: [60, 110], scenario: [90, 160]};
const LINT = [
  [t => /journalctl\s+-b-1/i.test(t), 'Put a space before the 1: journalctl -b -1'],
  [t => /journalctl\s+-b\s+1\b/i.test(t), 'The previous boot is -b -1 (minus one). -b 1 means the oldest boot the journal has.'],
  [t => /\bdmesg\s+-t\b/.test(t), 'Readable timestamps use a capital T: dmesg -T'],
  [t => /\/var\/logs\b/i.test(t), 'The log folder is /var/log (no s).'],
  [t => /resolve\.conf/i.test(t), 'The DNS file is /etc/resolv.conf (no e after resolv).'],
  [t => /nvidia\s+smi\b|nvidiasmi/i.test(t), 'The command is nvidia-smi, with a hyphen.'],
  [t => /ethtool\s+-s\b/.test(t), 'Error counters need a capital S: ethtool -S (lower-case -s changes settings).'],
  [t => /dmidecode\s+memory|dmidecode\s+-t\s*mem\b/i.test(t), 'Write it as: dmidecode -t memory'],
  [t => /ipmitool\s+sel(?!\s+(e?list|clear|info))/i.test(t), 'Read the BMC event log with: ipmitool sel elist'],
  [t => /ipmi\s+tool/i.test(t), 'ipmitool is one word.'],
  [t => /\bifconfig\b/i.test(t), 'ifconfig works but is the older tool; the course uses ip a.'],
  [t => /\bip\s+-a\b/i.test(t), 'It is ip a, with no dash.'],
  [t => /\b(lnkcap|lnksta)\b/i.test(t) && /lspci\s+-vv/i.test(t) && !/sudo\s+lspci/i.test(t), 'LnkCap and LnkSta only appear when you run sudo lspci -vv.'],
  [t => /^\s*(\d+[.)]\s*|[-*]\s*)?(Lspci|Dmesg|Grep|Journalctl|Ipmitool|Ethtool|Nvidia-smi|Lsblk|Lscpu|Dmidecode|Sudo|Nvme|Nslookup|Systemctl)\b/m.test(t), 'Linux is case-sensitive: commands are lower case. Autocorrect may have capitalised one at the start of a line.']

      h('section', {class: 'stack'}, h('div', {class: 'sec-title'}, h('span', {class: 'eyebrow'}, 'From your Review Maps'), h('h2', {}, weak.length ? 'Restudy these' : 'Nothing marked Partly or Missed yet')), weak.length ? h('div', {class: 'mgrid'}, weak.map(missionCard)) : h('p', {class: 'muted'}, 'Self-grade missions as Got it / Partly / Missed and they will appear here with the modules to reread.')),
      ta, foot());
  }

  /* ---------- router ---------- */
  function route() {
    cleanup(); clearInterval(timer);
    const id = (location.hash || '#start').slice(1) || 'start';
    let page;
    try {
      const mod = MODULES.find(m => m.id === id); const mis = MISSIONS.find(q => q.id === id);
      if (mod) page = pageModule(mod);
      else if (mis) page = pageMission(mis);
      else if (WRITTEN_ROUTES[id]) page = WRITTEN_ROUTES[id]();
      else if (id === 'setA') page = pageSet('A');
      else if (id === 'setB') page = pageSet('B');
      else if (id === 'handson') page = pageHandson();
      else if (id === 'sandbox') page = pageSandbox();
      else if (id === 'ref') page = pageRef();
      else if (id === 'exam') page = pageExam();
      else if (id === 'ready') page = pageReady();
      else page = pageStart();
    } catch (e) { console.error(e); page = h('div', {class: 'page'}, h('h2', {}, 'This page failed to load'), h('pre', {class: 'out'}, String(e && e.stack || e))); }
    main.innerHTML = ''; main.appendChild(page);
    drawRail(); drawBezel(); closeRail();
    window.scrollTo(0, 0);
  }
  function init() {
    const themes = ['system', 'dark', 'light']; let ti = themes.indexOf(S.theme || 'system');
    const applyTheme = () => { const t = themes[ti]; if (t === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); document.getElementById('themeLbl').textContent = {system: 'Auto', dark: 'Dark', light: 'Light'}[t]; };
    applyTheme();
    document.getElementById('themeBtn').addEventListener('click', () => { ti = (ti + 1) % 3; S.theme = themes[ti]; save(); applyTheme(); });
    document.getElementById('menuBtn').addEventListener('click', toggleRail);
    document.addEventListener('keydown', e => { if (e.key === '[' && !e.ctrlKey && !e.metaKey && !e.altKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) && !e.target.isContentEditable) { e.preventDefault(); toggleRail(); } });
    window.addEventListener('resize', applyRail);
    applyRail();
    document.getElementById('scrim').addEventListener('click', closeRail);
    window.addEventListener('hashchange', route);
    updRank(); route();
  }
  const go = id => { if ((location.hash || '#start') === '#' + id) route(); else location.hash = id; };
  const refreshUi = () => { drawRail(); drawBezel(); };
  return {init, award, toast, track, save, refresh: refreshUi, go, pending: null, get state() { return S; }};
})();
window.App = App;
App.init();
</script>
